name: REA image - MAVideo
'on':
  push:
    paths:
    - .github/workflows/rea-image-mavideo.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MAVideo.framework/MAVideo
      artifact: rea-image-mavideo

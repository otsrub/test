name: REA Logic manual dispatch diagnosis
'on':
  push:
    paths:
      - .github/workflows/rea-logic-manual-dispatch.yml
permissions:
  contents: read
  actions: read
jobs:
  manual-original-byte-review:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rea-clean-source-package-and-rebuild-evidence
          run-id: '38751580429'
          github-token: ${{ github.token }}
          path: prior
      - uses: actions/download-artifact@v4
        with:
          name: rea-original-input-logic
          run-id: '38670888947'
          github-token: ${{ github.token }}
          path: logic-input
      - uses: actions/download-artifact@v4
        with:
          name: rea-profile-target-logic-8b493c
          run-id: '38670888947'
          github-token: ${{ github.token }}
          path: logic-first
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned reference emulator
        run: python -m pip install unicorn==2.1.4 capstone==5.0.6
      - name: Stage manual candidate and read-only probes
        shell: python
        run: |
          import pathlib,base64
          p=pathlib.Path('assets');p.mkdir(exist_ok=True)
          assets={"logic_dispatch_review.py":"","payload_inventory.py":"","Logic_8b493c.manual.pseudo":"","LOGIC_REVIEW.md":""}
          for name,data in assets.items():(p/name).write_bytes(base64.b64decode(data))
      - name: Check original dispatch and post-parser blocks without executing callees
        run: python assets/logic_dispatch_review.py logic-input/target.bin logic-first/procedure-info.json logic-review
      - name: Preserve evidence and unchanged checkpoints
        if: always()
        run: |
          mkdir -p evidence
          cp -R assets logic-review logic-first logic-input evidence/
          cp -R prior evidence/prior-clean-source-checkpoint
          cp assets/LOGIC_REVIEW.md "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rea-logic-manual-dispatch-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 90

name: REA remaining-boundary original-byte dossiers
'on':
  push:
    paths:
    - .github/workflows/rea-boundary-dossiers.yml
permissions:
  contents: read
  actions: read
jobs:
  unknown-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ github.run_attempt == 1 }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: rea-twelve-function-tagged-source-evidence
        run-id: '38730025108'
        github-token: ${{ github.token }}
        path: prior
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned instruction decoder
      run: python -m pip install capstone==5.0.6
    - name: Stage read-only dossier collector
      shell: python
      run: 'import pathlib,base64

        p=pathlib.Path("evidence");p.mkdir(exist_ok=True)

        assets={''collect_unknown_boundaries.py'': '''',
        ''payload_inventory.py'': ''''}

        for name,data in assets.items():(p/name).write_bytes(base64.b64decode(data))

        '
    - name: Hash original archive and collect only the 80 unresolved extents
      run: 'set -eu

        curl --fail --location --retry 3 https://github.com/otsrub/test/releases/download/mobilelogic-3.4-archive/MobileLogic.zip
        -o MobileLogic.zip

        python evidence/collect_unknown_boundaries.py MobileLogic.zip prior/prior-import-tail-checkpoint/second-pass/boundary-second-pass.json
        evidence/dossiers

        cp -R prior evidence/prior-twelve-function-checkpoint'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rea-eighty-original-boundary-dossiers
        path: evidence/
        if-no-files-found: error
        retention-days: 90

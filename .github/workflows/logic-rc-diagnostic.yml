name: Logic request context and pending-task trace v7
on:
  push:
    branches: [logic-rc-diagnostic]
    paths: [.github/workflows/logic-rc-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Build v7 diagnostic dylib
        shell: bash
        run: |
          cat > Trace.m <<'OBJC'
          #import <Foundation/Foundation.h>
          #import <objc/runtime.h>
          #import <dispatch/dispatch.h>
          typedef id (*TaskIMP)(id,SEL,id,id);
          static TaskIMP orig; static dispatch_queue_t q; static NSString *p; static NSUInteger seq;
          static void L(NSString*s){if(!q)q=dispatch_queue_create("logic.trace.v7",DISPATCH_QUEUE_SERIAL);dispatch_async(q,^{@autoreleasepool{if(!p){NSString*d=NSSearchPathForDirectoriesInDomains(NSDocumentDirectory,NSUserDomainMask,YES).firstObject?:NSTemporaryDirectory();p=[d stringByAppendingPathComponent:@"LogicNetworkTrace-v7.txt"];}NSFileHandle*f=[NSFileHandle fileHandleForWritingAtPath:p];NSString*l=[NSString stringWithFormat:@"%@ %@\n",[NSDate date],s];if(f){[f seekToEndOfFile];[f writeData:[l dataUsingEncoding:NSUTF8StringEncoding]];[f closeFile];}else[l writeToFile:p atomically:YES encoding:NSUTF8StringEncoding error:nil];}});}
          static NSString*Val(NSDictionary*d,NSString*k){id v=d[k];if(!v||v==[NSNull null])return @"absent";if(![v isKindOfClass:[NSString class]]&&![v isKindOfClass:[NSNumber class]])return @"non-scalar";NSString*s=[v description];if(s.length>40)s=[[s substringToIndex:40]stringByAppendingString:@"…"];s=[[s componentsSeparatedByCharactersInSet:[NSCharacterSet newlineCharacterSet]] componentsJoinedByString:@"_"];return s;}
          static void Pending(id t,NSString*host,NSUInteger n,int sec){dispatch_after(dispatch_time(DISPATCH_TIME_NOW,(int64_t)(sec*NSEC_PER_SEC)),dispatch_get_global_queue(QOS_CLASS_UTILITY,0),^{NSURLResponse*r=[t response];NSInteger status=[r isKindOfClass:[NSHTTPURLResponse class]]?[(NSHTTPURLResponse*)r statusCode]:0;L([NSString stringWithFormat:@"pending-check request=#%lu after=%ds host=%@ state=%ld status=%ld received=%lld expected=%lld",(unsigned long)n,sec,host,(long)[t state],(long)status,(long long)[t countOfBytesReceived],(long long)[t countOfBytesExpectedToReceive]]);});}
          static id H(id self,SEL cmd,NSURLRequest*r,id block){NSUInteger n=__atomic_add_fetch(&seq,1,__ATOMIC_RELAXED);NSString*host=r.URL.host?:@"none";NSString*method=r.HTTPMethod?:@"GET";NSData*body=r.HTTPBody;NSString*ctx=@"none";if(body.length){id root=[NSJSONSerialization JSONObjectWithData:body options:NSJSONReadingFragmentsAllowed error:nil];if([root isKindOfClass:[NSDictionary class]]){NSDictionary*d=root;NSDictionary*dev=[d[@"deviceInfo"] isKindOfClass:[NSDictionary class]]?d[@"deviceInfo"]:@{};ctx=[NSString stringWithFormat:@"app=%@ build=%@ os=%@ deviceClass=%@ deviceType=%@ country=%@",Val(dev,@"appVersion"),Val(dev,@"buildNumber"),Val(dev,@"osVersion"),Val(dev,@"deviceClass"),Val(dev,@"deviceType"),Val(dev,@"countryCode")];}}L([NSString stringWithFormat:@"request #%lu method=%@ host=%@ body_bytes=%lu safe_context={%@}",(unsigned long)n,method,host,(unsigned long)body.length,ctx]);void(^wrapped)(NSData*,NSURLResponse*,NSError*)=^(NSData*d,NSURLResponse*resp,NSError*e){NSHTTPURLResponse*h=[resp isKindOfClass:[NSHTTPURLResponse class]]?(id)resp:nil;L([NSString stringWithFormat:@"response #%lu host=%@ status=%ld bytes=%lu body=redacted error=%@/%ld",(unsigned long)n,host,(long)h.statusCode,(unsigned long)d.length,e.domain?:@"none",(long)e.code]);((void(^)(NSData*,NSURLResponse*,NSError*))block)(d,resp,e);};id t=orig(self,cmd,r,[wrapped copy]);if([host isEqualToString:@"audiocontentdownload.apple.com"]&&t){L([NSString stringWithFormat:@"task-created request=#%lu state=%ld",(unsigned long)n,(long)[t state]]);Pending(t,host,n,5);Pending(t,host,n,30);}return t;}
          __attribute__((constructor))static void Start(void){if(![NSBundle.mainBundle.bundleIdentifier isEqualToString:@"com.apple.mobilelogic"])return;L(@"network trace v7 loaded");Class c=objc_getClass("NSURLSession");SEL s=@selector(dataTaskWithRequest:completionHandler:);Method m=class_getInstanceMethod(c,s);if(m){orig=(TaskIMP)method_getImplementation(m);method_setImplementation(m,(IMP)H);L(@"NSURLSession completion hook installed");}}
          OBJC
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc -isysroot "$SDK" -miphoneos-version-min=15.0 -install_name @rpath/LogicNetworkTrace.dylib -framework Foundation -o LogicNetworkTrace.dylib Trace.m
          file LogicNetworkTrace.dylib
      - name: Upload v7 dylib
        uses: actions/upload-artifact@v4
        with:
          name: logic-request-context-trace-v7-dylib
          path: LogicNetworkTrace.dylib
          retention-days: 30
          if-no-files-found: error

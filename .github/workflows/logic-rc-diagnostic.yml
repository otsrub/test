name: Logic remote-config diagnostic tweak v3
on:
  push:
    branches: [logic-rc-diagnostic]
    paths: [.github/workflows/logic-rc-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Build arm64 diagnostic dylib
        shell: bash
        run: |
          cat > LogicRCDiagnostic.m <<'OBJC'
          #import <Foundation/Foundation.h>
          #import <objc/runtime.h>
          #import <dispatch/dispatch.h>
          #import <mach-o/dyld.h>
          typedef void (*FetchIMP)(id, SEL, id, dispatch_queue_t, id);
          static FetchIMP originalFetch;
          static BOOL installed;
          static dispatch_queue_t q;
          static NSString *path;
          static int seq;
          static void Log(NSString *s) {
            if (!q) q = dispatch_queue_create("logic.rcdiag.log", DISPATCH_QUEUE_SERIAL);
            dispatch_async(q, ^{ @autoreleasepool {
              if (!path) { NSString *d = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES).firstObject ?: NSTemporaryDirectory(); path = [d stringByAppendingPathComponent:@"LogicRemoteConfigDiagnostic-v3.txt"]; if (![[NSFileManager defaultManager] fileExistsAtPath:path]) [[NSString stringWithFormat:@"Logic RC diagnostic v3 %@\n", [NSDate date]] writeToFile:path atomically:YES encoding:NSUTF8StringEncoding error:nil]; }
              NSFileHandle *f = [NSFileHandle fileHandleForWritingAtPath:path]; NSString *line = [NSString stringWithFormat:@"%@ %@\n", [NSDate date], s]; if (f) { [f seekToEndOfFile]; [f writeData:[line dataUsingEncoding:NSUTF8StringEncoding]]; [f closeFile]; } else [line writeToFile:path atomically:YES encoding:NSUTF8StringEncoding error:nil];
            }});
          }
          static NSString *HTTP(NSError *e) {
            NSDictionary *u=e.userInfo; id st=u[@"RCErrorHTTPStatusCode"]; id raw=u[@"RCErrorHTTPURL"]; NSURL *url=[raw isKindOfClass:[NSURL class]]?raw:([raw isKindOfClass:[NSString class]]?[NSURL URLWithString:raw]:nil); id h=u[@"RCErrorHTTPResponseHeaders"]; NSMutableArray *hs=[NSMutableArray array];
            if ([h isKindOfClass:[NSDictionary class]]) for (NSString *k in @[@"Content-Type",@"Content-Length",@"Retry-After",@"Server",@"Via"]) { id v=h[k]?:h[k.lowercaseString]; if (v) [hs addObject:([k isEqualToString:@"Server"]||[k isEqualToString:@"Via"]?[k stringByAppendingString:@"=present"]:[NSString stringWithFormat:@"%@=%@",k,v])]; }
            return [NSString stringWithFormat:@"http_status=%@ host=%@ headers={%@}",st?:@"none",url.host?:@"none",hs.count?[hs componentsJoinedByString:@","]:@"none"];
          }
          static void Hook(id self, SEL cmd, id settings, dispatch_queue_t queue, id object) {
            void (^done)(id,id,id,NSError *)=object; if(!done||!originalFetch){if(originalFetch)originalFetch(self,cmd,settings,queue,object);return;}
            int n=__sync_add_and_fetch(&seq,1); Log([NSString stringWithFormat:@"request=%d stack=%@",n,[[NSThread callStackSymbols] componentsJoinedByString:@" | "]]);
            void (^cb)(id,id,id,NSError *)=^(id a,id b,id c,NSError *e){ if(!e){Log([NSString stringWithFormat:@"request=%d result=success",n]);done(a,b,c,nil);return;} Log([NSString stringWithFormat:@"request=%d result=error domain=%@ code=%ld %@",n,e.domain,(long)e.code,HTTP(e)]); done(a,b,c,e); };
            originalFetch(self,cmd,settings,queue,[cb copy]);
          }
          static void Try(void){if(installed)return;Class c=objc_getClass("RCEConfigurationManager");SEL s=sel_registerName("fetchSingleConfigurationWithSettings:completionQueue:completion:");Method m=c?class_getInstanceMethod(c,s):NULL;if(m){originalFetch=(FetchIMP)method_getImplementation(m);method_setImplementation(m,(IMP)Hook);installed=YES;Log(@"hook installed");}}
          static void Added(const struct mach_header *h,intptr_t s){(void)h;(void)s;Try();}
          __attribute__((constructor)) static void Start(void){if(![NSBundle.mainBundle.bundleIdentifier isEqualToString:@"com.apple.mobilelogic"])return;Log(@"tweak v3 loaded");Try();_dyld_register_func_for_add_image(Added);for(int i=1;i<=60;i++)dispatch_after(dispatch_time(DISPATCH_TIME_NOW,(int64_t)i*NSEC_PER_SEC),dispatch_get_main_queue(),^{Try();});}
          OBJC
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc -isysroot "$SDK" -miphoneos-version-min=15.0 -install_name @rpath/LogicRCDiagnostic.dylib -framework Foundation -framework UIKit -o LogicRCDiagnostic.dylib LogicRCDiagnostic.m
          file LogicRCDiagnostic.dylib
          shasum -a 256 LogicRCDiagnostic.dylib
      - name: Retain tweak artifact
        uses: actions/upload-artifact@v4
        with:
          name: logic-rc-diagnostic-v3-dylib
          path: LogicRCDiagnostic.dylib
          retention-days: 30
          if-no-files-found: error


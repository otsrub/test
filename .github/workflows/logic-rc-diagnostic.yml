name: Logic network trace v5
on:
  push:
    branches: [logic-rc-diagnostic]
    paths: [.github/workflows/logic-rc-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Build network trace dylib
        shell: bash
        run: |
          cat > Trace.m <<'OBJC'
          #import <Foundation/Foundation.h>
          #import <objc/runtime.h>
          #import <dispatch/dispatch.h>
          #import <mach-o/dyld.h>
          typedef id (*TaskIMP)(id,SEL,id,id);
          static TaskIMP orig; static dispatch_queue_t q; static NSString *p;
          static void L(NSString*s){if(!q)q=dispatch_queue_create("logic.nettrace",DISPATCH_QUEUE_SERIAL);dispatch_async(q,^{@autoreleasepool{if(!p){NSString*d=NSSearchPathForDirectoriesInDomains(NSDocumentDirectory,NSUserDomainMask,YES).firstObject?:NSTemporaryDirectory();p=[d stringByAppendingPathComponent:@"LogicNetworkTrace-v5.txt"];}NSFileHandle*f=[NSFileHandle fileHandleForWritingAtPath:p];NSString*l=[NSString stringWithFormat:@"%@ %@\n",[NSDate date],s];if(f){[f seekToEndOfFile];[f writeData:[l dataUsingEncoding:NSUTF8StringEncoding]];[f closeFile];}else[l writeToFile:p atomically:YES encoding:NSUTF8StringEncoding error:nil];}});}
          static id H(id self,SEL cmd,NSURLRequest*r,id block){NSString*host=r.URL.host?:@"none";NSString*method=r.HTTPMethod?:@"GET";NSString*type=[r valueForHTTPHeaderField:@"Content-Type"]?:@"none";NSUInteger len=r.HTTPBody.length;L([NSString stringWithFormat:@"request method=%@ host=%@ content_type=%@ body_bytes=%lu",method,host,type,(unsigned long)len]);void(^wrapped)(NSData*,NSURLResponse*,NSError*)=^(NSData*d,NSURLResponse*resp,NSError*e){NSHTTPURLResponse*h=[resp isKindOfClass:[NSHTTPURLResponse class]]?(id)resp:nil;NSString*b=@"none";if(d.length&&d.length<=512){NSString*s=[[NSString alloc]initWithData:d encoding:NSUTF8StringEncoding];if(s)b=[s stringByReplacingOccurrencesOfString:@"\n" withString:@" "];}L([NSString stringWithFormat:@"response host=%@ status=%ld bytes=%lu body=%@ error=%@/%ld",host,(long)h.statusCode,(unsigned long)d.length,b,e.domain?:@"none",(long)e.code]);((void(^)(NSData*,NSURLResponse*,NSError*))block)(d,resp,e);};return orig(self,cmd,r,[wrapped copy]);}
          __attribute__((constructor))static void Start(void){if(![NSBundle.mainBundle.bundleIdentifier isEqualToString:@"com.apple.mobilelogic"])return;L(@"network trace v5 loaded");Class c=objc_getClass("NSURLSession");SEL s=@selector(dataTaskWithRequest:completionHandler:);Method m=class_getInstanceMethod(c,s);if(m){orig=(TaskIMP)method_getImplementation(m);method_setImplementation(m,(IMP)H);L(@"NSURLSession completion hook installed");}}
          OBJC
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc -isysroot "$SDK" -miphoneos-version-min=15.0 -install_name @rpath/LogicNetworkTrace.dylib -framework Foundation -o LogicNetworkTrace.dylib Trace.m
          file LogicNetworkTrace.dylib
      - name: Upload trace dylib
        uses: actions/upload-artifact@v4
        with:
          name: logic-network-trace-v5-dylib
          path: LogicNetworkTrace.dylib
          retention-days: 30
          if-no-files-found: error

name: REA image - OrderedCollections
'on':
  push:
    paths:
    - .github/workflows/rea-image-orderedcollections.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/OrderedCollections.framework/OrderedCollections
      artifact: rea-image-orderedcollections

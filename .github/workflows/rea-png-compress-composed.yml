name: REA PNG compressor native size-helper composition
'on':
  push:
    paths:
      - .github/workflows/rea-png-compress-composed.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: rea-png-compress-composed
  cancel-in-progress: false
jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rea-png-compression-dependency-dossier
          run-id: '40040659951'
          github-token: ${{ github.token }}
          path: prior
      - name: Install bounded source test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          python -m pip install unicorn==2.1.4
      - name: Compare original entry and actual native size helper against composed source
        run: python reconstruction/verify_png_compress_composed.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rea-png-compress-composed-evidence
          path: |
            png-compress-composed/
            reconstruction/macore_png_compress_composed.c
            reconstruction/macore_png_compress_prefix.c
            reconstruction/macore_png_uncompressed_size.c
            reconstruction/verify_png_compress_composed.py
          retention-days: 90
          if-no-files-found: error

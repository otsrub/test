name: REA final gap recovery and verification
'on':
  push:
    paths:
    - .github/workflows/rea-final-verification.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: rea-final-gap-verification
  cancel-in-progress: false
jobs:
  recover-gaps:
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
        - short: logic
          image: Frameworks/Logic.framework/Logic
        - short: madsp
          image: Frameworks/MADSP.framework/MADSP
        - short: macore
          image: Frameworks/MACore.framework/MACore
        - short: maplugingui
          image: Frameworks/MAPlugInGUI.framework/MAPlugInGUI
        - short: magenerativeinstruments
          image: Frameworks/MAGenerativeInstruments.framework/MAGenerativeInstruments
    env:
      TARGET_IMAGE: ${{ matrix.image }}
      FOCUS_PATHS: '["${{ matrix.image }}"]'
      SHARD: final-gaps
      REA_GHIDRA_STARTUP_TIMEOUT_MS: '3600000'
      GHIDRA_HEADLESS_MAXMEM: 3G
      BASELINE_RUN: merged-final-coverage-2026-10-14
      PARTITION_COUNT: '1'
      PARTITION_INDEX: '0'
    steps:
    - name: Write immutable missing-address allowlist
      run: "mkdir -p recovery baseline\ncat > targets.json <<'TARGETS'\n{\n  \"Frameworks/Logic.framework/Logic\": {\n   \
        \ \"sha256\": \"8dc0169c2d2bd0b15a48340a9f1c1508315cd33a2cce3f49704de5ba51734287\",\n    \"addresses\": [\n      \"\
        0x20eed8\",\n      \"0x24c844\",\n      \"0x30d514\",\n      \"0x3115ac\",\n      \"0x3c49c8\",\n      \"0x4c17d4\"\
        ,\n      \"0x52c3ac\",\n      \"0x5db01c\",\n      \"0x706100\",\n      \"0x777cf8\",\n      \"0x8b493c\",\n     \
        \ \"0x8d4ba0\",\n      \"0xd2cc5c\"\n    ]\n  },\n  \"Frameworks/MADSP.framework/MADSP\": {\n    \"sha256\": \"8b7cbaa383d3050241921e74d1334b22703193afed6ea5e9388599cc42a60fe8\"\
        ,\n    \"addresses\": [\n      \"0xfdc4\",\n      \"0xa946c\",\n      \"0xc72b0\",\n      \"0x449cf0\",\n      \"\
        0x8961a8\",\n      \"0x8afac0\",\n      \"0x8cb148\",\n      \"0x910100\",\n      \"0x93ef7c\",\n      \"0x967204\"\
        ,\n      \"0x984840\",\n      \"0x9a1e5c\",\n      \"0x9ccfd4\",\n      \"0x9f7ec8\",\n      \"0xa1c290\",\n     \
        \ \"0xa4b79c\",\n      \"0xa80a08\",\n      \"0xaa6938\",\n      \"0xadae18\",\n      \"0xb0c024\",\n      \"0xb3497c\"\
        ,\n      \"0xb693e4\",\n      \"0xbbb238\",\n      \"0xbdca90\",\n      \"0xc07630\",\n      \"0xc12a38\",\n     \
        \ \"0xc141a8\"\n    ]\n  },\n  \"Frameworks/MACore.framework/MACore\": {\n    \"sha256\": \"88a8d93c6cb4b411648601efdfc5ca2863c3b833339e55e2470369df1d3bc9d5\"\
        ,\n    \"addresses\": [\n      \"0x3c144\",\n      \"0xc6d64\"\n    ]\n  },\n  \"Frameworks/MAPlugInGUI.framework/MAPlugInGUI\"\
        : {\n    \"sha256\": \"74caec7240779c9be25d4dbf9fde574a2783c8192cca262866b1511bb01fe1b4\",\n    \"addresses\": [\n\
        \      \"0x25210\",\n      \"0x26390\"\n    ]\n  },\n  \"Frameworks/MAGenerativeInstruments.framework/MAGenerativeInstruments\"\
        : {\n    \"sha256\": \"cf2e3dc0b233e6e1a878a4040095494d57b0ab97b8ed461b16960d232d6d10d7\",\n    \"addresses\": [\n\
        \      \"0x77858\",\n      \"0xeecb8\"\n    ]\n  }\n}\nTARGETS\npython - <<'PY'\nimport json,pathlib,os\np=json.load(open('targets.json'));image=os.environ['TARGET_IMAGE'];assert\
        \ image in p\npathlib.Path('baseline/coverage.json').write_text(json.dumps({'images':[{'path':image,'sha256':p[image]['sha256'],'function_status':[],'decompiled':0}]}))\n\
        PY\n"
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
    - name: Install verified analysis engines
      run: 'mkdir -p tools evidence runtime-tmp

        curl -fL --retry 3 -o ghidra.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip

        printf ''%s  %s\n'' ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db ghidra.zip | sha256sum -c -

        unzip -q ghidra.zip -d tools

        npm install --prefix rea-tool --no-audit --no-fund rea-agents@6.4.0

        echo "GHIDRA_INSTALL_DIR=$PWD/tools/ghidra_12.1.4_PUBLIC" >> "$GITHUB_ENV"

        echo "TMPDIR=$PWD/runtime-tmp" >> "$GITHUB_ENV"

        '
    - name: Download and inventory entire payload
      run: "curl -fL --retry 3 -o MobileLogic.zip https://github.com/otsrub/test/releases/download/mobilelogic-3.4-archive/MobileLogic.zip\n\
        mkdir -p recovery\ncat > recovery/prepare.py <<'SOURCE'\nimport collections\nimport hashlib\nimport json\nimport pathlib\n\
        import struct\nimport zipfile\n\nARCHIVE_SHA256 = 'f2a650fd7a51a7bb2bc5e8e5cc35a95236c02723ab3faeb162cca64ee62a744e'\n\
        root = pathlib.Path('MobileLogic.app').resolve()\nroot.mkdir(exist_ok=True)\narchive = pathlib.Path('MobileLogic.zip')\n\
        assert hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest() == ARCHIVE_SHA256\nresources = []\nwith zipfile.ZipFile(archive)\
        \ as z:\n    for item in z.infolist():\n        if item.is_dir() or item.filename.startswith('__MACOSX/'):\n     \
        \       continue\n        dest = (root / item.filename).resolve()\n        if not dest.is_relative_to(root):\n   \
        \         raise ValueError('Unsafe archive path: ' + item.filename)\n        dest.parent.mkdir(parents=True, exist_ok=True)\n\
        \        digest = hashlib.sha256()\n        with z.open(item) as src, dest.open('wb') as out:\n            while chunk\
        \ := src.read(1024 * 1024):\n                digest.update(chunk)\n                out.write(chunk)\n        resources.append({'path':\
        \ item.filename, 'bytes': item.file_size, 'sha256': digest.hexdigest(), 'archive_mode': item.external_attr >> 16})\n\
        \nimages = []\nunsupported = []\nfor resource in resources:\n    path = root / resource['path']\n    with path.open('rb')\
        \ as f:\n        magic = f.read(4)\n    if magic not in [bytes.fromhex(h) for h in ['cffaedfe', 'cefaedfe', 'cafebabe',\
        \ 'bebafeca', 'cafebabf', 'bfbafeca']]:\n        continue\n    if magic != bytes.fromhex('cffaedfe'):\n        unsupported.append({**resource,\
        \ 'reason': 'Manifest parser supports thin little-endian Mach-O 64 only'})\n        continue\n    b = path.read_bytes()\n\
        \    cpu, subtype, kind, ncmds = struct.unpack_from('<IIII', b, 4)\n    offset = 32\n    image = {**resource, 'cpu_type':\
        \ cpu, 'cpu_subtype': subtype, 'file_type': kind, 'segments': [], 'sections': [], 'dependencies': [], 'encryption':\
        \ [], 'compiler_function_starts': [], 'code_bytes': 0}\n    text_base = None\n    function_start_data = None\n   \
        \ for _ in range(ncmds):\n        cmd, size = struct.unpack_from('<II', b, offset)\n        assert size >= 8 and offset\
        \ + size <= len(b)\n        if cmd == 0x19:\n            name = b[offset+8:offset+24].split(b'\\0')[0].decode()\n\
        \            vmaddr, vmsize, fileoff, filesize = struct.unpack_from('<QQQQ', b, offset+24)\n            image['segments'].append({'name':\
        \ name, 'vmaddr': hex(vmaddr), 'vmsize': vmsize, 'fileoff': fileoff, 'filesize': filesize})\n            if name ==\
        \ '__TEXT':\n                text_base = vmaddr\n            nsects = struct.unpack_from('<I', b, offset+64)[0]\n\
        \            for i in range(nsects):\n                pos = offset + 72 + 80 * i\n                assert pos + 80\
        \ <= offset + size\n                sectname = b[pos:pos+16].split(b'\\0')[0].decode()\n                addr, length,\
        \ section_fileoff = struct.unpack_from('<QQI', b, pos+32)\n                flags = struct.unpack_from('<I', b, pos+64)[0]\n\
        \                image['sections'].append({'segment': name, 'name': sectname, 'address': hex(addr), 'bytes': length,\
        \ 'fileoff': section_fileoff, 'flags': flags})\n                if flags & 0x80000400:\n                    image['code_bytes']\
        \ += length\n        elif cmd == 0x26:\n            start, length = struct.unpack_from('<II', b, offset+8)\n     \
        \       function_start_data = b[start:start+length]\n        elif cmd in (0x21, 0x2c):\n            start, length,\
        \ cryptid = struct.unpack_from('<III', b, offset+8)\n            image['encryption'].append({'offset': start, 'bytes':\
        \ length, 'cryptid': cryptid})\n        elif cmd in (0xc, 0x80000018, 0x8000001f, 0x80000023):\n            nameoff\
        \ = struct.unpack_from('<I', b, offset+8)[0]\n            image['dependencies'].append(b[offset+nameoff:offset+size].split(b'\\\
        0')[0].decode(errors='replace'))\n        offset += size\n    if function_start_data is not None and text_base is\
        \ not None:\n        cursor = 0\n        address = text_base\n        while cursor < len(function_start_data):\n \
        \           shift = value = 0\n            while True:\n                byte = function_start_data[cursor]\n     \
        \           cursor += 1\n                value |= (byte & 0x7f) << shift\n                if not byte & 0x80:\n  \
        \                  break\n                shift += 7\n                assert shift <= 63\n            if value ==\
        \ 0:\n                break\n            address += value\n            image['compiler_function_starts'].append(hex(address))\n\
        \    images.append(image)\n\nloads = [0] * 10\nbuckets = [[] for _ in loads]\nfor image in sorted(images, key=lambda\
        \ i: (-i['code_bytes'], i['path'])):\n    shard = min(range(10), key=lambda j: (loads[j], j))\n    image['shard']\
        \ = shard\n    buckets[shard].append(image['path'])\n    loads[shard] += image['code_bytes']\nout = pathlib.Path('evidence')\n\
        out.mkdir(exist_ok=True)\nmanifest = {'archive_sha256': ARCHIVE_SHA256, 'images': images, 'unsupported_native_images':\
        \ unsupported, 'shards': buckets, 'shard_code_bytes': loads, 'resource_count': len(resources), 'scope': 'Static recovery\
        \ only; compiler function starts do not prove all original source functions.'}\n(out/'manifest.json').write_text(json.dumps(manifest,\
        \ indent=2))\n(out/'resource-inventory.json').write_text(json.dumps(resources, indent=2))\nprint(json.dumps({'native_images':\
        \ len(images), 'unsupported_native_images': len(unsupported), 'shard_code_bytes': loads}))\n\nSOURCE\npython recovery/prepare.py\n"
    - name: Recover only missing addresses with at most two bounded processes
      run: "cat > recovery/recover.mjs <<'SOURCE'\nimport { Client } from '../rea-tool/node_modules/@modelcontextprotocol/client/dist/index.mjs';\n\
        import { StdioClientTransport } from '../rea-tool/node_modules/@modelcontextprotocol/client/dist/stdio.mjs';\nimport\
        \ fs from 'node:fs/promises';\nimport { createWriteStream } from 'node:fs';\nimport { createGzip } from 'node:zlib';\n\
        import { pipeline } from 'node:stream/promises';\nimport { once } from 'node:events';\nimport path from 'node:path';\n\
        import { createHash } from 'node:crypto';\n\nconst manifest = JSON.parse(await fs.readFile('evidence/manifest.json',\
        \ 'utf8'));\nconst shard = process.env.SHARD ?? 'pilot';\nconst selected = process.env.FOCUS_PATHS ? JSON.parse(process.env.FOCUS_PATHS)\
        \ : shard === 'pilot' ? ['MobileLogic'] : manifest.shards[Number(shard)];\nconst partitionCount = Number(process.env.PARTITION_COUNT\
        \ ?? 1);\nconst partitionIndex = Number(process.env.PARTITION_INDEX ?? 0);\nif (!Number.isInteger(partitionCount)\
        \ || partitionCount < 1 || !Number.isInteger(partitionIndex) || partitionIndex < 0 || partitionIndex >= partitionCount)\
        \ throw new Error('Invalid partition');\nconst inventoryOnly = process.env.INVENTORY_ONLY === '1';\nconst filter =\
        \ process.env.FUNCTION_FILTER ? new RegExp(process.env.FUNCTION_FILTER, 'i') : null;\nif (!selected) throw new Error('Unknown\
        \ shard');\nconst baseline = JSON.parse(await fs.readFile('baseline/coverage.json', 'utf8'));\nconst targetPlan=JSON.parse(await\
        \ fs.readFile('targets.json','utf8'));\nconst normalized=a=>BigInt(a).toString(16); \nconst summary = { shard, partition:\
        \ {count: partitionCount, index: partitionIndex}, selection_filter: process.env.FUNCTION_FILTER ?? null, archive_sha256:\
        \ manifest.archive_sha256, images: [], complete: false, status: 'running', fidelity: 'Ghidra static pseudocode, not\
        \ original source or a verified buildable reconstruction' };\nawait fs.mkdir('evidence/recovered', { recursive: true\
        \ });\nconst saveSummary = () => fs.writeFile('evidence/coverage.json', JSON.stringify(summary, null, 2));\nawait\
        \ saveSummary();\n\nfunction unwrap(result) {\n  if (result.structuredContent !== undefined) return result.structuredContent;\n\
        \  const text = result.content?.filter(x => x.type === 'text').map(x => x.text).join('');\n  if (!text) throw new\
        \ Error('MCP result has no machine-readable content');\n  return JSON.parse(text);\n}\nasync function recover(image)\
        \ {\n  const expected=targetPlan[image.path];\n  if (!expected || expected.sha256!==image.sha256) throw new Error('Target\
        \ manifest image SHA mismatch');\n  const imageBytes=await fs.readFile(path.resolve('MobileLogic.app',image.path));\n\
        \  if(createHash('sha256').update(imageBytes).digest('hex')!==expected.sha256) throw new Error('Original binary SHA\
        \ mismatch');\n  const imageIndex = manifest.images.findIndex(x => x.path === image.path);\n  const dest = path.resolve('evidence/recovered',\
        \ String(imageIndex).padStart(3, '0'));\n  await fs.mkdir(dest, { recursive: true });\n  const prior = baseline.images.find(i\
        \ => i.path === image.path && i.sha256 === image.sha256);\n  if (!prior) throw new Error('Baseline image SHA mismatch');\n\
        \  const done = new Set(prior.function_status.filter(s => !s.errors?.length && ['recovered','external_import'].includes(s.pseudocode)\
        \ && ['recovered','empty','external_import'].includes(s.assembly) && ['recovered','external_import'].includes(s.info)\
        \ && ['recovered','external_import'].includes(s.references)).map(s => s.address));\n  if (process.env.SKIP_ATTEMPTED_FILE)\
        \ {\n    const attempted=JSON.parse(await fs.readFile(process.env.SKIP_ATTEMPTED_FILE,'utf8'));\n    for (const i\
        \ of attempted.images) if(i.path===image.path && i.sha256===image.sha256) for (const s of i.function_status) done.add(s.address);\n\
        \  }\n  const deferred = new Set(prior.function_status.filter(s => s.errors?.length).map(s => s.address));\n  if (image.path\
        \ === 'Frameworks/MADSP.framework/MADSP') deferred.add('0x8961a8');\n  const record = { deferred_addresses: [...deferred],\
        \ baseline_run: process.env.BASELINE_RUN, baseline_completed_records: done.size, baseline_pseudocode_entries: prior.decompiled,\
        \ path: image.path, sha256: image.sha256, directory: path.relative('evidence', dest), status: 'running', procedures:\
        \ 0, external_imports: 0, decompiled: 0, null_pseudocode: 0, errors: 0, assembly_recovered: 0, function_status: [],\
        \ unmatched_compiler_function_starts: [], limitations: [] };\n  summary.images.push(record);\n  await saveSummary();\n\
        \  let client;\n  let connected = false;\n  const gzip = createGzip({ level: 6 });\n  const gzipCompletion = pipeline(gzip,\
        \ createWriteStream(path.join(dest, 'rea-evidence.jsonl.gz')));\n  gzipCompletion.catch(() => {});\n  async function\
        \ evidence(value) {\n    if (!gzip.write(JSON.stringify(value) + '\\n')) await once(gzip, 'drain');\n  }\n  const\
        \ serverLog = createWriteStream(path.join(dest, 'server.log'));\n  await once(serverLog, 'open');\n  const transport\
        \ = new StdioClientTransport({ command: process.execPath, args: [path.resolve('rea-tool/node_modules/rea-agents/scripts/rea.mjs'),\
        \ '--mcp'], env: { ...process.env, REA_MCP_MAX_RESPONSE_BYTES: '67108864', NODE_OPTIONS: '--max-old-space-size=8192'\
        \ }, maxBufferSize: 67108864, stderr: serverLog });\n  try {\n    client = new Client({ name: 'mobilelogic-full-recovery',\
        \ version: '1.0.0' });\n    await client.connect(transport);\n    connected = true;\n    const { tools } = await client.listTools();\n\
        \    const available = new Set(tools.map(t => t.name));\n    const required = ['open_binary','close_binary','list_procedures','list_names','list_strings','list_segments','procedure_info','procedure_pseudo_code','procedure_assembly','procedure_references'];\n\
        \    for (const name of required) if (!available.has(name)) throw new Error('Required REA tool absent: ' + name);\n\
        \    async function call(name, args = {}) {\n      const timeoutMs = ['open_binary','list_procedures','list_names','list_strings','list_segments'].includes(name)\
        \ ? 3600000 : 120000;\n      const controller = new AbortController();\n      const started = Date.now();\n      await\
        \ fs.writeFile('evidence/active-call.json', JSON.stringify({name,args,started,timeoutMs}));\n      console.log(JSON.stringify({event:'call_started',tool:name,procedure:args.procedure\
        \ ?? null,timeoutMs}));\n      let timer;\n      let response;\n      try {\n        response = await Promise.race([client.callTool({name,arguments:args},{timeout:timeoutMs,resetTimeoutOnProgress:false,maxTotalTimeout:timeoutMs,signal:controller.signal}),new\
        \ Promise((_,reject)=>{timer=setTimeout(()=>{controller.abort();reject(new Error('Hard request deadline exceeded:\
        \ '+name));},timeoutMs);})]);\n      } finally { clearTimeout(timer); }\n      const value = unwrap(response);\n \
        \     await evidence({ tool: name, arguments: args, result: value, isError: Boolean(response.isError) });\n      if\
        \ (response.isError || value?.error) {\n        const error = new Error(JSON.stringify(value?.error ?? value));\n\
        \        error.toolResult = value;\n        throw error;\n      }\n      return value;\n    }\n    await call('open_binary',\
        \ { path: path.resolve('MobileLogic.app', image.path), provider_id: 'ghidra' });\n    const inventory = await call('list_procedures');\n\
        \    const procedures = inventory.normalized_result;\n    if (!Array.isArray(procedures)) throw new Error('Procedure\
        \ inventory is not an array');\n    procedures.sort((a,b) => a.address.localeCompare(b.address) || a.value.localeCompare(b.value));\n\
        \    record.inventory_sha256 = createHash('sha256').update(JSON.stringify(procedures.map(p => [p.address,p.value,p.procedure?.external\
        \ === true]))).digest('hex');\n    record.procedures = procedures.length;\n    if (!record.procedures) throw new Error('Empty\
        \ function inventory');\n    const addresses = new Set(procedures.map(p => p.address));\n    record.unmatched_compiler_function_starts\
        \ = image.compiler_function_starts.filter(a => !addresses.has(a));\n    await fs.writeFile(path.join(dest, 'procedures.json'),\
        \ JSON.stringify(inventory));\n    await fs.writeFile(path.join(dest, 'image.json'), JSON.stringify(image, null, 2));\n\
        \    for (const [tool, filename] of []) {\n      try { await fs.writeFile(path.join(dest, filename), JSON.stringify(await\
        \ call(tool))); }\n      catch (e) { record.limitations.push(tool + ': ' + e.message); }\n    }\n    const pseudoFile\
        \ = await fs.open(path.join(dest, 'recovered-pseudocode.c'), 'w');\n    const asmFile = await fs.open(path.join(dest,\
        \ 'recovered-assembly.txt'), 'w');\n    try {\n      await pseudoFile.write('/* Static Ghidra pseudocode recovered\
        \ via REA. NOT original source or verified compilable C. */\\n');\n      const planned = new Set(expected.addresses.map(normalized));\n\
        \      const targets = procedures.filter((p,i) => planned.has(normalized(p.address)) && !done.has(p.address) && !inventoryOnly\
        \ && i % partitionCount === partitionIndex && (!filter || filter.test(p.value))).sort((a,b) => Number(deferred.has(a.address))-Number(deferred.has(b.address)));\n\
        \      await fs.writeFile(path.join(dest,'target-addresses.json'),JSON.stringify({image_sha256:image.sha256,partitionIndex,partitionCount,addresses:targets.map(p=>p.address)},null,2));\n\
        \      const known=new Set(procedures.map(p=>normalized(p.address)));\n      record.targets_absent_from_inventory=expected.addresses.filter(a=>!known.has(normalized(a)));\n\
        \      record.target_count=targets.length;\n      await saveSummary();\n      for (const p of targets) {\n       \
        \ const status = { address: p.address, name: p.value, classification: p.procedure ?? null, pseudocode: 'not_attempted',\
        \ assembly: 'not_attempted', info: 'not_attempted', references: 'not_attempted', errors: [] };\n        record.function_status.push(status);\n\
        \        if (p.procedure?.external === true) {\n          status.pseudocode = status.assembly = status.info = status.references\
        \ = 'external_import';\n          record.external_imports++;\n          continue;\n        }\n        const header\
        \ = '\\n/* ' + p.address + ' ' + p.value.replaceAll('*/', '* /').replaceAll('\\n', ' ') + ' */\\n';\n        for (const\
        \ [tool, key] of [['procedure_info','info'],['procedure_pseudo_code','pseudocode'],['procedure_assembly','assembly'],['procedure_references','references']])\
        \ {\n          try {\n            if (!planned.has(normalized(p.address))) throw new Error('Address outside explicit\
        \ target allowlist');\n            const result = await call(tool, { procedure: p.address });\n            const value\
        \ = result.normalized_result;\n            if (key === 'pseudocode') {\n              if (typeof value === 'string'\
        \ && value.trim()) { await pseudoFile.write(header + value + '\\n'); status[key] = 'recovered'; record.decompiled++;\
        \ }\n              else { status[key] = 'null'; record.null_pseudocode++; }\n            } else if (key === 'assembly')\
        \ {\n              if (typeof value === 'string' && value.trim()) { await asmFile.write(header + value + '\\n'); status[key]\
        \ = 'recovered'; record.assembly_recovered++; }\n              else status[key] = 'empty';\n            } else status[key]\
        \ = 'recovered';\n            await saveSummary();\n          } catch (e) { status[key] = 'failed'; status.errors.push({\
        \ tool, message: e.message.slice(0,2000) }); record.errors++; await saveSummary(); if (/timed out|deadline|Not connected|Connection\
        \ closed/i.test(e.message)) throw e; }\n        }\n        if (record.function_status.length % 100 === 0) {\n    \
        \      console.log(JSON.stringify({ image: image.path, processed: record.function_status.length, total: procedures.length,\
        \ decompiled: record.decompiled, errors: record.errors }));\n          await saveSummary();\n        }\n      }\n\
        \    } finally { await pseudoFile.close(); await asmFile.close(); }\n    record.status = 'resumed_static_evidence';\n\
        \    record.scope_complete = !record.errors && !record.null_pseudocode;\n    /* Original status expression retained\
        \ only as documentation:\n    record.status = inventoryOnly ? 'inventory_only' : filter || partitionCount > 1 ? 'filtered_static_evidence'\
        \ : record.errors || record.unmatched_compiler_function_starts.length || record.null_pseudocode ? 'partial' : 'complete_within_analyzed_function_inventory';\n\
        \    */\n    await call('close_binary');\n    connected = false;\n  } catch (e) {\n    record.status = 'failed';\n\
        \    record.failure = e.message;\n    console.error(JSON.stringify({ image: image.path, failure: e.message }));\n\
        \  } finally {\n    if (connected) {\n      try { await client.callTool({ name: 'close_binary', arguments: {} }, {\
        \ timeout: 5000 }); }\n      catch (e) { record.limitations.push('close_binary: ' + e.message); }\n    }\n    if (client)\
        \ await Promise.race([client.close().catch(() => {}),new Promise(resolve=>setTimeout(resolve,10000))]);\n    serverLog.end();\n\
        \    gzip.end();\n    await gzipCompletion;\n    await fs.writeFile(path.join(dest, 'coverage.json'), JSON.stringify(record,\
        \ null, 2));\n    await saveSummary();\n  }\n  console.log(JSON.stringify({ image: image.path, status: record.status,\
        \ procedures: record.procedures, decompiled: record.decompiled, errors: record.errors }));\n}\nconst deadline = Date.now()\
        \ + 5 * 60 * 60 * 1000;\nfor (const selectedPath of selected) {\n  if (Date.now() > deadline) { summary.status = 'deadline';\
        \ break; }\n  const image = manifest.images.find(i => i.path === selectedPath);\n  if (!image) throw new Error('Selected\
        \ native image absent from manifest: ' + selectedPath);\n  await recover(image);\n}\nsummary.complete = summary.images.length\
        \ === selected.length && summary.images.every(i => i.scope_complete && !i.targets_absent_from_inventory?.length &&\
        \ i.function_status.length===i.target_count);\nsummary.status = summary.complete ? 'complete_within_analyzed_function_inventory'\
        \ : 'partial';\nawait saveSummary();\nconsole.log(JSON.stringify({ shard, status: summary.status, images: summary.images.length,\
        \ selected: selected.length }));\n\nif (!summary.complete) process.exitCode = 1;\n\nSOURCE\nset +e\ntimeout --signal=TERM\
        \ --kill-after=30s 45m node recovery/recover.mjs\nfirst=$?\nset -e\nmkdir -p gap-evidence\nmv evidence gap-evidence/pass1\n\
        if [ \"$first\" -ne 0 ]; then\n  mkdir evidence\n  cp gap-evidence/pass1/manifest.json evidence/manifest.json\n  cp\
        \ gap-evidence/pass1/resource-inventory.json evidence/resource-inventory.json\n  set +e\n  SKIP_ATTEMPTED_FILE=gap-evidence/pass1/coverage.json\
        \ timeout --signal=TERM --kill-after=30s 45m node recovery/recover.mjs\n  second=$?\n  set -e\n  mv evidence gap-evidence/pass2\n\
        fi\npython - <<'PY'\nimport json,pathlib,os\np=json.load(open('targets.json'))[os.environ['TARGET_IMAGE']];done=set();attempted=set();records={}\n\
        for file in pathlib.Path('gap-evidence').glob('pass*/coverage.json'):\n for i in json.loads(file.read_text())['images']:\n\
        \  assert i['sha256']==p['sha256']\n  for s in i['function_status']:\n   a=hex(int(s['address'],16));attempted.add(a);records.setdefault(a,[]).append(s)\n\
        \   if s.get('pseudocode')=='recovered':done.add(a)\nresult={'image_sha256':p['sha256'],'targets':p['addresses'],'recovered_unique':sorted(done),'missing_addresses':sorted(set(p['addresses'])-done),'without_saved_attempt':sorted(set(p['addresses'])-attempted),'function_records':records,'max_new_attempts_per_address':1,'max_process_passes':2}\n\
        pathlib.Path('gap-evidence/result.json').write_text(json.dumps(result,indent=2))\nwith open(os.environ['GITHUB_STEP_SUMMARY'],'a')\
        \ as f:f.write('## Address-only REA recovery\n\n'+str(len(done))+' / '+str(len(p['addresses']))+' target functions\
        \ have pseudocode.\n\nRemaining addresses: '+', '.join(result['missing_addresses'])+'\n')\nPY\n"
    - name: Retain new evidence without changing checkpoints
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rea-final-gaps-${{ matrix.short }}
        path: gap-evidence/
        if-no-files-found: error
        retention-days: 90
  verify:
    needs:
    - recover-gaps
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - name: Install independent instruction decoder
      run: python -m pip install --disable-pip-version-check capstone==5.0.6
    - name: Audit recovered evidence against original image bytes
      env:
        GH_TOKEN: ${{ github.token }}
      run: "cat > verify_payload.py <<'SOURCE'\n\"\"\"Streaming structural audit; does not establish semantic equivalence.\"\
        \"\"\nimport os,json,pathlib,urllib.request,urllib.parse,hashlib,zipfile,tempfile,gzip,re,collections,time,struct\n\
        REPO='otsrub/test'; OUT=pathlib.Path('verification');OUT.mkdir(exist_ok=True)\nTOKEN=os.environ['GH_TOKEN']; DEADLINE=time.monotonic()+75*60\n\
        class SafeRedirect(urllib.request.HTTPRedirectHandler):\n def redirect_request(self,req,fp,code,msg,headers,newurl):\n\
        \  new=super().redirect_request(req,fp,code,msg,headers,newurl)\n  if new is not None and urllib.parse.urlparse(req.full_url).netloc!=urllib.parse.urlparse(newurl).netloc:new.remove_header('Authorization')\n\
        \  return new\nopener=urllib.request.build_opener(SafeRedirect)\ndef get(url,binary=False):\n headers={'Accept':'application/vnd.github+json','Authorization':'Bearer\
        \ '+TOKEN} if url.startswith('https://api.github.com/repos/'+REPO+'/') else {}\n req=urllib.request.Request(url,headers=headers)\n\
        \ return opener.open(req,timeout=120)\ndef api(path):\n with get('https://api.github.com/repos/'+REPO+'/'+path) as\
        \ f:return json.load(f)\ndef download(a,dest):\n for attempt in range(3):\n  try:\n   h=hashlib.sha256();n=0\n   with\
        \ get('https://api.github.com/repos/'+REPO+'/actions/artifacts/'+str(a['id'])+'/zip') as src,open(dest,'wb') as f:\n\
        \    while b:=src.read(1024*1024):f.write(b);h.update(b);n+=len(b)\n   assert n==a['size_in_bytes'] and h.hexdigest()==a['digest'].removeprefix('sha256:')\n\
        \   return\n  except Exception:\n   if attempt==2:raise\ndef addr(a):\n try:return hex(int(a,16))\n except:return\
        \ a\nrows={};inventories={};compiler={};imagepaths={};artifacts=[];failures=[];counts=collections.Counter();rawsegments={};rawimages={};dirty=set();completed_artifacts=[]\n\
        def add_record(sha,ad,values,source,subject_ok):\n info=values.get('procedure_info') or {};pseudo=values.get('procedure_pseudo_code');asm=values.get('procedure_assembly');c=info.get('classification',{})\n\
        \ if c.get('external') or ad.startswith('EXTERNAL:'):return\n pseudo=pseudo if isinstance(pseudo,str) else '';asm=asm\
        \ if isinstance(asm,str) else ''\n flags=[];body=info.get('body',{});ranges=body.get('ranges',[])\n ins=[(int(a,16),m.lower())\
        \ for a,m in re.findall(r'^\\s*(0x[0-9a-fA-F]+):\\s*(\\S+)',asm,re.M)]\n if not subject_ok:flags.append('subject_sha_mismatch')\n\
        \ if not pseudo.strip():flags.append('missing_pseudocode')\n if not ins:flags.append('missing_assembly')\n if 'halt_baddata'\
        \ in pseudo:flags.append('halt_baddata')\n if 'BADSPACEBASE' in pseudo:flags.append('bad_stack_model')\n if re.search(r'WARNING:.*(?:Bad|bad|Unable|unreachable|overlap|unrecover)',pseudo):flags.append('decompiler_warning')\n\
        \ if c.get('thunk') and str(c.get('thunk_target','')).startswith('EXTERNAL:') and body.get('total_bytes')==1 and not\
        \ ins:flags.append('synthetic_external_alias_candidate')\n if int(ad,16)%4:flags.append('unaligned_arm64_entry')\n\
        \ if any(m.startswith(('ldar','stlr','ldax','stlx','cas','swp')) or m in ['dmb','dsb','isb'] for _,m in ins):flags.append('memory_order_review')\n\
        \ if any(m.startswith(('fmadd','fmsub','fnmadd','fnmsub')) for _,m in ins):flags.append('floating_point_fusion_review')\n\
        \ if any(m in ['blr','blraa','blrab'] for _,m in ins):flags.append('indirect_call_abi_review')\n if ranges:\n  rr=[(int(r['start'],16),int(r['end'],16))\
        \ for r in ranges]\n  if any(not any(s<=a and a+3<=e for s,e in rr) for a,_ in ins):flags.append('assembly_outside_reported_body')\n\
        \ score=(bool(pseudo.strip()),len(values),bool(ins),subject_ok)\n key=(sha,ad);old=rows.get(key)\n if old is None\
        \ or tuple(old['score'])<score:\n  rows[key]={'image_sha256':sha,'address':ad,'name':info.get('name'),'artifact_id':source,'score':score,'pseudocode':bool(pseudo.strip()),'instruction_count':len(ins),'flags':flags,'body_bytes':body.get('total_bytes'),'subject_sha_matches':subject_ok};dirty.add(key)\n\
        \n# Download original image bytes only once and independently decode recorded assembly addresses.\narchive=pathlib.Path('MobileLogic.zip')\n\
        if not archive.exists():\n with get('https://github.com/otsrub/test/releases/download/mobilelogic-3.4-archive/MobileLogic.zip')\
        \ as src,archive.open('wb') as f:\n  while b:=src.read(1024*1024):f.write(b)\nassert hashlib.file_digest(archive.open('rb'),'sha256').hexdigest()=='f2a650fd7a51a7bb2bc5e8e5cc35a95236c02723ab3faeb162cca64ee62a744e'\n\
        from capstone import Cs,CS_ARCH_ARM64,CS_MODE_LITTLE_ENDIAN\ndecoder=Cs(CS_ARCH_ARM64,CS_MODE_LITTLE_ENDIAN)\noriginal=zipfile.ZipFile(archive)\n\
        def raw_image(sha,path):\n if sha in rawimages:return rawimages[sha]\n b=original.read(path);assert hashlib.sha256(b).hexdigest()==sha\n\
        \ segments=[];off=32\n for _ in range(struct.unpack_from('<I',b,16)[0]):\n  cmd,size=struct.unpack_from('<II',b,off)\n\
        \  if cmd==0x19:\n   va,vs,fo,fs=struct.unpack_from('<QQQQ',b,off+24);segments.append((va,fo,fs))\n  off+=size\n rawsegments[sha]=segments;rawimages.clear();rawimages[sha]=b;return\
        \ b\ndef independent_check(sha,ad,values,source,path):\n asm=values.get('procedure_assembly');\n if not isinstance(asm,str)\
        \ or not asm.strip():return\n b=raw_image(sha,path);bad=[];mismatch=[];n=0\n for aa,mm in re.findall(r'^\\s*(0x[0-9a-fA-F]+):\\\
        s*(\\S+)',asm,re.M):\n  a=int(aa,16);fo=next((fo+a-va for va,fo,fs in rawsegments[sha] if va<=a and a+4<=va+fs),None)\n\
        \  if fo is None:bad.append(aa);continue\n  decoded=next(decoder.disasm(b[fo:fo+4],a,count=1),None)\n  if decoded\
        \ is None:bad.append(aa);continue\n  n+=1\n  # Alias spellings differ between Capstone and Ghidra. Differences are\
        \ review candidates.\n  if decoded.mnemonic.lower()!=mm.lower():mismatch.append({'address':aa,'ghidra':mm,'capstone':decoded.mnemonic})\n\
        \ row=rows.get((sha,ad))\n if row and row['artifact_id']==source:\n  row['independently_decoded_instructions']=n\n\
        \  if bad:row['flags'].append('raw_bytes_mapping_or_decode_failure');row['raw_decode_failure_addresses']=bad\n  if\
        \ mismatch:row['mnemonic_difference_count']=len(mismatch);row['mnemonic_difference_examples']=mismatch[:5]\n\nrun_ids=[38491368864,38506344850,38506344446,38506344402,38506344808,38506344846,38534716963,38534716950,38534716942,38534716923,38534716921]\n\
        for page in range(1,31):\n batch=api('actions/runs?per_page=100&page='+str(page))['workflow_runs']\n run_ids.extend(r['id']\
        \ for r in batch if re.match(r'^REA overnight \\d{3}',r['name']) or r['name']=='REA final gap recovery and verification')\n\
        \ if len(batch)<100:break\nfor run_id in dict.fromkeys(run_ids):\n for page in range(1,10):\n  aa=api(f'actions/runs/{run_id}/artifacts?per_page=100&page={page}')['artifacts'];artifacts.extend(a\
        \ for a in aa if a['size_in_bytes']>1000 and a['name']!='rea-final-verification')\n  if len(aa)<100:break\nartifacts=list({a['id']:a\
        \ for a in artifacts}.values())\n(OUT/'artifact-sources.json').write_text(json.dumps(artifacts,indent=2))\nfor ix,a\
        \ in enumerate(artifacts):\n dirty.clear()\n if time.monotonic()>DEADLINE:failures.append({'reason':'bounded audit\
        \ time budget exhausted','unprocessed_artifacts':len(artifacts)-ix});break\n try:\n  with tempfile.TemporaryDirectory()\
        \ as td:\n   dest=pathlib.Path(td)/'artifact.zip';download(a,dest)\n   with zipfile.ZipFile(dest) as z:\n    names=set(z.namelist());coverage=[n\
        \ for n in names if n=='coverage.json' or re.match(r'^pass\\d+/coverage.json$',n) or re.match(r'^(?:overnight-evidence/attempt\\\
        d+|gap-evidence/pass\\d+)/coverage.json$',n)]\n    for cn in sorted(coverage):\n     cov=json.loads(z.read(cn));prefix=cn[:-len('coverage.json')]\n\
        \     for image in cov['images']:\n      sha=image['sha256'];imagepaths[sha]=image['path'];directory=prefix+image['directory']+'/'\n\
        \      invname=directory+'procedures.json'\n      if invname in names and not inventories.get(sha):\n       inv=json.loads(z.read(invname))['normalized_result'];inventories[sha]={addr(p['address'])\
        \ for p in inv if not p.get('procedure',{}).get('external') and not p['address'].startswith('EXTERNAL:')}\n      mn=prefix+'manifest.json'\n\
        \      if mn in names:\n       for mi in json.loads(z.read(mn))['images']:compiler[mi['sha256']]=set(map(addr,mi['compiler_function_starts']))\n\
        \      en=directory+'rea-evidence.jsonl.gz'\n      if en not in names:continue\n      current=None;values={};subject_ok=True\n\
        \      def flush():\n       if current is not None:\n        add_record(sha,current,values,a['id'],subject_ok)\n \
        \       independent_check(sha,current,values,a['id'],image['path'])\n      try:\n       with gzip.open(z.open(en),'rt')\
        \ as evidence:\n        for line in evidence:\n         e=json.loads(line);tool=e.get('tool','')\n         if not\
        \ tool.startswith('procedure_'):continue\n         ad=addr(e.get('arguments',{}).get('procedure',''))\n         if\
        \ not ad or ad.startswith('EXTERNAL:'):continue\n         if ad!=current:flush();current=ad;values={};subject_ok=True\n\
        \         result=e.get('result',{})\n         if not e.get('isError'):\n          subject_ok &= result.get('subject',{}).get('digest',{}).get('sha256')==sha\n\
        \          values[tool]=result.get('normalized_result')\n       flush()\n      except (EOFError,gzip.BadGzipFile)\
        \ as exc:flush();failures.append({'artifact_id':a['id'],'reason':'truncated evidence stream: '+type(exc).__name__})\n\
        \   counts['artifacts_verified']+=1;completed_artifacts.append(a['id'])\n except Exception as exc:failures.append({'artifact_id':a['id'],'reason':type(exc).__name__+':\
        \ '+str(exc)[:300]})\n with (OUT/'audit-record-updates.jsonl').open('a') as f:\n  for key in dirty:f.write(json.dumps(rows[key])+'\\\
        n')\n checkpoint={'complete':False,'completed_artifact_ids':completed_artifacts,'total_artifacts':len(artifacts),'unique_function_records':len(rows),'failures':failures,'note':'Incremental\
        \ records retained in audit-record-updates.jsonl; use last record for each SHA256/address.'}\n (OUT/'checkpoint.json').write_text(json.dumps(checkpoint,indent=2))\n\
        \ if ix%10==0:print(json.dumps({'artifacts':ix+1,'total':len(artifacts),'unique_records':len(rows),'failures':len(failures)}),flush=True)\n\
        flags=collections.Counter(f for r in rows.values() for f in r['flags']);images=[]\nfor sha,inventory in inventories.items():\n\
        \ recovered={ad for (h,ad),r in rows.items() if h==sha and r['pseudocode']}\n images.append({'image_sha256':sha,'path':imagepaths[sha],'native_inventory':len(inventory),'recovered_unique':len(recovered&inventory),'missing_addresses':sorted(inventory-recovered),'compiler_starts_outside_inventory':sorted(compiler.get(sha,set())-inventory)})\n\
        with (OUT/'function-audit.jsonl').open('w') as f:\n for r in rows.values():f.write(json.dumps(r)+'\\n')\nresult={'kind':'structural\
        \ audit with independent original-byte instruction decoding; not semantic equivalence','counts':dict(counts),'unique_function_records':len(rows),'flag_counts':dict(flags),'images':images,'failures':failures,'runtime_equivalence_tests':0,'build_verified':False,'complete':not\
        \ failures and len(images)==59}\n(OUT/'summary.json').write_text(json.dumps(result,indent=2));print(json.dumps({'complete':result['complete'],'images':len(images),'flags':dict(flags),'failures':len(failures)}))\n\
        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('## REA structural verification\\n\\n'+json.dumps({k:v\
        \ for k,v in result.items() if k not in ['images','failures']},indent=2)+'\\n\\nSemantic and runtime equivalence remain\
        \ unverified.\\n')\nif failures:raise SystemExit(1)\n\nSOURCE\npython verify_payload.py\n"
    - name: Retain per-address verification findings
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rea-final-verification
        path: verification/
        if-no-files-found: error
        retention-days: 90

name: REA image - MAVectorUIKit
'on':
  push:
    paths:
    - .github/workflows/rea-image-mavectoruikit.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MAVectorUIKit.framework/MAVectorUIKit
      artifact: rea-image-mavectoruikit

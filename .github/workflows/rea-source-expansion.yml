name: REA source expansion, exact boundaries and DSP differential checks
'on':
  push:
    paths:
    - .github/workflows/rea-source-expansion.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: rea-source-expansion
  cancel-in-progress: false
jobs:
  source-expansion:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ github.run_attempt == 1 }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: rea-original-input-madsp
        run-id: '38670888947'
        github-token: ${{ github.token }}
        path: input
    - uses: actions/download-artifact@v4
      with:
        name: rea-compiler-start-triage
        run-id: '38670888947'
        github-token: ${{ github.token }}
        path: triage
    - uses: actions/download-artifact@v4
      with:
        name: rea-source-preparation-and-leaf-verification
        run-id: '38685299502'
        github-token: ${{ github.token }}
        path: prior-source
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Stage instruction-derived sources and provenance
      shell: python
      run: 'import pathlib,base64,json

        p=pathlib.Path("source/madsp");p.mkdir(parents=True,exist_ok=True)

        assets={''candidate-review.json'': '''',
        ''resolve_boundaries.py'': '''',
        ''original-9f7ec8.hex'': '''',
        ''verify_small.py'': '''',
        ''small.c'': '''',
        ''boundary-review.json'': '''',
        ''verify_click.py'': '''',
        ''click.c'': '''',
        ''prior-host-click-verification.json'': '''',
        ''prior-host-small-verification.json'': ''''}

        for name,data in assets.items():(p/name).write_bytes(base64.b64decode(data))

        '
    - name: Install pinned verification dependencies
      run: python -m pip install unicorn==2.1.4 capstone==5.0.6 pyelftools==0.32
    - name: Verify eight exact compiler extents and three additional implementations
      run: 'python source/madsp/resolve_boundaries.py input/target.bin triage/compiler-start-triage.json

        python source/madsp/verify_small.py input/target.bin

        clang -target arm64-apple-ios17.0 -ffreestanding -O2 -Wall -Wextra -Werror -c source/madsp/small.c -o source/madsp/build/small-ios-arm64.o'
    - name: Differential DSP check using compiled ARM64 source and original bytes
      run: 'python source/madsp/verify_click.py input/target.bin --arm-object

        clang -target arm64-apple-ios17.0 -ffreestanding -O2 -fno-fast-math -ffp-contract=off -Wall -Wextra -Werror -c source/madsp/click.c
        -o source/madsp/build/click-ios-arm64.o'
    - name: Preserve existing leaf source and candidate evidence
      if: always()
      run: 'cp -R prior-source source/prior-source-preparation

        sha256sum input/target.bin > source/input-sha256.txt'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rea-source-expansion-boundaries-and-dsp
        path: source/
        if-no-files-found: error
        retention-days: 90

name: REA image - MASwiftUtilities
'on':
  push:
    paths:
    - .github/workflows/rea-image-maswiftutilities.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MASwiftUtilities.framework/MASwiftUtilities
      artifact: rea-image-maswiftutilities

name: REA GetAllEvents pre-allocation source phase
'on':
  push:
    paths:
    - .github/workflows/rea-madsp-capacity.yml
permissions:
  contents: read
  actions: read
jobs:
  madsp-capacity-phase:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ github.run_attempt == 1 }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: rea-gui-alias-original-callback-evidence
        run-id: '38780331470'
        github-token: ${{ github.token }}
        path: prior-checkpoint
    - uses: actions/download-artifact@v4
      with:
        name: rea-original-input-madsp
        run-id: '38670888947'
        github-token: ${{ github.token }}
        path: madsp-input
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install official compiler and pinned emulator
      run: 'sudo apt-get update

        sudo apt-get install -y clang-18 lld-18 llvm-18

        python -m pip install unicorn==2.1.4 capstone==5.0.6'
    - name: Stage instruction-derived partial phase
      shell: python
      run: "import pathlib,json\na=json.loads('{\"madsp_getallevents_capacity.c\": \"/* Instruction-derived PRE-ALLOCATION PHASE only of MADSP 0xa946c.\\\\n * Corresponds to original 0xa94bc until call 0xa94fc, including out-of-line\\\\n * count loops. Not GetAllEvents replacement: no allocator, sync or event emit.\\\\n * Fields remain byte offsets, not invented C++ class definitions.\\\\n */\\\\n#include <stdint.h>\\\\n#define copy __builtin_memcpy\\\\nstatic uint64_t u64(const unsigned char *p) {uint64_t v;copy(&v,p,8);return v;}\\\\nstatic int32_t s32(const unsigned char *p) {int32_t v;copy(&v,p,4);return v;}\\\\nuint64_t mobilelogic_madsp_a946c_capacity_phase(void *object,uint32_t include_properties) {\\\\n unsigned char *p=object;\\\\n uint64_t selection=u64(p+0x1d8e8);\\\\n uint64_t steps=u64(p+0x1d610+8*selection);\\\\n uint64_t zero=0;copy(p+0x1d570,&zero,8);\\\\n uint64_t records=steps*3u+3u;\\\\n uint64_t lanes=u64(p+0x1d5b8);\\\\n if((int64_t)lanes>=1 && (int64_t)steps>=1) {\\\\n  for(uint64_t lane=0;lane<lanes;lane++) {\\\\n   const unsigned char *flags=p+selection*0x960+8+lane*0x60;\\\\n   for(uint64_t step=0;step<steps;step++) {\\\\n    if(flags[3*step]) {\\\\n     if(include_properties) {\\\\n      const unsigned char *properties=(const void *)(uintptr_t)u64(p+0x1e9f8);\\\\n      records+=(uint64_t)(int64_t)s32(properties+selection*0xdc50+lane*0x8d0+8)+1u;\\\\n     } else records++;\\\\n    }\\\\n   }\\\\n  }\\\\n }\\\\n uint64_t words=records*3u;\\\\n /* Native UB(F)IZ keeps LOW 32 word-count bits before shifting by two.\\\\n  * CSINV selects all-ones when the low 32-bit signed word count is negative. */\\\\n return (int32_t)(uint32_t)words<0?UINT64_MAX:(uint64_t)(uint32_t)words*4u;\\\\n}\\\\n\", \"verify_madsp_capacity.py\": \"\\\\\"\\\\\"\\\\\"New manual pre-allocation phase; original bytes run until real alloc call.\\\\nNo allocator/free/sync substitute or full-function equivalence claim.\\\\n\\\\\"\\\\\"\\\\\"\\\\nimport pathlib,json,hashlib,struct,random,ctypes,subprocess,sys\\\\nfrom unicorn import Uc,UC_ARCH_ARM64,UC_MODE_ARM,UC_HOOK_CODE\\\\nfrom unicorn.arm64_const import *\\\\nfrom payload_inventory import macho\\\\nroot=pathlib.Path(__file__).resolve().parent;out=root/\\'madsp-capacity-review\\';out.mkdir(exist_ok=True)\\\\nb=(root/\\'madsp-input/target.bin\\').read_bytes();sha=hashlib.sha256(b).hexdigest();assert sha==\\'8b7cbaa383d3050241921e74d1334b22703193afed6ea5e9388599cc42a60fe8\\'\\\\nm=macho(b);assert m[\\'starts\\'][m[\\'starts\\'].index(0xa946c)+1]==0xa9f80\\\\nu=Uc(UC_ARCH_ARM64,UC_MODE_ARM)\\\\nfor vm,off,n in m[\\'segments\\']:\\\\n if n:u.mem_map(vm&~4095,((vm+n+4095)&~4095)-(vm&~4095));u.mem_write(vm,b[off:off+n])\\\\nBASE=0x2000000;SIZE=0x80000;STACK=0x2100000\\\\nu.mem_map(BASE,SIZE);u.mem_map(STACK,0x4000);covered=set();stops=[]\\\\ndef hook(uc,pc,n,user):\\\\n assert 0xa946c<=pc<0xa9f80,hex(pc)\\\\n covered.add(pc)\\\\n if pc==0xa94fc:stops.append(pc);uc.emu_stop()\\\\nu.hook_add(UC_HOOK_CODE,hook)\\\\nlibs=[];diag=[]\\\\nfor opt in [0,2,3]:\\\\n p=out/f\\'capacity-O{opt}.so\\';argv=[\\'cc\\',\\'-std=c11\\',f\\'-O{opt}\\',\\'-Wall\\',\\'-Wextra\\',\\'-Werror\\',\\'-shared\\',\\'-fPIC\\',str(root/\\'madsp_getallevents_capacity.c\\'),\\'-o\\',str(p)]\\\\n r=subprocess.run(argv,text=True,capture_output=True);diag.append({\\'argv\\':argv,\\'exit_code\\':r.returncode,\\'stdout\\':r.stdout,\\'stderr\\':r.stderr});r.check_returncode()\\\\n lib=ctypes.CDLL(str(p));f=lib.mobilelogic_madsp_a946c_capacity_phase;f.argtypes=[ctypes.c_void_p,ctypes.c_uint32];f.restype=ctypes.c_uint64;libs.append((lib,f))\\\\narm=[];STOP=0x3000000\\\\nif \\'--arm\\' in sys.argv:\\\\n for opt in [0,2,3]:\\\\n  obj=out/f\\'capacity-arm-O{opt}.o\\';p=out/f\\'capacity-arm-O{opt}.dylib\\'\\\\n  for argv in [[\\'clang-18\\',\\'-target\\',\\'arm64-apple-ios17.0\\',f\\'-O{opt}\\',\\'-ffreestanding\\',\\'-Wall\\',\\'-Wextra\\',\\'-Werror\\',\\'-c\\',str(root/\\'madsp_getallevents_capacity.c\\'),\\'-o\\',str(obj)],[\\'ld64.lld-18\\',\\'-arch\\',\\'arm64\\',\\'-platform_version\\',\\'ios\\',\\'17.0\\',\\'17.0\\',\\'-dylib\\',\\'-undefined\\',\\'error\\',str(obj),\\'-o\\',str(p)]]:\\\\n   r=subprocess.run(argv,text=True,capture_output=True);diag.append({\\'argv\\':argv,\\'exit_code\\':r.returncode,\\'stdout\\':r.stdout,\\'stderr\\':r.stderr});(out/\\'compile-diagnostics.json\\').write_text(json.dumps(diag,indent=2)+\\'\\\\\\\\n\\');r.check_returncode()\\\\n  b2=p.read_bytes();m2=macho(b2);assert not [s for s in m2[\\'symbols\\'] if s[\\'undefined\\']]\\\\n  v=Uc(UC_ARCH_ARM64,UC_MODE_ARM)\\\\n  for vm,off,n in m2[\\'segments\\']:\\\\n   if n:v.mem_map(vm&~4095,((vm+n+4095)&~4095)-(vm&~4095));v.mem_write(vm,b2[off:off+n])\\\\n  v.mem_map(BASE,SIZE);v.mem_map(STACK,0x4000);entry=next(int(s[\\'address\\'],16) for s in m2[\\'symbols\\'] if s[\\'name\\']==\\'_mobilelogic_madsp_a946c_capacity_phase\\');arm.append((v,entry))\\\\n(out/\\'compile-diagnostics.json\\').write_text(json.dumps(diag,indent=2)+\\'\\\\\\\\n\\')\\\\nrng=random.Random(0xa946c);host=ctypes.create_string_buffer(SIZE+16);hp=(ctypes.addressof(host)+15)&~15\\\\nstep_edges=[-1,0,1,2,7,8,9,15,16,17,31,32,33,63,64,65,127,128,129]\\\\nlane_edges=[-1,0,1,2,4,8];count_edges=[-2147483648,-1,0,1,7,31,2147483647]\\\\npassed=[0]*3;failures=[];outcomes=set();arm_passed=[0]*len(arm)\\\\nfor case in range(3600):\\\\n obj=0x100+case%16;selection=(case//2)%4;steps=step_edges[(case//8)%len(step_edges)];lanes=lane_edges[(case//(8*len(step_edges)))%len(lane_edges)];include=[0,1,255,0xffffffff][case%4]\\\\n initial=bytearray(rng.randbytes(SIZE));props=0x30000+case%16\\\\n struct.pack_into(\\'<Q\\',initial,obj+0x1d8e8,selection);struct.pack_into(\\'<q\\',initial,obj+0x1d610+selection*8,steps);struct.pack_into(\\'<q\\',initial,obj+0x1d5b8,lanes);struct.pack_into(\\'<Q\\',initial,obj+0x1e9f8,BASE+props)\\\\n for lane in range(max(0,lanes)):\\\\n  struct.pack_into(\\'<i\\',initial,props+selection*0xdc50+lane*0x8d0+8,count_edges[(case+lane)%len(count_edges)])\\\\n  for step in range(max(0,steps)):initial[obj+selection*0x960+8+lane*0x60+3*step]=[0,1,2,255,rng.getrandbits(8)][(case+step+lane)%5]\\\\n u.mem_write(BASE,bytes(initial));u.mem_write(STACK,bytes(0x4000));u.reg_write(UC_ARM64_REG_SP,STACK+0x2000);u.reg_write(UC_ARM64_REG_X24,BASE+obj);u.reg_write(UC_ARM64_REG_X20,BASE+obj+0x1d570);u.reg_write(UC_ARM64_REG_X25,0x1e9f8);u.reg_write(UC_ARM64_REG_X21,include);u.reg_write(UC_ARM64_REG_CPACR_EL1,3<<20)\\\\n stops.clear();u.emu_start(0xa94bc,0xa9f80,count=100000);assert stops==[0xa94fc]\\\\n wanted=u.reg_read(UC_ARM64_REG_X0);memory=bytes(u.mem_read(BASE,SIZE));outcomes.add(wanted)\\\\n for j,(_,f) in enumerate(libs):\\\\n  data=bytearray(initial);struct.pack_into(\\'<Q\\',data,obj+0x1e9f8,hp+props);ctypes.memmove(hp,bytes(data),SIZE);actual=f(hp+obj,include);state=bytearray(ctypes.string_at(hp,SIZE));struct.pack_into(\\'<Q\\',state,obj+0x1e9f8,BASE+props)\\\\n  ok=actual==wanted and bytes(state)==memory;passed[j]+=ok\\\\n  if not ok and len(failures)<12:failures.append({\\'case\\':case,\\'optimization\\':[0,2,3][j],\\'steps\\':steps,\\'lanes\\':lanes,\\'selection\\':selection,\\'include\\':include,\\'expected_allocation\\':wanted,\\'actual_allocation\\':actual})\\\\n for j,(v,entry) in enumerate(arm):\\\\n  v.mem_write(BASE,bytes(initial));v.mem_write(STACK,bytes(0x4000));v.reg_write(UC_ARM64_REG_SP,STACK+0x2000);v.reg_write(UC_ARM64_REG_X30,STOP);v.reg_write(UC_ARM64_REG_X0,BASE+obj);v.reg_write(UC_ARM64_REG_X1,include);v.reg_write(UC_ARM64_REG_CPACR_EL1,3<<20)\\\\n  v.emu_start(entry,STOP,count=100000);ok=v.reg_read(UC_ARM64_REG_PC)==STOP and v.reg_read(UC_ARM64_REG_X0)==wanted and bytes(v.mem_read(BASE,SIZE))==memory;arm_passed[j]+=ok\\\\n  if not ok and len(failures)<12:failures.append({\\'case\\':case,\\'arm_optimization\\':[0,2,3][j],\\'expected_allocation\\':wanted,\\'actual_allocation\\':v.reg_read(UC_ARM64_REG_X0)})\\\\n if case%600==0:print(case,passed,arm_passed,flush=True)\\\\nreport={\\'image_sha256\\':sha,\\'original_entry\\':\\'0xa946c\\',\\'next_compiler_start\\':\\'0xa9f80\\',\\'extent_bytes\\':2836,\\'phase_start\\':\\'0xa94bc\\',\\'stop_before_real_call\\':\\'0xa94fc\\',\\'cases\\':3600,\\'passes_O0_O2_O3\\':passed,\\'mismatches\\':10800-sum(passed),\\'first_failures\\':failures,\\'original_instruction_locations_exercised\\':len(covered),\\'allocator_all_ones_exercised\\':2**64-1 in outcomes,\\'source_sha256\\':hashlib.sha256((root/\\'madsp_getallevents_capacity.c\\').read_bytes()).hexdigest(),\\'scope\\':\\'Synthetic state AFTER prior free call. Original pre-allocation instructions and out-of-line scalar/SIMD count loops run without substitute callees. Compare allocation argument and full modeled data memory. Signed count edges, low-32-bit truncation/overflow, noncanonical include flags, four selections, 16 alignments, scalar/SIMD transition sizes. Original free/allocator/CStepSync::Process, event emission and DSP arithmetic not executed; no full-function equivalence or build readiness.\\',\\'full_function_equivalence_verified\\':False,\\'new_decompiler_attempts\\':0}\\\\nreport[\\'ARM_O0_O2_O3_passes\\']=arm_passed;report[\\'ARM_mismatches\\']=len(arm)*3600-sum(arm_passed)\\\\nreport[\\'ARM_scope\\']=\\'Real compiled ARM64 phase modules, zero undefined symbols; compare allocation argument and entire modeled data memory. Phase-only modules, not a rebuilt GetAllEvents or arbitrary ABI integration.\\' if arm else \\'ARM source build and execution not performed.\\'\\\\n(out/\\'verification.json\\').write_text(json.dumps(report,indent=2)+\\'\\\\\\\\n\\');print(json.dumps(report,indent=2));assert not report[\\'mismatches\\'] and not report[\\'ARM_mismatches\\']\\\\n\", \"payload_inventory.py\": \"\\\\\"\\\\\"\\\\\"Read-only original archive inventory and conservative compiler extent review.\\\\nNo binary patching, stubs, type invention, or source-equivalence claims.\\\\n\\\\\"\\\\\"\\\\\"\\\\nimport pathlib,struct,hashlib,json,zipfile,sys,collections,plistlib\\\\nfrom capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM\\\\nfrom capstone.arm64 import ARM64_OP_IMM\\\\nEXPECTED=\\'f2a650fd7a51a7bb2bc5e8e5cc35a95236c02723ab3faeb162cca64ee62a744e\\'\\\\ndef sha(b):return hashlib.sha256(b).hexdigest()\\\\ndef cstr(b,o=0):return b[o:].split(b\\'\\\\\\\\0\\',1)[0].decode(\\'utf-8\\',\\'replace\\')\\\\ndef macho(b):\\\\n assert b[:4]==bytes.fromhex(\\'cffaedfe\\')\\\\n pos=32;segments=[];sections=[];deps=[];rpaths=[];symtab=None;startdata=None;uuid=None;crypt=[];base=None\\\\n for _ in range(struct.unpack_from(\\'<I\\',b,16)[0]):\\\\n  cmd,size=struct.unpack_from(\\'<II\\',b,pos);assert size>=8 and pos+size<=len(b)\\\\n  if cmd==25:\\\\n   name=cstr(b[pos+8:pos+24]);vm,vmsz,off,fs=struct.unpack_from(\\'<QQQQ\\',b,pos+24);segments.append((vm,off,fs))\\\\n   if name==\\'__TEXT\\':base=vm\\\\n   for j in range(struct.unpack_from(\\'<I\\',b,pos+64)[0]):\\\\n    p=pos+72+80*j;va,n,fo=struct.unpack_from(\\'<QQI\\',b,p+32);sections.append({\\'name\\':cstr(b[p:p+16]),\\'segment\\':name,\\'address\\':va,\\'bytes\\':n,\\'fileoff\\':fo,\\'flags\\':struct.unpack_from(\\'<I\\',b,p+64)[0]})\\\\n  elif cmd in [12,0x80000018,0x8000001f,0x80000023,0x20,13]:\\\\n   no,ts,cur,compat=struct.unpack_from(\\'<IIII\\',b,pos+8);deps.append({\\'kind\\':hex(cmd),\\'name\\':cstr(b[pos:pos+size],no),\\'current_version\\':cur,\\'compatibility_version\\':compat})\\\\n  elif cmd==0x8000001c:rpaths.append(cstr(b[pos:pos+size],struct.unpack_from(\\'<I\\',b,pos+8)[0]))\\\\n  elif cmd==2:symtab=struct.unpack_from(\\'<IIII\\',b,pos+8)\\\\n  elif cmd==0x26:\\\\n   off,n=struct.unpack_from(\\'<II\\',b,pos+8);startdata=b[off:off+n]\\\\n  elif cmd==0x1b:uuid=b[pos+8:pos+24].hex()\\\\n  elif cmd in [0x21,0x2c]:crypt.append({\\'offset\\':struct.unpack_from(\\'<I\\',b,pos+8)[0],\\'size\\':struct.unpack_from(\\'<I\\',b,pos+12)[0],\\'cryptid\\':struct.unpack_from(\\'<I\\',b,pos+16)[0]})\\\\n  pos+=size\\\\n starts=[]\\\\n if startdata is not None:\\\\n  assert base is not None\\\\n  a=base;v=shift=0\\\\n  for byte in startdata:\\\\n   v|=(byte&127)<<shift\\\\n   if byte&128:shift+=7;continue\\\\n   if v==0:break\\\\n   a+=v;starts.append(a);v=shift=0\\\\n symbols=[]\\\\n if symtab:\\\\n  off,n,so,sz=symtab;strings=b[so:so+sz]\\\\n  for i in range(n):\\\\n   si,kind,sec,desc,value=struct.unpack_from(\\'<IBBHQ\\',b,off+16*i)\\\\n   if kind&0xe0 or not si:continue\\\\n   symbols.append({\\'name\\':cstr(strings,si),\\'address\\':hex(value),\\'n_type\\':kind,\\'section_index\\':sec,\\'description_bits\\':desc,\\'external\\':bool(kind&1),\\'undefined\\':kind&14==0})\\\\n return {\\'segments\\':segments,\\'sections\\':sections,\\'dependencies\\':deps,\\'rpaths\\':rpaths,\\'uuid\\':uuid,\\'encryption\\':crypt,\\'starts\\':starts,\\'symbols\\':symbols}\\\\ndef review(b,m,row):\\\\n a=int(row[\\'compiler_start\\'],16);starts=m[\\'starts\\'];r={\\'image\\':row[\\'image\\'],\\'image_sha256\\':sha(b),\\'address\\':hex(a),\\'exact_contiguous_extent_verified\\':False,\\'semantic_equivalence_verified\\':False}\\\\n if a not in starts:r[\\'status\\']=\\'compiler_start_not_in_original_metadata\\';return r\\\\n index=starts.index(a)\\\\n if index+1==len(starts):r[\\'status\\']=\\'last_start_has_no_metadata_upper_bound\\';return r\\\\n end=starts[index+1];r[\\'next_compiler_start\\']=hex(end);code=None\\\\n for vm,off,n in m[\\'segments\\']:\\\\n  if vm<=a and end<=vm+n:code=b[off+a-vm:off+end-vm]\\\\n if code is None:r[\\'status\\']=\\'extent_not_file_backed\\';return r\\\\n r.update({\\'extent_bytes\\':len(code),\\'extent_sha256\\':sha(code)})\\\\n if len(code)>1024*1024:r[\\'status\\']=\\'extent_exceeds_bounded_review\\';return r\\\\n cs=Cs(CS_ARCH_ARM64,CS_MODE_ARM);cs.detail=True;ins=list(cs.disasm(code,a));byaddr={i.address:i for i in ins}\\\\n reasons=[];tails=[];calls=[]\\\\n if len(ins)*4!=len(code):reasons.append(\\'not_all_extent_bytes_decode\\')\\\\n reachable=set();todo=[a]\\\\n while todo:\\\\n  pc=todo.pop()\\\\n  if pc in reachable:continue\\\\n  if pc not in byaddr:reasons.append(\\'control_flow_outside_decoded_extent\\');continue\\\\n  reachable.add(pc);i=byaddr[pc];mn=i.mnemonic\\\\n  if mn in [\\'ret\\',\\'retaa\\',\\'retab\\']:continue\\\\n  if mn in [\\'br\\',\\'braa\\',\\'brab\\',\\'braaz\\',\\'brabz\\',\\'eret\\',\\'brk\\',\\'hlt\\',\\'udf\\']:reasons.append(\\'indirect_or_exception_exit_requires_review\\');continue\\\\n  if mn==\\'b\\':\\\\n   target=i.operands[-1].imm\\\\n   if a<=target<end:todo.append(target)\\\\n   elif target in starts:tails.append(hex(target))\\\\n   else:reasons.append(\\'external_branch_not_known_compiler_start\\')\\\\n   continue\\\\n  if mn.startswith(\\'b.\\') or mn in [\\'cbz\\',\\'cbnz\\',\\'tbz\\',\\'tbnz\\']:\\\\n   target=i.operands[-1]\\\\n   if target.type==ARM64_OP_IMM and a<=target.imm<end:todo.append(target.imm)\\\\n   else:reasons.append(\\'conditional_branch_outside_extent\\')\\\\n  if mn in [\\'bl\\',\\'blr\\',\\'blraa\\',\\'blrab\\']:calls.append({\\'address\\':hex(pc),\\'instruction\\':mn+\\' \\'+i.op_str,\\'behavior_verified\\':False})\\\\n  todo.append(pc+4)\\\\n if reachable!=set(byaddr):reasons.append(\\'unreachable_bytes_or_extra_function_fragments\\')\\\\n if ins and ins[-1].mnemonic not in [\\'ret\\',\\'retaa\\',\\'retab\\',\\'b\\']:reasons.append(\\'no_terminal_return_or_tail_at_metadata_end\\')\\\\n reasons=sorted(set(reasons));r.update({\\'status\\':\\'requires_exact_boundary_review\\' if reasons else \\'contiguous_extent_resolved\\',\\'exact_contiguous_extent_verified\\':not reasons,\\'limitations\\':reasons,\\'tail_targets\\':sorted(set(tails)),\\'calls\\':calls,\\'instruction_count\\':len(ins),\\'reachable_instruction_count\\':len(reachable)})\\\\n # Only resolved extents get original instruction evidence; unknowns retain hashes.\\\\n if not reasons:r.update({\\'original_hex\\':code.hex(),\\'assembly\\':[f\\'{i.address:#x}: {i.mnemonic} {i.op_str}\\' for i in ins],\\'basis\\':\\'Original LC_FUNCTION_STARTS adjacent entries; complete decoding; reachable local CFG; explicit return/tail; no inferred Ghidra ranges\\'})\\\\n return r\\\\ndef main():\\\\n archive=pathlib.Path(sys.argv[1]);out=pathlib.Path(sys.argv[3]);out.mkdir(parents=True,exist_ok=True)\\\\n with archive.open(\\'rb\\') as f:assert hashlib.file_digest(f,\\'sha256\\').hexdigest()==EXPECTED\\\\n triage=json.loads(pathlib.Path(sys.argv[2]).read_text());wanted=collections.defaultdict(list)\\\\n for r in triage:wanted[r[\\'image\\']].append(r)\\\\n images=[];resources=[];boundaries=[];seen=set();plists=[]\\\\n with zipfile.ZipFile(archive) as z,(out/\\'symbols.jsonl\\').open(\\'w\\') as symbolout:\\\\n  for member in z.infolist():\\\\n   if member.is_dir():continue\\\\n   name=member.filename\\\\n   with z.open(member) as f:\\\\n    prefix=f.read(4)\\\\n    if prefix==bytes.fromhex(\\'cffaedfe\\'):\\\\n     b=prefix+f.read();digest=sha(b);m=macho(b)\\\\n     row={\\'path\\':name,\\'sha256\\':digest,\\'bytes\\':len(b),\\'uuid\\':m[\\'uuid\\'],\\'dependencies\\':m[\\'dependencies\\'],\\'rpaths\\':m[\\'rpaths\\'],\\'encryption\\':m[\\'encryption\\'],\\'sections\\':m[\\'sections\\'],\\'native_symbol_records\\':len(m[\\'symbols\\']),\\'compiler_start_count\\':len(m[\\'starts\\']),\\'source_types_recovered\\':False}\\\\n     images.append(row)\\\\n     for s in m[\\'symbols\\']:print(json.dumps({\\'image_sha256\\':digest,**s},separators=(\\',\\',\\':\\')),file=symbolout)\\\\n     if name in wanted:\\\\n      seen.add(name)\\\\n      for r in wanted[name]:\\\\n       assert digest==r[\\'image_sha256\\'];boundaries.append(review(b,m,r))\\\\n    else:\\\\n     h=hashlib.sha256();h.update(prefix);data=bytearray(prefix) if name.endswith(\\'Info.plist\\') else None\\\\n     while chunk:=f.read(1024*1024):\\\\n      h.update(chunk)\\\\n      if data is not None:data.extend(chunk)\\\\n     resources.append({\\'path\\':name,\\'bytes\\':member.file_size,\\'sha256\\':h.hexdigest(),\\'kind\\':\\'resource-or-metadata-not-reconstructed-source\\'})\\\\n     if data is not None:\\\\n      try:\\\\n       p=plistlib.loads(data);plists.append({\\'path\\':name,\\'bundle_id\\':p.get(\\'CFBundleIdentifier\\'),\\'executable\\':p.get(\\'CFBundleExecutable\\'),\\'minimum_os\\':p.get(\\'MinimumOSVersion\\'),\\'bundle_version\\':p.get(\\'CFBundleVersion\\'),\\'package_type\\':p.get(\\'CFBundlePackageType\\')})\\\\n      except Exception as e:plists.append({\\'path\\':name,\\'parse_error\\':str(e)})\\\\n assert seen==set(wanted) and len(boundaries)==353\\\\n resolved=sum(r[\\'exact_contiguous_extent_verified\\'] for r in boundaries)\\\\n for filename,content in [(\\'native-images.json\\',images),(\\'resources.json\\',resources),(\\'bundles.json\\',plists),(\\'compiler-boundaries.json\\',boundaries)]:\\\\n  (out/filename).write_text(json.dumps(content,indent=2)+\\'\\\\\\\\n\\')\\\\n summary={\\'archive_sha256\\':EXPECTED,\\'archive_bytes\\':archive.stat().st_size,\\'native_images\\':len(images),\\'native_symbol_records\\':sum(x[\\'native_symbol_records\\'] for x in images),\\'resource_records\\':len(resources),\\'compiler_starts_examined\\':353,\\'resolved_contiguous_extents\\':resolved,\\'remaining_boundary_unknowns\\':353-resolved,\\'source_types_recovered\\':False,\\'whole_payload_decompiled\\':False,\\'whole_application_build_verified\\':False,\\'behavior_equivalence_verified\\':False}\\\\n (out/\\'summary.json\\').write_text(json.dumps(summary,indent=2)+\\'\\\\\\\\n\\');print(json.dumps(summary,indent=2))\\\\nif __name__==\\'__main__\\':main()\\\\n\", \"madsp-capacity-review/verification.json\": \"{\\\\n  \\\\\"image_sha256\\\\\": \\\\\"8b7cbaa383d3050241921e74d1334b22703193afed6ea5e9388599cc42a60fe8\\\\\",\\\\n  \\\\\"original_entry\\\\\": \\\\\"0xa946c\\\\\",\\\\n  \\\\\"next_compiler_start\\\\\": \\\\\"0xa9f80\\\\\",\\\\n  \\\\\"extent_bytes\\\\\": 2836,\\\\n  \\\\\"phase_start\\\\\": \\\\\"0xa94bc\\\\\",\\\\n  \\\\\"stop_before_real_call\\\\\": \\\\\"0xa94fc\\\\\",\\\\n  \\\\\"cases\\\\\": 3600,\\\\n  \\\\\"passes_O0_O2_O3\\\
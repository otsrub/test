name: REA six complete integer digit source functions
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/rea-integer-digits.yml
      - reconstruction/logic/verify_logic_integer_digits.py
      - reconstruction/logic/logic_integer_digits.c
permissions:
  contents: read
  actions: read
jobs:
  recover-and-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [binary, octal, hex, count, decimal, generic]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: rea-logic-tail-adapters-evidence
          run-id: '39845208071'
          github-token: ${{ github.token }}
          path: prior
      - uses: actions/download-artifact@v4
        with:
          name: rea-continuation-dossiers-evidence
          run-id: '38815798247'
          github-token: ${{ github.token }}
          path: dossiers
      - name: Install bounded verifier dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          python -m pip install unicorn==2.1.4
      - name: Recover source and execute original comparisons
        env:
          REA_LANE: ${{ matrix.lane }}
        run: |
          python reconstruction/logic/verify_logic_integer_digits.py
      - name: Preserve source and diagnostics
        if: always()
        run: |
          mkdir -p evidence
          cp reconstruction/logic/verify_logic_integer_digits.py reconstruction/logic/logic_integer_digits.c evidence/
          cp -a integer-digits-${{ matrix.lane }} evidence/ 2>/dev/null || true
          sha256sum dossiers/logic-input/target.bin > evidence/ORIGINAL_SHA256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rea-integer-digits-${{ matrix.lane }}-evidence
          path: evidence
          retention-days: 90
  clean-source-package:
    needs: recover-and-compare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: rea-integer-digits-*-evidence
          path: verified
      - uses: actions/download-artifact@v4
        with:
          name: rea-logic-tail-adapters-evidence
          run-id: '39845208071'
          github-token: ${{ github.token }}
          path: prior
      - uses: actions/download-artifact@v4
        with:
          name: rea-continuation-dossiers-evidence
          run-id: '38815798247'
          github-token: ${{ github.token }}
          path: dossiers
      - name: Clean isolated source build
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 make
          python reconstruction/logic/package_logic_digits.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rea-integer-digits-clean-source-package
          path: integer-digits-source-package
          retention-days: 90

name: REA image - MobileLogicAppFramework
'on':
  push:
    paths:
    - .github/workflows/rea-image-mobilelogicappframework.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MobileLogicAppFramework.framework/MobileLogicAppFramework
      artifact: rea-image-mobilelogicappframework

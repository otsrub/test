name: REA image - MAMobileGeneralUI
'on':
  push:
    paths:
    - .github/workflows/rea-image-mamobilegeneralui.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MAMobileGeneralUI.framework/MAMobileGeneralUI
      artifact: rea-image-mamobilegeneralui

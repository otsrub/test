name: REA image - EmbeddedRemoteConfiguration
'on':
  push:
    paths:
    - .github/workflows/rea-image-embeddedremoteconfiguration.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/EmbeddedRemoteConfiguration.framework/EmbeddedRemoteConfiguration
      artifact: rea-image-embeddedremoteconfiguration

name: REA image - MAUniversalContent
'on':
  push:
    paths:
    - .github/workflows/rea-image-mauniversalcontent.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MAUniversalContent.framework/MAUniversalContent
      artifact: rea-image-mauniversalcontent

name: REA clean stage source subset packages
'on':
  push:
    paths:
      - .github/workflows/rea-stage-source-packages.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: rea-stage-source-packages
  cancel-in-progress: false
jobs:
  clean-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rea-stage-verify-0-evidence
          run-id: '40029790426'
          github-token: ${{ github.token }}
          path: parents/first-0
      - uses: actions/download-artifact@v4
        with:
          name: rea-stage-verify-1-evidence
          run-id: '40029854999'
          github-token: ${{ github.token }}
          path: parents/first-1
      - uses: actions/download-artifact@v4
        with:
          name: rea-stage-verify-0-evidence
          run-id: '40040030600'
          github-token: ${{ github.token }}
          path: parents/next-0
      - uses: actions/download-artifact@v4
        with:
          name: rea-stage-verify-1-evidence
          run-id: '40040055416'
          github-token: ${{ github.token }}
          path: parents/next-1
      - name: Install ARM64 iOS build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
      - name: Validate immutable parent evidence and clean-build every source package
        run: python reconstruction/package_stage_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rea-stage-clean-source-packages
          path: |
            stage-source-packages/
            reconstruction/package_stage_sources.py
          retention-days: 90
          if-no-files-found: error

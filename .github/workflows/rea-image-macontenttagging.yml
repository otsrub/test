name: REA image - MAContentTagging
'on':
  push:
    paths:
    - .github/workflows/rea-image-macontenttagging.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MAContentTagging.framework/MAContentTagging
      artifact: rea-image-macontenttagging

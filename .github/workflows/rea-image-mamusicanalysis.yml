name: REA image - MAMusicAnalysis
'on':
  push:
    paths:
    - .github/workflows/rea-image-mamusicanalysis.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MAMusicAnalysis.framework/MAMusicAnalysis
      artifact: rea-image-mamusicanalysis

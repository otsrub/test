name: REA clean twelve-function source package rebuild
'on':
  push:
    paths:
    - .github/workflows/rea-clean-source-package.yml
permissions:
  contents: read
  actions: read
jobs:
  clean-source-rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ github.run_attempt == 1 }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: rea-explicit-exception-boundary-review
        run-id: '38738021541'
        github-token: ${{ github.token }}
        path: prior
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install official build tools and pinned reference emulator
      run: 'sudo apt-get update

        sudo apt-get install -y clang-18 lld-18 llvm-18 make

        python -m pip install unicorn==2.1.4 capstone==5.0.6'
    - name: Stage clean build and verification files
      shell: python
      run: 'import pathlib,base64

        p=pathlib.Path("assets");p.mkdir(exist_ok=True)

        assets={''package_subset.py'': '''',
        ''subset_build.py'': '''',
        ''verify_packaged_eight.py'': '''',
        ''verify_tagged_subset.py'': '''',
        ''payload_inventory.py'': '''',
        ''subset_api.h'': '''',
        ''subset.Makefile'': '''',
        ''SUBSET_README.md'': ''''}

        for name,data in assets.items():(p/name).write_bytes(base64.b64decode(data))

        '
    - name: Assemble source package without any prebuilt objects
      run: 'python assets/package_subset.py prior/prior-boundary-dossiers/prior-twelve-function-checkpoint
        source-package assets

        zip -qr mobilelogic-subset-source-only.zip source-package'
    - name: Build all twelve functions from source and test freshly linked Mach-O
      run: make -C source-package verify
    - name: Preserve checkpoint and build evidence
      if: always()
      run: 'mkdir -p evidence

        cp -R source-package evidence/

        cp -R prior evidence/prior-exception-checkpoint

        cp mobilelogic-subset-source-only.zip evidence/'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rea-clean-source-package-and-rebuild-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 90

name: MobileLogic iPhone startup diagnostic build
'on':
  push:
    paths:
    - .github/workflows/rea-diagnostics.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
    - name: Prepare diagnostic sources
      run: "cat > trace.m <<'SOURCE'\n#import <Foundation/Foundation.h>\n#import <objc/runtime.h>\n#import <TargetConditionals.h>\n#import <dispatch/dispatch.h>\n#if TARGET_OS_IPHONE\n#import <UIKit/UIKit.h>\n#endif\n#include <stdio.h>\n#include <stdlib.h>\n#include <fcntl.h>\n#include <pthread.h>\n#include <unistd.h>\n\nstatic int MLLogFD = -1;\nstatic pthread_mutex_t MLLogLock = PTHREAD_MUTEX_INITIALIZER;\nstatic NSMutableSet<NSString *> *MLInstalled;\n\nstatic void MLTrace(const char *event, Class cls, SEL selector) {\n    pthread_mutex_lock(&MLLogLock);\n    if (MLLogFD >= 0) {\n        dprintf(MLLogFD, \"%.3f %s %s %s\\n\", NSDate.date.timeIntervalSince1970,\n                event, cls ? class_getName(cls) : \"-\", selector ? sel_getName(selector) : \"-\");\n        fsync(MLLogFD);\n    }\n    pthread_mutex_unlock(&MLLogLock);\n}\n\nstatic BOOL MLSelected(SEL selector) {\n    NSString *s = NSStringFromSelector(selector);\n    return [@[\n        @\"bootstrap\", @\"bootstrapInBackground\", @\"bootstrapDone\", @\"bootstrapWithManifest:\",\n        @\"showLaunchViewController\", @\"_didShowLaunchViewController\",\n        @\"_executeWorkflowActionAfterPresentingLaunchViewController\",\n        @\"_executeWorkflowActionAfterAppControllerDidStartApplicationAndSubscriptionInfoAvailable\",\n        @\"appWorkflowController:presentLaunchViewControllerWithCompletion:\",\n        @\"appWorkflowController:getSubscriptionInfoWithCompletionBlock:\",\n        @\"appWorkflowControllerDismissLaunchViewController:completion:\"\n    ] containsObject:s];\n}\n\n// Exported for an executable ABI-preservation test; installation uses class-owned methods only.\nvoid MLInstallForClass(Class cls) {\n    if (!cls) return;\n    if (!MLInstalled) MLInstalled = [NSMutableSet set];\n    unsigned count = 0;\n    Method *methods = class_copyMethodList(cls, &count);\n    for (unsigned i = 0; i < count; i++) {\n        Method method = methods[i];\n        SEL selector = method_getName(method);\n        if (!MLSelected(selector)) continue;\n        NSString *key = [NSString stringWithFormat:@\"%p:%s\", (__bridge void *)cls, sel_getName(selector)];\n        if ([MLInstalled containsObject:key]) continue;\n        unsigned argc = method_getNumberOfArguments(method);\n        BOOL objectArgs = YES;\n        for (unsigned a = 2; a < argc; a++) {\n            char *type = method_copyArgumentType(method, a);\n            if (!type || type[0] != '@') objectArgs = NO;\n            free(type);\n        }\n        if (!objectArgs) continue;\n        char *returnType = method_copyReturnType(method);\n        char rt = returnType ? returnType[0] : 0;\n        free(returnType);\n        IMP original = method_getImplementation(method);\n        IMP replacement = NULL;\n        if (rt == 'v' && argc == 2) {\n            replacement = imp_implementationWithBlock(^void(id self) {\n                MLTrace(\"BEGIN\", cls, selector);\n                @try { ((void (*)(id, SEL))original)(self, selector); }\n                @finally { MLTrace(\"END\", cls, selector); }\n            });\n        } else if (rt == 'v' && argc == 3) {\n            replacement = imp_implementationWithBlock(^void(id self, id a) {\n                MLTrace(\"BEGIN\", cls, selector);\n                @try { ((void (*)(id, SEL, id))original)(self, selector, a); }\n                @finally { MLTrace(\"END\", cls, selector); }\n            });\n        } else if (rt == 'v' && argc == 4) {\n            replacement = imp_implementationWithBlock(^void(id self, id a, id b) {\n                MLTrace(\"BEGIN\", cls, selector);\n                @try { ((void (*)(id, SEL, id, id))original)(self, selector, a, b); }\n                @finally { MLTrace(\"END\", cls, selector); }\n            });\n        } else if (rt == 'B' && argc == 4) {\n            replacement = imp_implementationWithBlock(^BOOL(id self, id a, id b) {\n                MLTrace(\"BEGIN\", cls, selector);\n                @try { return ((BOOL (*)(id, SEL, id, id))original)(self, selector, a, b); }\n                @finally { MLTrace(\"END\", cls, selector); }\n            });\n        }\n        if (replacement) {\n            [MLInstalled addObject:key];\n            method_setImplementation(method, replacement);\n            MLTrace(\"HOOK\", cls, selector);\n        } else MLTrace(\"UNSUPPORTED_SIGNATURE\", cls, selector);\n    }\n    free(methods);\n}\n\nstatic void MLInstallHooks(void) {\n    unsigned count = 0;\n    Class *classes = objc_copyClassList(&count);\n    NSString *bundle = NSBundle.mainBundle.bundlePath;\n    for (unsigned i = 0; i < count; i++) {\n        const char *image = class_getImageName(classes[i]);\n        if (!image || ![[NSString stringWithUTF8String:image] hasPrefix:bundle]) continue;\n        MLInstallForClass(classes[i]);\n        MLInstallForClass(object_getClass(classes[i]));\n    }\n    free(classes);\n}\n\n__attribute__((constructor)) static void MLDiagnosticsStart(void) {\n    @autoreleasepool {\n        NSString *documents = [NSHomeDirectory() stringByAppendingPathComponent:@\"Documents\"];\n        [NSFileManager.defaultManager createDirectoryAtPath:documents withIntermediateDirectories:YES attributes:nil error:nil];\n        NSString *file = [documents stringByAppendingPathComponent:@\"MobileLogic-startup.log\"];\n        MLLogFD = open(file.fileSystemRepresentation, O_CREAT | O_WRONLY | O_APPEND, 0600);\n        MLTrace(\"DIAGNOSTICS_LOADED\", Nil, NULL);\n        if (MLLogFD >= 0) {\n            NSString *bundleID = NSBundle.mainBundle.bundleIdentifier ?: @\"unknown\";\n            dprintf(MLLogFD, \"Bundle: %s OS: %s\\n\", bundleID.UTF8String, NSProcessInfo.processInfo.operatingSystemVersionString.UTF8String);\n        }\n        MLInstalled = [NSMutableSet set];\n        MLInstallHooks();\n        [[NSNotificationCenter defaultCenter] addObserverForName:@\"UIApplicationDidFinishLaunchingNotification\" object:nil queue:NSOperationQueue.mainQueue usingBlock:^(NSNotification *note) {\n            MLTrace(\"DID_FINISH_LAUNCH_NOTIFICATION\", Nil, NULL);\n            MLInstallHooks();\n        }];\n        for (NSNumber *delay in @[@1, @5, @15, @30, @60, @120]) {\n            dispatch_after(dispatch_time(DISPATCH_TIME_NOW, delay.longLongValue * NSEC_PER_SEC), dispatch_get_global_queue(QOS_CLASS_UTILITY, 0), ^{\n                MLTrace(\"BACKGROUND_HEARTBEAT\", Nil, NULL);\n                dispatch_async(dispatch_get_main_queue(), ^{\n                    MLTrace(\"MAIN_HEARTBEAT\", Nil, NULL);\n                    MLInstallHooks();\n                });\n            });\n        }\n    }\n}\n\nSOURCE\ncat > test.m <<'SOURCE'\n#import <Foundation/Foundation.h>\n#import <objc/runtime.h>\nextern void MLInstallForClass(Class cls);\n@interface MLDiagnosticMock : NSObject\n@property NSUInteger count;\n- (void)bootstrap;\n- (void)bootstrapWithManifest:(id)manifest;\n- (BOOL)appWorkflowController:(id)controller presentLaunchViewControllerWithCompletion:(void (^)(void))completion;\n@end\n@implementation MLDiagnosticMock\n- (void)bootstrap { self.count++; }\n- (void)bootstrapWithManifest:(id)manifest { NSCAssert([manifest isEqual:@\"manifest\"], @\"Argument changed\"); self.count++; }\n- (BOOL)appWorkflowController:(id)controller presentLaunchViewControllerWithCompletion:(void (^)(void))completion {\n    NSCAssert([controller isEqual:@\"controller\"], @\"Controller argument changed\");\n    self.count++;\n    completion();\n    return YES;\n}\n@end\nint main(void) {\n    @autoreleasepool {\n        MLInstallForClass(MLDiagnosticMock.class);\n        MLInstallForClass(MLDiagnosticMock.class);\n        MLDiagnosticMock *mock = [MLDiagnosticMock new];\n        [mock bootstrap];\n        [mock bootstrapWithManifest:@\"manifest\"];\n        __block BOOL callback = NO;\n        BOOL returned = [mock appWorkflowController:@\"controller\" presentLaunchViewControllerWithCompletion:^{ callback = YES; }];\n        NSCAssert(mock.count == 3 && callback && returned, @\"Original calls, callback, or return value changed\");\n        puts(\"Diagnostic wrapper preserves arguments, callbacks, return values, and call counts.\");\n    }\n    return 0;\n}\n\nSOURCE\ncat > package.py <<'SOURCE'\nimport copy\nimport hashlib\nimport json\nimport pathlib\nimport plistlib\nimport struct\nimport zipfile\n\nsource = pathlib.Path('MobileLogic.zip')\nassert hashlib.file_digest(source.open('rb'), 'sha256').hexdigest() == 'f2a650fd7a51a7bb2bc5e8e5cc35a95236c02723ab3faeb162cca64ee62a744e'\ndylib = pathlib.Path('MobileLogicDiagnostics.dylib').read_bytes()\nassert dylib[:4] == bytes.fromhex('cffaedfe')\nout = pathlib.Path('out')\nout.mkdir(exist_ok=True)\nreport = {'purpose': 'Diagnostic startup logging; no loading-screen fix is claimed', 'original_code_changed': False, 'original_resources_changed': False, 'added_dylib_load_command': True, 'added_library': 'Frameworks/MobileLogicDiagnostics.dylib', 'log_path': 'Documents/MobileLogic-startup.log', 'requires_resigning': True, 'device_tested': False, 'library_sha256': hashlib.sha256(dylib).hexdigest()}\nprefix = 'Payload/MobileLogic.app/'\nwith zipfile.ZipFile(source) as z, zipfile.ZipFile(out/'MobileLogic-diagnostics.ipa', 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as target:\n    info = plistlib.loads(z.read('Info.plist'))\n    executable = info['CFBundleExecutable']\n    for item in z.infolist():\n        if item.is_dir() or item.filename.startswith('__MACOSX/'):\n            continue\n        data = z.read(item)\n        if item.filename == 'Info.plist':\n            info['UIFileSharingEnabled'] = True\n            info['LSSupportsOpeningDocumentsInPlace'] = True\n            data = plistlib.dumps(info, fmt=plistlib.FMT_BINARY)\n        elif item.filename == executable:\n            assert data[:4] == bytes.fromhex('cffaedfe')\n            original = data\n            b = bytearray(data)\n            ncmds, sizeofcmds = struct.unpack_from('<II', b, 16)\n            offset = 32\n            section_starts = []\n            for _ in range(ncmds):\n                cmd, size = struct.unpack_from('<II', b, offset)\n                if cmd == 0x19:\n                    nsects = struct.unpack_from('<I', b, offset+64)[0]\n                    for j in range(nsects):\n                        pos = offset + 72 + j*80\n                        fileoff = struct.unpack_from('<I', b, pos+48)[0]\n                        if fileoff: section_starts.append(fileoff)\n                if cmd in (0x21,0x2c): assert struct.unpack_from('<I',b,offset+16)[0] == 0\n                offset += size\n            name = b'@executable_path/Frameworks/MobileLogicDiagnostics.dylib\\0'\n            cmdsize = (24+len(name)+7)&~7\n            command = struct.pack('<IIIIII', 0xc, cmdsize, 24, 0, 0x10000, 0x10000) + name\n            command += b'\\0'*(cmdsize-len(command))\n            assert 32+sizeofcmds+cmdsize <= min(section_starts), 'Insufficient Mach-O header padding'\n            assert not any(b[32+sizeofcmds:32+sizeofcmds+cmdsize]), 'Nonzero header padding'\n            b[32+sizeofcmds:32+sizeofcmds+cmdsize] = command\n            struct.pack_into('<II', b, 16, ncmds+1, sizeofcmds+cmdsize)\n            assert b[min(section_starts):] == original[min(section_starts):], 'Code or data bytes changed'\n            data = bytes(b)\n            report['original_main_sha256'] = hashlib.sha256(original).hexdigest()\n            report['diagnostic_main_sha256'] = hashlib.sha256(data).hexdigest()\n        entry = copy.copy(item)\n        entry.filename = prefix + item.filename\n        entry.compress_type = zipfile.ZIP_DEFLATED\n        target.writestr(entry, data)\n    entry = zipfile.ZipInfo(prefix+'Frameworks/MobileLogicDiagnostics.dylib')\n    entry.create_system = 3\n    entry.external_attr = 0o100755 << 16\n    entry.compress_type = zipfile.ZIP_DEFLATED\n    target.writestr(entry, dylib)\nipa = out/'MobileLogic-diagnostics.ipa'\nreport['ipa_sha256'] = hashlib.file_digest(ipa.open('rb'), 'sha256').hexdigest()\nreport['ipa_bytes'] = ipa.stat().st_size\nwith zipfile.ZipFile(ipa) as z:\n    assert z.testzip() is None\n    check = plistlib.loads(z.read(prefix+'Info.plist'))\n    assert check['UIFileSharingEnabled'] and check['LSSupportsOpeningDocumentsInPlace']\n    assert z.read(prefix+'Frameworks/MobileLogicDiagnostics.dylib') == dylib\n(out/'diagnostic-report.json').write_text(json.dumps(report, indent=2))\n(out/'README.txt').write_text('This IPA is a diagnostic copy, not a confirmed fix. Re-sign it using your existing signing method. After launching and waiting up to two minutes, open Files > On My iPhone > the Logic app folder and share MobileLogic-startup.log. The library records method names and launch milestones, not account values or callback arguments. Native code and resources remain unchanged; the executable header loads the logging library. No device runtime test has been performed.\\n')\nprint(json.dumps(report, indent=2))\n\nSOURCE\n"
    - name: Test original call and return preservation
      run: 'xcrun clang -fobjc-arc -fblocks trace.m test.m -framework Foundation -o diagnostic-tests

        ./diagnostic-tests

        '
    - name: Build iPhone ARM64 diagnostic library
      run: 'sdk=$(xcrun --sdk iphoneos --show-sdk-path)

        xcrun --sdk iphoneos clang -arch arm64 -isysroot "$sdk" -miphoneos-version-min=15.0 -fobjc-arc -fblocks -dynamiclib trace.m -framework Foundation -framework UIKit -Wl,-install_name,@rpath/MobileLogicDiagnostics.dylib -o MobileLogicDiagnostics.dylib

        codesign --force --sign - MobileLogicDiagnostics.dylib

        xcrun --sdk iphoneos --show-sdk-version

        '
    - name: Package and verify diagnostic IPA
      run: 'curl -fL --retry 3 -o MobileLogic.zip https://github.com/otsrub/test/releases/download/mobilelogic-3.4-archive/MobileLogic.zip

        python3 package.py

        '
    - uses: actions/upload-artifact@v4
      with:
        name: MobileLogic-iPhone-diagnostics
        path: out/
        if-no-files-found: error
        retention-days: 90
        compression-level: 0

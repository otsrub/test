name: REA GUI aliasing and original callback source repair
'on':
  push:
    paths:
    - .github/workflows/rea-gui-alias-callback.yml
permissions:
  contents: read
  actions: read
jobs:
  gui-alias-callback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ github.run_attempt == 1 }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: rea-second-composeline-manual-evidence
        run-id: '38777234339'
        github-token: ${{ github.token }}
        path: prior-checkpoint
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install official compiler and pinned emulator
      run: 'sudo apt-get update

        sudo apt-get install -y clang-18 lld-18 llvm-18

        python -m pip install unicorn==2.1.4 capstone==5.0.6'
    - name: Stage changed source and preserved counterexamples
      shell: python
      run: "import pathlib,json,shutil\na=json.loads('{\"gui_25210_candidate.c\": \"/* Instruction-derived candidate: MAPlugInGUI 0x25210, first ComposeLine.\\\\n * Fixed-width arithmetic preserves observed integer rounding, including the\\\\n * unusual mode-14 expression. Built-in paths require nonnegative lengths and\\\\n * valid ordinary buffers. Aliasing and callback tests are recorded separately.\\\\n * No default substitute algorithm and no helper stubs are provided. */\\\\n#include <stdint.h>\\\\n#include <stddef.h>\\\\n#define memcpy __builtin_memcpy\\\\ntypedef unsigned char byte;\\\\nstatic unsigned min_u(unsigned a,unsigned b) { return a<b?a:b; }\\\\ntypedef struct { void *mode; uint32_t event,pad; void *dst; const void *src,*mask; uint32_t index,extra; } gui_event;\\\\ntypedef void (*gui_callback)(void *,gui_event *);\\\\n_Static_assert(offsetof(gui_event,dst)==0x10,\\\\\"event layout\\\\\");\\\\n_Static_assert(offsetof(gui_event,index)==0x28,\\\\\"event index\\\\\");\\\\nvoid mobilelogic_maplugingui_25210_candidate(const void *mode,byte *dst,const byte *src,const byte *mask,int length,int extra) {\\\\n int32_t kind; memcpy(&kind,mode,4);unsigned alpha=((const byte *)mode)[6];\\\\n if(kind==31||kind==32) {\\\\n  gui_callback callback;void *context;\\\\n  memcpy(&callback,(const byte *)mode+8,sizeof callback);\\\\n  gui_event event;\\\\n  if(kind==31 && callback) {\\\\n   memcpy(&context,(const byte *)mode+16,sizeof context);\\\\n   /* First event\\'s mode and initial padding are uninitialized in the original.\\\\n    * This candidate does not invent values: leave the same fields unspecified. */\\\\n   event.event=2;event.dst=0;event.src=0;event.mask=0;event.index=(uint32_t)length;event.extra=(uint32_t)extra;\\\\n   callback(context,&event);\\\\n  }\\\\n  event.mode=(void *)mode;event.event=3;event.dst=dst;event.src=src;event.mask=mask;event.index=(uint32_t)length;event.extra=(uint32_t)extra;\\\\n  memcpy(&callback,(const byte *)mode+8,sizeof callback);\\\\n  if(!callback || !length) return;\\\\n  for(uint32_t i=0;i<(uint32_t)length;i++) {\\\\n   memcpy(&callback,(const byte *)mode+8,sizeof callback);memcpy(&context,(const byte *)mode+16,sizeof context);\\\\n   callback(context,&event);\\\\n   event.dst=(byte *)event.dst+8;event.src=(const byte *)event.src+8;event.mask=(const byte *)event.mask+8;event.index++;\\\\n  }\\\\n  return;\\\\n }\\\\n if(!length)return;\\\\n if(kind==0) {\\\\n  for(int i=0;i<length;i++) {dst[0]=(byte)alpha;dst[1]=255;dst[2]=255;dst[3]=255;dst+=4;}\\\\n  return;\\\\n }\\\\n if(kind==1) {\\\\n  if(alpha==255) for(int i=0;i<length;i++) {unsigned v=*mask;dst[1]=(byte)v;dst[2]=(byte)v;dst[3]=*mask++;dst[0]=255;dst+=4;}\\\\n  return;\\\\n }\\\\n if(kind!=2 && kind!=6 && kind!=8 && kind!=14)return;\\\\n if(!alpha)return;\\\\n for(int i=0;i<length;i++,src+=4,mask++,dst+=4) {\\\\n  if(kind==2 || kind==6) {\\\\n   if(alpha==255) {\\\\n    unsigned v=*mask;dst[1]=(byte)v;dst[2]=(byte)v;dst[3]=*mask;dst[0]=255;\\\\n   } else {\\\\n    /* Native 0x2561c / 0x25760 re-read the mask after each store. */\\\\n    dst[1]=(byte)((alpha*(*mask+1u)+(255u-alpha)*(src[1]+1u))>>8);\\\\n    dst[2]=(byte)((alpha*(*mask+1u)+(255u-alpha)*(src[2]+1u))>>8);\\\\n    dst[3]=(byte)((alpha*(*mask+1u)+(255u-alpha)*(src[3]+1u))>>8);\\\\n    dst[0]=(byte)(alpha>src[0]?alpha:src[0]);\\\\n   }\\\\n   continue;\\\\n  }\\\\n  /* Original caches red/green across the channel stores. Mode 14 also\\\\n   * caches blue; mode 8 deliberately reads blue after the first stores. */\\\\n  unsigned red=src[1],green=src[2],blue=0;\\\\n  unsigned value;\\\\n  if(kind==8)value=((red+2u*green)*0x5556u>>16)*(*mask)>>8;\\\\n  else {blue=src[3];unsigned m=*mask;value=(min_u(red,m)+min_u(green,m)+(min_u(blue,m)*0xabu>>9))&255u;}\\\\n  if(alpha==255) {dst[1]=(byte)value;dst[2]=(byte)value;dst[3]=(byte)value;dst[0]=255;}\\\\n  else {\\\\n   unsigned scaled=alpha*(value+1u);\\\\n   dst[1]=(byte)((scaled+(255u-alpha)*(red+1u))>>8);\\\\n   dst[2]=(byte)((scaled+(255u-alpha)*(green+1u))>>8);\\\\n   dst[3]=(byte)((scaled+(255u-alpha)*((kind==14?blue:src[3])+1u))>>8);\\\\n   dst[0]=(byte)(alpha>src[0]?alpha:src[0]);\\\\n  }\\\\n }\\\\n}\\\\n\", \"gui_26390_candidate.c\": \"/* Instruction-derived second ComposeLine candidate, MAPlugInGUI 0x26390.\\\\n * Deliberately preserves pointer-dependent blending in the ORIGINAL code.\\\\n * Do not replace src+1 by src[0]+1: the native MADD consumes the address.\\\\n * Ordinary distinct buffers, nonnegative count; callback contract unverified.\\\\n */\\\\n#include <stdint.h>\\\\n#include <stddef.h>\\\\ntypedef unsigned char byte;\\\\nextern void *memset(void *,int,size_t);\\\\nextern void mobilelogic_maplugingui_25210_candidate(const void *,byte *,const byte *,const byte *,int,int);\\\\nstatic unsigned luma(unsigned r,unsigned g,unsigned b) {\\\\n return (unsigned)(((uint64_t)(299u*r+587u*g+114u*b)*0x418938u)>>32);\\\\n}\\\\nvoid mobilelogic_maplugingui_26390_candidate(const void *mode,byte *dst,const byte *src,const byte *rgba,int length,int extra) {\\\\n int32_t kind;__builtin_memcpy(&kind,mode,4);unsigned alpha=((const byte *)mode)[6];\\\\n if(kind==31||kind==32) {mobilelogic_maplugingui_25210_candidate(mode,dst,src,rgba,length,extra);return;}\\\\n if(!length)return;\\\\n if(kind==0){memset(dst,(int)alpha,(uint32_t)length);return;}\\\\n if(kind==1) {\\\\n  if(alpha==255) for(int i=0;i<length;i++,rgba+=4) *dst++=(byte)(((rgba[1]+rgba[2]+rgba[3])*0x5556u)>>16);\\\\n  return;\\\\n }\\\\n if(kind!=2 && kind!=6 && kind!=8 && kind!=14)return;\\\\n if(kind==14 && !alpha)return;\\\\n for(int i=0;i<length;i++,rgba+=4,src++,dst++) {\\\\n  unsigned gray;\\\\n  if(kind==8)gray=luma(rgba[1]*(*src)>>8,rgba[2]*(*src)>>8,rgba[3]*(*src)>>8);\\\\n  else gray=luma(rgba[1],rgba[2],rgba[3]);\\\\n  if(kind==14) {\\\\n   if(gray>*src)gray=*src;\\\\n   if(alpha==255)*dst=(byte)gray;\\\\n   else *dst=(byte)(((uintptr_t)src*(255u-alpha)+(255u-alpha)+alpha*(gray+1u))>>8);\\\\n  } else {\\\\n   unsigned eff=alpha*(rgba[0]+1u)>>8;\\\\n   if(eff==255)*dst=(byte)gray;\\\\n   else if(eff)*dst=(byte)(((uintptr_t)(src+1)*(255u-eff)+eff*(gray+1u))>>8);\\\\n  }\\\\n }\\\\n}\\\\n\", \"verify_gui_25210.py\": \"\\\\\"\\\\\"\\\\\"Built-in ComposeLine paths vs original instructions; callbacks excluded.\\\\\"\\\\\"\\\\\"\\\\nimport pathlib,hashlib,struct,random,ctypes,subprocess,json,sys\\\\nfrom unicorn import Uc,UC_ARCH_ARM64,UC_MODE_ARM,UC_HOOK_CODE\\\\nfrom unicorn.arm64_const import *\\\\nfrom payload_inventory import macho\\\\nroot=pathlib.Path(__file__).resolve().parent;out=root/\\'gui-25210-review\\';out.mkdir(exist_ok=True)\\\\nblob=(root/\\'maplugingui-input/target.bin\\').read_bytes();sha=hashlib.sha256(blob).hexdigest()\\\\nassert sha==\\'74caec7240779c9be25d4dbf9fde574a2783c8192cca262866b1511bb01fe1b4\\'\\\\nm=macho(blob);A=0x25210;E=0x26390;assert m[\\'starts\\'][m[\\'starts\\'].index(A)+1]==E\\\\nu=Uc(UC_ARCH_ARM64,UC_MODE_ARM)\\\\nfor vm,off,n in m[\\'segments\\']:\\\\n if n:u.mem_map(vm&~4095,((vm+n+4095)&~4095)-(vm&~4095));u.mem_write(vm,blob[off:off+n])\\\\nBASE=0x2000000;SIZE=0x10000;STACK=0x2100000;STOP=0x3000000\\\\nu.mem_map(BASE,SIZE);u.mem_map(STACK,0x4000);covered=set()\\\\ndef hook(uc,pc,n,user):\\\\n assert A<=pc<E,hex(pc)\\\\n covered.add(pc)\\\\nu.hook_add(UC_HOOK_CODE,hook)\\\\nlibs=[];diag=[]\\\\nfor opt in [0,2,3]:\\\\n p=out/f\\'gui-O{opt}.so\\';argv=[\\'cc\\',\\'-std=c11\\',f\\'-O{opt}\\',\\'-Wall\\',\\'-Wextra\\',\\'-Werror\\',\\'-shared\\',\\'-fPIC\\',str(root/\\'gui_25210_candidate.c\\'),\\'-o\\',str(p)]\\\\n r=subprocess.run(argv,text=True,capture_output=True);diag.append({\\'argv\\':argv,\\'exit_code\\':r.returncode,\\'stderr\\':r.stderr});r.check_returncode()\\\\n lib=ctypes.CDLL(str(p));f=lib.mobilelogic_maplugingui_25210_candidate;f.argtypes=[ctypes.c_void_p]*4+[ctypes.c_int]*2;f.restype=None;libs.append((lib,f))\\\\narm=[]\\\\nif \\'--arm\\' in sys.argv:\\\\n for opt in [0,2,3]:\\\\n  obj=out/f\\'gui-arm-O{opt}.o\\';p=out/f\\'gui-arm-O{opt}.dylib\\'\\\\n  for argv in [[\\'clang-18\\',\\'-target\\',\\'arm64-apple-ios17.0\\',f\\'-O{opt}\\',\\'-ffreestanding\\',\\'-Wall\\',\\'-Wextra\\',\\'-Werror\\',\\'-c\\',str(root/\\'gui_25210_candidate.c\\'),\\'-o\\',str(obj)],[\\'ld64.lld-18\\',\\'-arch\\',\\'arm64\\',\\'-platform_version\\',\\'ios\\',\\'17.0\\',\\'17.0\\',\\'-dylib\\',\\'-undefined\\',\\'error\\',str(obj),\\'-o\\',str(p)]]:\\\\n   r=subprocess.run(argv,text=True,capture_output=True);diag.append({\\'argv\\':argv,\\'exit_code\\':r.returncode,\\'stderr\\':r.stderr});r.check_returncode()\\\\n  b=p.read_bytes();module=macho(b);assert not [s for s in module[\\'symbols\\'] if s[\\'undefined\\']]\\\\n  entry=next(int(s[\\'address\\'],16) for s in module[\\'symbols\\'] if s[\\'name\\']==\\'_mobilelogic_maplugingui_25210_candidate\\')\\\\n  v=Uc(UC_ARCH_ARM64,UC_MODE_ARM)\\\\n  for vm,off,n in module[\\'segments\\']:\\\\n   if n:v.mem_map(vm&~4095,((vm+n+4095)&~4095)-(vm&~4095));v.mem_write(vm,b[off:off+n])\\\\n  v.mem_map(BASE,SIZE);v.mem_map(STACK,0x4000);arm.append((v,entry))\\\\n(out/\\'compile-diagnostics.json\\').write_text(json.dumps(diag,indent=2)+\\'\\\\\\\\n\\')\\\\nrng=random.Random(A);host=ctypes.create_string_buffer(SIZE+16);hp=(ctypes.addressof(host)+15)&~15\\\\nlengths=[0,1,2,7,8,9,15,16,17,31,32,33,63,64,65,127,128,129]\\\\nkinds=[0,1,2,6,8,14,31,32,-2147483648,-1,3,7,9,15,30,33,2147483647]\\\\nalphas=[0,1,2,63,127,128,129,254,255];passed=[0]*3;failures=[];bykind={};arm_passed=[0]*len(arm)\\\\nfor case in range(len(kinds)*len(alphas)*len(lengths)*4):\\\\n n=case;kind=kinds[n%len(kinds)];n//=len(kinds);alpha=alphas[n%len(alphas)];n//=len(alphas);length=lengths[n%len(lengths)];n//=len(lengths)\\\\n ao=case%16;obj=0x100+ao;dst=0x2000+ao;src=0x4000+ao;mask=0x6000+ao\\\\n initial=bytearray(rng.randbytes(SIZE));struct.pack_into(\\'<i\\',initial,obj,kind);initial[obj+6]=alpha;struct.pack_into(\\'<Q\\',initial,obj+8,0)\\\\n if n<3:\\\\n  initial[src:src+4*length]=bytes([[0,255,128][n]])*(4*length);initial[mask:mask+length]=bytes([[0,255,128][n]])*length\\\\n u.mem_write(BASE,bytes(initial));u.mem_write(STACK,bytes(0x4000));u.reg_write(UC_ARM64_REG_SP,STACK+0x2000);u.reg_write(UC_ARM64_REG_X30,STOP);u.reg_write(UC_ARM64_REG_CPACR_EL1,3<<20)\\\\n for reg,value in zip([UC_ARM64_REG_X0,UC_ARM64_REG_X1,UC_ARM64_REG_X2,UC_ARM64_REG_X3,UC_ARM64_REG_X4,UC_ARM64_REG_X5],[BASE+obj,BASE+dst,BASE+src,BASE+mask,length,17]):u.reg_write(reg,value)\\\\n saved={reg:rng.getrandbits(64) for reg in [UC_ARM64_REG_X19,UC_ARM64_REG_X20,UC_ARM64_REG_X21,UC_ARM64_REG_X22,UC_ARM64_REG_X23,UC_ARM64_REG_X24,UC_ARM64_REG_X25,UC_ARM64_REG_X26,UC_ARM64_REG_X27,UC_ARM64_REG_X28]}\\\\n # Explicit constants avoid depending on register enum arithmetic for x29.\\\\n saved[UC_ARM64_REG_X29]=rng.getrandbits(64)\\\\n for reg,value in saved.items():u.reg_write(reg,value)\\\\n u.emu_start(A,STOP,count=100000);assert u.reg_read(UC_ARM64_REG_PC)==STOP\\\\n wanted=bytes(u.mem_read(BASE,SIZE));row=bykind.setdefault(str(kind),{\\'cases\\':0,\\'mismatches\\':0});row[\\'cases\\']+=1\\\\n for j,(_,f) in enumerate(libs):\\\\n  ctypes.memmove(hp,bytes(initial),SIZE);f(hp+obj,hp+dst,hp+src,hp+mask,length,17);actual=ctypes.string_at(hp,SIZE)\\\\n  ok=actual==wanted;passed[j]+=ok;row[\\'mismatches\\']+=not ok\\\\n  if not ok and len(failures)<20:\\\\n   diffs=[i for i,(a,b) in enumerate(zip(actual,wanted)) if a!=b];failures.append({\\'case\\':case,\\'optimization\\':[0,2,3][j],\\'kind\\':kind,\\'alpha\\':alpha,\\'length\\':length,\\'pattern\\':n,\\'first_differences\\':[{\\'offset\\':hex(i),\\'source\\':actual[i],\\'original\\':wanted[i]} for i in diffs[:8]]})\\\\n for j,(v,entry) in enumerate(arm):\\\\n  v.mem_write(BASE,bytes(initial));v.mem_write(STACK,bytes(0x4000));v.reg_write(UC_ARM64_REG_SP,STACK+0x2000);v.reg_write(UC_ARM64_REG_X30,STOP);v.reg_write(UC_ARM64_REG_CPACR_EL1,3<<20)\\\\n  for reg,value in zip([UC_ARM64_REG_X0,UC_ARM64_REG_X1,UC_ARM64_REG_X2,UC_ARM64_REG_X3,UC_ARM64_REG_X4,UC_ARM64_REG_X5],[BASE+obj,BASE+dst,BASE+src,BASE+mask,length,17]):v.reg_write(reg,value)\\\\n  for reg,value in saved.items():v.reg_write(reg,value)\\\\n  v.emu_start(entry,STOP,count=100000)\\\\n  ok=v.reg_read(UC_ARM64_REG_PC)==STOP and v.reg_read(UC_ARM64_REG_SP)==STACK+0x2000 and all(v.reg_read(reg)==value for reg,value in saved.items()) and bytes(v.mem_read(BASE,SIZE))==wanted\\\\n  arm_passed[j]+=ok\\\\n  if not ok and len(failures)<20:failures.append({\\'case\\':case,\\'arm_optimization\\':[0,2,3][j],\\'kind\\':kind,\\'alpha\\':alpha,\\'length\\':length})\\\\n if case%2000==0:print(\\'case\\',case,\\'passes\\',passed,\\'arm\\',arm_passed,flush=True)\\\\nreport={\\'original_image_sha256\\':sha,\\'entry\\':hex(A),\\'next_compiler_start\\':hex(E),\\'extent_bytes\\':E-A,\\'source_sha256\\':hashlib.sha256((root/\\'gui_25210_candidate.c\\').read_bytes()).hexdigest(),\\'cases\\':case+1,\\'O0_O2_O3_passes\\':passed,\\'mismatches\\':3*(case+1)-sum(passed),\\'first_failures\\':failures,\\'per_mode\\':bykind,\\'original_instruction_locations_exercised\\':len(covered),\\'scope\\':\\'Original complete entry-to-return built-in paths against host compiled C memory results; distinct valid buffers, nonnegative lengths 0..129, all built-in mode IDs, selected unsupported IDs, 9 opacity edges, 16 alignments, zero/255/128/random source patterns. Callback modes only with null callback. Does not verify callback ABI/behavior, aliasing, access footprints/order, preserved ABI, faults or device runtime.\\',\\'full_function_equivalence_verified\\':False,\\'new_decompiler_attempts\\':0}\\\\nreport[\\'ARM_O0_O2_O3_passes\\']=arm_passed\\\\nreport[\\'ARM_mismatches\\']=len(arm)*(case+1)-sum(arm_passed)\\\\nreport[\\'ARM_scope\\']=\\'Original vs actual linked ARM64 source instructions, full modeled memory, SP and x19-x29 preservation; same input restrictions as host tests. SIMD saved registers, access traces, callbacks and aliasing remain unverified.\\' if arm else \\'ARM source build/execution not performed in this environment.\\'\\\\n(out/\\'verification.json\\').write_text(json.dumps(report,indent=2)+\\'\\\\\\\\n\\');print(json.dumps(report,indent=2));assert not report[\\'mismatches\\'] and not report[\\'ARM_mismatches\\']\\\\n\", \"verify_gui_26390.py\": \"\\\\\"\\\\\"\\\\\"Second ComposeLine built-in paths vs original instructions; callbacks excluded.\\\\\"\\\\\"\\\\\"\\\\nimport pathlib,hashlib,struct,random,ctypes,subprocess,json,sys\\\\nfrom unicorn import Uc,UC_ARCH_ARM64,UC_MODE_ARM,UC_HOOK_CODE\\\\nfrom unicorn.arm64_const import *\\\\nfrom payload_inventory import macho\\\\nroot=pathlib.Path(__file__).resolve().parent;out=root/\\'gui-26390-review\\';out.mkdir(exist_ok=True)\\\\nblob=(root/\\'maplugingui-input/target.bin\\').read_bytes();sha=hashlib.sha256(blob).hexdigest()\\\\nassert sha==\\'74caec7240779c9be25d4dbf9fde574a2783c8192cca262866b1511bb01fe1b4\\'\\\\nm=macho(blob);A=0x26390;E=0x27a68;assert m[\\'starts\\'][m[\\'starts\\'].index(A)+1]==E\\\\nu=Uc(UC_ARCH_ARM64,UC_MODE_ARM)\\\\nfor vm,off,n in m[\\'segments\\']:\\\\n if n:u.mem_map(vm&~4095,((vm+n+4095)&~4095)-(vm&~4095));u.mem_write(vm,blob[off:off+n])\\\\nBASE=0x2000000;SIZE=0x10000;STACK=0x2100000;STOP=0x3000000\\\\nu.mem_map(BASE,SIZE);u.mem_map(STACK,0x4000);covered=set()\\\\ndef hook(uc,pc,n,user):\\\\n assert A<=pc<E,hex(pc)\\\\n covered.add(pc)\\\\nu.hook_add(UC_HOOK_CODE,hook)\\\\nlibs=[];diag=[]\\\\nfor opt in [0,2,3]:\\\\n p=out/f\\'gui-O{opt}.so\\';argv=[\\'cc\\',\\'-std=c11\\',f\\'-O{opt}\\',\\'-Wall\\',\\'-Wextra\\',\\'-Werror\\',\\'-shared\\',\\'-fPIC\\',str(root/\\'gui_25210_candidate.c\\'),str(root/\\'gui_26390_candidate.c\\'),\\'-o\\',str(p)]\\\\n r=subprocess.run(argv,text=True,capture_output=True);diag.append({\\'argv\\':argv,\\'exit_code\\':r.returncode,\\'stderr\\':r.stderr});(out/\\'compile-diagnostics.json\\').write_text(json.dumps(diag,indent=2)+\\'\\\\\\\\n\\');r.check_returncode()\\\\n lib=ctypes.CDLL(str(p));f=lib.mobilelogic_maplugingui_26390_candidate;f.argtypes=[ct
        import fs from 'node:fs';
        import path from 'node:path';
        import { pathToFileURL } from 'node:url';

        export function paperFunds(book, startingBalance) {
          if (!Number.isFinite(startingBalance) || startingBalance <= 0) throw new Error('Invalid paper starting balance');
          const pnl = book.closed.reduce((sum, p) => sum + p.pnl, 0);
          const atRisk = book.open.reduce((sum, p) => sum + p.stake, 0);
          if (![pnl, atRisk].every(Number.isFinite)) throw new Error('Invalid paper records');
          // Floor to cents: never spend an extra cent because of floating point rounding.
          const equity = Math.floor((startingBalance + pnl + 1e-9) * 100) / 100;
          const available = Math.floor((equity - atRisk + 1e-9) * 100) / 100;
          return { startingBalance, equity, available };
        }

        export function canAffordPaperTrade(book, stake, startingBalance) {
          return Number.isFinite(stake) && stake > 0 && stake <= paperFunds(book, startingBalance).available;
        }

        function replaceOnce(source, needle, replacement) {
          if (source.split(needle).length !== 2) throw new Error('Paper account patch does not match this app release');
          return source.replace(needle, replacement);
        }

        export function patchApp(root) {
          const enginePath = path.join(root, 'lib/strategy/engine.js');
          let engine = fs.readFileSync(enginePath, 'utf8');
          if (!engine.includes('// Bounded paper account')) {
            engine = replaceOnce(engine, 'import * as brokers from "../brokers/index.js";', 'import * as brokers from "../brokers/index.js";\n// Bounded paper account\nimport { paperFunds, canAffordPaperTrade } from "./paper-bankroll.js";');
            engine = replaceOnce(engine, '  const live = brokers.armedState().armed;', '  const live = brokers.armedState().armed;\n  const startingBalance = read("paper-bankroll.json", {}).startingBalance;');
            engine = replaceOnce(engine, '    const s = c.best;', '    if (!live && startingBalance !== undefined && !canAffordPaperTrade(b, cfg.stake, startingBalance)) {\n      scanOut.notes.push("Not enough available paper balance for another trade.");\n      continue;\n    }\n    const s = c.best;');
            engine = replaceOnce(engine, '    expectedPnl: expected,', '    expectedPnl: expected,\n    paperAccount: read("paper-bankroll.json", {}).startingBalance === undefined ? null : paperFunds(b, read("paper-bankroll.json", {}).startingBalance),');
            fs.writeFileSync(enginePath, engine);
            const uiPath = path.join(root, 'public/js/app.js');
            const ui = replaceOnce(fs.readFileSync(uiPath, 'utf8'), '${stat(st.open, "Open positions")}', '${st.paperAccount ? stat(usd(st.paperAccount.startingBalance), "Starting paper balance") + stat(usd(st.paperAccount.equity), "Paper balance including open stakes") + stat(usd(st.paperAccount.available), "Available paper cash") : ""}\n        ${stat(st.open, "Open positions")}');
            fs.writeFileSync(uiPath, ui);
          }
        }

        export function initialisePaperAccount(root, startingBalance = 15) {
          const dir = path.join(root, 'data/strategy');
          fs.mkdirSync(dir, { recursive: true });
          const marker = path.join(dir, 'paper-bankroll.json');
          if (fs.existsSync(marker)) {
            const existing = JSON.parse(fs.readFileSync(marker, 'utf8'));
            if (existing.startingBalance !== startingBalance) throw new Error('A different paper starting balance already exists');
            return;
          }
          const archive = path.join(dir, 'history', `before-paper-account-${Date.now()}`);
          fs.mkdirSync(archive, { recursive: true });
          for (const name of ['book.json', 'config.json', 'journal.jsonl']) {
            const file = path.join(dir, name);
            if (fs.existsSync(file)) fs.copyFileSync(file, path.join(archive, name));
          }
          // Record before replacing files. Repeated session starts never refill the account.
          fs.writeFileSync(path.join(dir, 'book.json'), JSON.stringify({ open: [], closed: [] }));
          fs.writeFileSync(path.join(dir, 'journal.jsonl'), '');
          let config = {};
          try { config = JSON.parse(fs.readFileSync(path.join(dir, 'config.json'), 'utf8')); } catch {}
          Object.assign(config, { stake: 1, maxOpen: startingBalance, maxPerClose: startingBalance, dailyLossStop: startingBalance });
          fs.writeFileSync(path.join(dir, 'config.json'), JSON.stringify(config, null, 2));
          fs.writeFileSync(marker, JSON.stringify({ startingBalance, createdAt: new Date().toISOString(), archivedRecords: path.relative(dir, archive) }, null, 2));
        }

        if (process.argv[1] && import.meta.url === pathToFileURL(process.argv[1]).href) {
          const [action, root] = process.argv.slice(2);
          if (action === 'patch') patchApp(root);
          else if (action === 'init') initialisePaperAccount(root);
          else throw new Error('Use patch or init followed by the app folder');
        }

        for attempt in $(seq 1 180); do
          if [ -f session-results/session.json ]; then
            node --input-type=module -e 'import fs from "node:fs"; const s=JSON.parse(fs.readFileSync("session-results/session.json")); console.log("Open Bot X-Ray: " + s.url); console.log("Session ends: " + s.end); console.log("Starting paper balance: $" + s.paperStartingBalance + "; simulated trade size: $" + s.paperTradeSize + ". Real orders disabled.");'
            exit 0
          fi
          if [ -f session-results/session.exit ]; then
            cat session-results/session.log
            exit 1
          fi
          sleep 1
        done
        cat session-results/session.log
        exit 1
    - name: Keep the app open until the session ends
      shell: bash
      run: |
        set -euo pipefail
        while [ ! -f session-results/session.exit ]; do
          sleep 10
        done
        cat session-results/session.log
        exit "$(cat session-results/session.exit)"
    - name: Encrypt and save settings, paper trades, and session logs
      if: always()
      env:
        SESSION_PASSWORD: ${{ secrets.BOTXRAY_SESSION_PASSWORD }}
      shell: bash
      run: |-
        set -euo pipefail
        if [ -d bot-x-ray/data/strategy ] && [ -n "$SESSION_PASSWORD" ]; then
          mkdir -p session-results session-backup
          (cd bot-x-ray && node scripts/stop.js)
          tar -czf state.tar.gz -C "$GITHUB_WORKSPACE/bot-x-ray" data -C "$GITHUB_WORKSPACE" session-results
          node bot-x-ray-actions/state.mjs save state.tar.gz session-backup/state.enc
          echo 'Encrypted settings and paper records saved. The next session restores this backup.' >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Upload encrypted session backup
      if: always() && hashFiles('session-backup/state.enc') != ''
      uses: actions/upload-artifact@v5
      with:
        name: bot-x-ray-state
        path: session-backup/state.enc
        retention-days: 90
        if-no-files-found: error
    concurrency:
      group: bot-x-ray-paper
      cancel-in-progress: false
    needs: checks
    if: github.event_name == 'workflow_dispatch'

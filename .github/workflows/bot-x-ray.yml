          const makeLedger = () => createTrialLedger({ token: 'test-token', password: 'test password of more than 24 characters', fetchImpl });
          const orderClient = { preview: async () => { events.push('preview'); }, submit: async () => { events.push('submit'); throw new Error('unknown'); } };

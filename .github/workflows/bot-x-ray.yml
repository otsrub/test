        // Public Polymarket US data only. Uses the app's existing coinman2 pricing engine.
        const API = 'https://gateway.polymarket.us';
        const INDEX = { btc: 'BRTI', eth: 'ETHUSD_RTI' };
        const price = value => value?.currency === 'USD' && value.value !== null && value.value !== '' && Number.isFinite(Number(value.value)) ? Number(value.value) : null;

        export function contract(m, now = Date.now() / 1000, { minMinutes = 30, maxHours = 30 } = {}) {
          const t = m.assetPriceTerms;
          if (!t || t.marketType !== 'ASSET_PRICE_MARKET_TYPE_ABOVE_BELOW' || t.asset?.assetClass !== 'ASSET_CLASS_CRYPTO') return null;
          const coin = t.asset.symbol;
          if (!INDEX[coin] || t.indexSymbol !== INDEX[coin] || m.category !== 'crypto' || m.active !== true || m.closed !== false || m.status !== 'MARKET_STATUS_OPEN' || m.ep3Status !== 'OPEN') return null;
          if (!/^[a-z0-9-]+$/.test(m.slug || '')) return null;
          const K = price(t.strike), closes = Date.parse(t.windowEnd) / 1000;
          // Above/below metadata alone doesn't specify which side pays. Confirm the published rule.
          const rule = m.description?.match(/^This market will settle to Yes if the price of (Bitcoin|Ethereum) is at or above \$([\d,]+(?:\.\d+)?) at /);
          if (!rule || rule[1] !== ({ btc: 'Bitcoin', eth: 'Ethereum' })[coin] || Number(rule[2].replaceAll(',', '')) !== K || !Number.isFinite(K) || K <= 0 || !Number.isFinite(closes) || closes < now + minMinutes * 60 || closes > now + maxHours * 3600) return null;
          if (!Number.isFinite(m.feeCoefficient) || !(m.feeCoefficient >= 0 && m.feeCoefficient <= 0.2) || !Number.isFinite(m.minimumTradeQty) || m.minimumTradeQty <= 0 || !Number.isFinite(m.orderPriceMinTickSize) || m.orderPriceMinTickSize <= 0 || m.orderPriceMinTickSize >= 1) return null;
          if (![true, false].every(long => m.marketSides?.some(s => s.long === long && s.tradable === true))) return null;
          return { venue: 'polymarket-us', coin, ticker: m.slug, K, closes, feeCoefficient: m.feeCoefficient, minimumTradeQty: m.minimumTradeQty, priceTick: m.orderPriceMinTickSize, label: `${coin.toUpperCase()} at or above $${K.toLocaleString('en-US')}`, yesAsk: null, yesBid: null, noAsk: null, noBid: null };
        }

        export function withQuote(c, data) {
          const q = data.marketData;
          if (!q || q.marketSlug !== c.ticker || q.state !== 'MARKET_STATE_OPEN') return null;
          const ask = price(q.bestAsk), bid = price(q.bestBid);
          // Never substitute last-trade prices or a missing quote with zero.
          const valid = n => n !== null && n > 0 && n < 1;
          if (valid(ask) && valid(bid) && bid > ask) return null;
          return { ...c, yesAsk: valid(ask) ? ask : null, yesBid: valid(bid) ? bid : null, noAsk: valid(bid) ? 1 - bid : null, noBid: valid(ask) ? 1 - ask : null };
        }

        export function createMarketClient({ fetchImpl = globalThis.fetch, now = Date.now } = {}) {
          let cache = null, cachedAt = 0, pending = null;
          async function read(path) {
            const r = await fetchImpl(API + path, { method: 'GET', redirect: 'error', signal: AbortSignal.timeout(20000) });
            if (!r.ok) throw new Error(`Polymarket US public data unavailable (HTTP ${r.status})`);
            return r.json();
          }
          async function markets() {
            if (cache && now() - cachedAt < 30000) return cache;
            if (pending) return pending;
            pending = (async () => {
              const rows = [], pageSize = 500;
              const from = new Date(now()).toISOString(), to = new Date(now() + 31 * 3600e3).toISOString();
              for (let page = 0; page < 10; page++) {
                const qs = new URLSearchParams({ categories: 'crypto', active: 'true', closed: 'false', limit: String(pageSize), offset: String(page * pageSize), endDateMin: from, endDateMax: to });
                const j = await read('/v1/markets?' + qs);
                if (!Array.isArray(j.markets)) throw new Error('Unexpected Polymarket US market list');
                rows.push(...j.markets);
                if (j.markets.length < pageSize) {
                  cache = rows; cachedAt = now(); return rows;
                }
              }
              throw new Error('Polymarket US market list is incomplete; scan skipped');
            })();
            try { return await pending; } finally { pending = null; }
          }
          return {
            markets,
            async quote(c) {
              if (!/^[a-z0-9-]+$/.test(c.ticker || '')) throw new Error('Invalid market slug');
              return withQuote(c, await read(`/v1/markets/${c.ticker}/bbo`));
            },
            async ladders(coin, options = {}) {
              const eligible = (await markets()).map(m => contract(m, now() / 1000, options)).filter(c => c?.coin === coin);
              const quoted = [];
              for (let i = 0; i < eligible.length; i += 4) {
                const batch = await Promise.all(eligible.slice(i, i + 4).map(async c => withQuote(c, await read(`/v1/markets/${c.ticker}/bbo`))));
                quoted.push(...batch.filter(Boolean));
                if (i + 4 < eligible.length) await new Promise(resolve => setTimeout(resolve, 250));
              }
              const groups = new Map();
              for (const c of quoted) {
                const key = `${c.closes}:${c.feeCoefficient}`;
                const g = groups.get(key) || { venue: 'polymarket-us', coin, closes: c.closes, feeCoefficient: c.feeCoefficient, contracts: [] };
                g.contracts.push(c); groups.set(key, g);
              }
              return [...groups.values()].map(g => ({ ...g, contracts: g.contracts.sort((a, b) => a.K - b.K) })).sort((a, b) => a.closes - b.closes);
            },
            async result(slug) {
              if (!/^[a-z0-9-]+$/.test(slug)) throw new Error('Invalid market slug');
              const j = await read(`/v1/markets/${slug}/settlement`);
              if (j.slug !== slug) return null;
              return j.settlement === 1 ? 'yes' : j.settlement === 0 ? 'no' : null;
            },
          };
        }

        const client = createMarketClient();
        export const ladders = (...args) => client.ladders(...args);
        export const result = (...args) => client.result(...args);

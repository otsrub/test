        import { encryptState, decryptState } from './state.mjs';
        import { hashRequest } from './polymarket-us-orders.mjs';

        // Reserve the entire authorized dollar durably BEFORE the exchange sees an order.
        // Presence of a record blocks every later run, including after a crash or lost response.
        export function createTrialLedger({ token, password, repository = 'otsrub/test', fetchImpl = globalThis.fetch } = {}) {
          if (repository !== 'otsrub/test' || !token || !password || password.length < 24) throw new Error('Durable trial storage is not configured');
          const api = `https://api.github.com/repos/${repository}/contents/.bot-x-ray/us-one-dollar-trial.enc`;
          const headers = { authorization: `Bearer ${token}`, accept: 'application/vnd.github+json', 'content-type': 'application/json' };
          async function read() {
            const r = await fetchImpl(api + '?ref=main', { headers, redirect: 'error', signal: AbortSignal.timeout(20000) });
            if (r.status === 404) return null;
            if (!r.ok) throw new Error('Cannot verify the one-dollar trial record');
            const j = await r.json();
            const value = JSON.parse(decryptState(Buffer.from(j.content, 'base64'), password));
            if (value.version !== 1 || value.reservedCents !== 100) throw new Error('Unknown trial record; no further orders are allowed');
            return { ...value, sha: j.sha };
          }
          return {
            read,
            async reserve(plan) {
              if (await read()) throw new Error('The one-dollar trial has already been reserved or used. No further orders.');
              const record = { version: 1, reservedCents: 100, requestHash: hashRequest(plan.request), createdAt: new Date().toISOString() };
              const content = encryptState(Buffer.from(JSON.stringify(record)), password).toString('base64');
              // No SHA is provided: an existing file causes GitHub to refuse the write.
              const r = await fetchImpl(api, { method: 'PUT', headers, redirect: 'error', signal: AbortSignal.timeout(20000), body: JSON.stringify({ message: 'Reserve the authorized one-dollar Bot X-Ray trial', content, branch: 'main' }) });
              if (r.status !== 201) throw new Error('Trial reservation did not commit; no order may be sent');
              const saved = await read();
              if (!saved || saved.requestHash !== record.requestHash) throw new Error('Trial reservation could not be verified; no order may be sent');
              return { ...record, committed: true };
            },
          };
        }
        BOTXRAY_SOURCE
        cat > bot-x-ray-actions/coinman2-us-worker.mjs <<'BOTXRAY_SOURCE'
        import fs from 'node:fs';
        import { pathToFileURL } from 'node:url';
        import { priceLadder, DEFAULTS } from '../bot-x-ray/lib/strategy/engine.js';
        import { spot } from '../bot-x-ray/lib/prices.js';
        import { realisedVol } from '../bot-x-ray/lib/strategy/model.js';
        import { createMarketClient } from './polymarket-us-markets.mjs';
        import { createClient } from './polymarket-us.mjs';
        import { createOrderClient, planOneDollarOrder, CONFIRMATION } from './polymarket-us-orders.mjs';
        import { createTrialLedger } from './us-trial-ledger.mjs';

        function report(note) {
          console.log(note);
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, note + '\n\n');
        }

        export async function executeTrial({ candidate, orderClient, ledger, shouldStop = () => false }) {
          // All network/state dependencies are injected so the complete order path is tested offline.
          if (shouldStop()) return { status: 'stopped' };
          await orderClient.preview(candidate);
          if (shouldStop()) return { status: 'stopped' };
          const reservation = await ledger.reserve(candidate);
          if (shouldStop()) return { status: 'reserved-without-order' };
          await orderClient.submit(candidate, reservation);
          return { status: 'acknowledged' }; // Never infer a fill from acknowledgement.
        }

        async function main() {
          const mode = process.env.US_TRIAL_MODE || 'check';
          if (!['check', 'live'].includes(mode)) throw new Error('Invalid trial mode');
          const live = mode === 'live';
          if (live && process.env.US_TRIAL_CONFIRMATION !== CONFIRMATION) throw new Error('Live trial requires the exact manual confirmation');
          if (live && process.env.GITHUB_ACTOR === 'github-actions[bot]') throw new Error('The live trial must be launched manually by the account owner');
          let stopped = false;
          process.once('SIGTERM', () => { stopped = true; });
          process.once('SIGINT', () => { stopped = true; });
          const marketClient = createMarketClient();
          const keys = { keyId: process.env.POLYMARKET_US_KEY_ID, secretKey: process.env.POLYMARKET_US_SECRET_KEY };
          const orderClient = live ? createOrderClient({ ...keys, confirmation: process.env.US_TRIAL_CONFIRMATION }) : null;
          const ledger = live ? createTrialLedger({ token: process.env.GH_TOKEN, password: process.env.SESSION_PASSWORD }) : null;
          if (live && await ledger.read()) {
            report('The authorized one-dollar trial is already reserved or used. No further orders were sent.');
            return;
          }
          const accountClient = live ? createClient(keys) : null;
          const end = Date.now() + 330 * 60000;
          report(live ? 'Manual live trial: maximum cumulative new debit $1 including fees. One order attempt only; never recycle the dollar. Limit buys only; hold filled contracts to settlement.' : 'Read-only strategy check. Real orders are disabled; no account keys are used.');
          do {
            let supported = 0, signals = 0;
            for (const coin of ['btc', 'eth']) {
              if (stopped || Date.now() >= end) return;
              let ladders, volatility;
              try {
                volatility = await realisedVol(coin);
                ladders = await marketClient.ladders(coin);
              } catch {
                report(coin.toUpperCase() + ': price or market data unavailable; no orders for this scan.');
                continue;
              }
              const s = (await spot(coin)).price;
              for (const ladder of ladders) {
                supported += ladder.contracts.length;
                const priced = priceLadder(ladder, { S: s, sigma: volatility.sigma, cfg: DEFAULTS });
                const candidates = priced.contracts.filter(c => c.signal).sort((a, b) => b.best.edge - a.best.edge);
                signals += candidates.length;
                if (!live || !candidates.length) continue;
                // Refresh this entire volatility ladder, then the selected quote and model inputs.
                const fresh = [];
                for (let i = 0; i < ladder.contracts.length; i += 4) {
                  fresh.push(...(await Promise.all(ladder.contracts.slice(i, i + 4).map(c => marketClient.quote(c)))).filter(Boolean));
                  await new Promise(resolve => setTimeout(resolve, 250));
                }
                const updatedSpot = (await spot(coin)).price;
                const current = priceLadder({ ...ladder, contracts: fresh }, { S: updatedSpot, sigma: volatility.sigma, cfg: DEFAULTS });
                for (const c of current.contracts.filter(c => c.signal).sort((a, b) => b.best.edge - a.best.edge)) {
                  if (stopped || Date.now() >= end) return;
                  const account = await accountClient.account();
                  const usd = account.balances?.find(b => b.currency === 'USD');
                  if (!account.ok || typeof usd?.buyingPower !== 'number' || !Number.isFinite(usd.buyingPower)) throw new Error('Cannot verify USD buying power; no order sent');
                  if ((await orderClient.openOrders()).length) throw new Error('Existing open orders need review before this trial; no order sent');
                  let plan;
                  try { plan = planOneDollarOrder({ ...c, side: c.best.side, limit: c.best.ask, fair: c.best.fair }, Math.floor(usd.buyingPower * 100 + 1e-9)); }
                  catch { continue; }
                  const outcome = await executeTrial({ candidate: plan, orderClient, ledger, shouldStop: () => stopped || Date.now() >= end });
                  report(outcome.status === 'acknowledged' ? 'One limit order was acknowledged. This is not fill confirmation. The dollar will not be reused. Check Polymarket US for fills; filled contracts remain held to settlement.' : 'Stopped. The dollar may remain reserved; no replacement order will be sent automatically.');
                  return;
                }
              }
            }
            report(`Strategy scan complete: ${supported} supported contracts; ${signals} model signals before size and rounded-fee checks.`);
            if (!live) return;
            const next = Date.now() + 5 * 60000;
            while (!stopped && Date.now() < next && Date.now() < end) await new Promise(resolve => setTimeout(resolve, 1000));
          } while (!stopped && Date.now() < end);
          report('Trial session ended without submitting an order.');
        }

        if (process.argv[1] && import.meta.url === pathToFileURL(process.argv[1]).href) {
          main().catch(error => { report(error.message); process.exitCode = 1; });
        }
        BOTXRAY_SOURCE

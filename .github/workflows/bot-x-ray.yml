          const key = createPrivateKey({ key: Buffer.concat([KEY_PREFIX, bytes.subarray(0, 32)]), format: 'der', type: 'pkcs8' });
          return { 'X-PM-Access-Key': keyId, 'X-PM-Timestamp': String(timestamp), 'X-PM-Signature': sign(null, Buffer.from(String(timestamp) + method + path), key).toString('base64'), 'Content-Type': 'application/json', Accept: 'application/json' };
        }

        // A single buy-and-hold trial. Never recycle its dollar, short, sell, or use market orders.
        export function planOneDollarOrder(c, availableCents = 100, now = Date.now() / 1000) {
          if (c.venue !== 'polymarket-us' || !/^[a-z0-9-]+$/.test(c.ticker || '') || !['yes', 'no'].includes(c.side)) throw new Error('Unsupported market or side');
          const p = c.limit, step = c.minimumTradeQty, tick = c.priceTick, theta = c.feeCoefficient;
          if (![p, step, tick, theta, c.fair, c.closes].every(Number.isFinite) || p < 0.2 || p > 0.95 || step <= 0 || tick <= 0 || theta < 0 || theta > 0.2 || c.closes < now + 1800) throw new Error('Invalid price, precision, fees, or expiry');
          if (Math.abs(step * 1e6 - Math.round(step * 1e6)) > 1e-6) throw new Error('Unsupported quantity precision');
          const yesPrice = Number((c.side === 'yes' ? p : 1 - p).toFixed(6));
          if (Math.abs(yesPrice / tick - Math.round(yesPrice / tick)) > 1e-7) throw new Error('Limit price is not aligned to this market tick');
          const budget = Math.min(100, Math.floor(availableCents));
          if (!Number.isFinite(budget) || budget <= 1) throw new Error('Not enough buying power');
          const quantity = Number((Math.floor(((budget - 1) / 100) / (p + theta * p * (1 - p)) / step) * step).toFixed(6));
          if (quantity < step || quantity <= 0) throw new Error('Minimum order does not fit the one-dollar limit');
          // The published cumulative fee is rounded to cents. An extra cent covers that rounding.
          const maximumDebitCents = Math.ceil(quantity * (p + theta * p * (1 - p)) * 100 - 1e-9) + 1;
          if (maximumDebitCents > budget) throw new Error('Order would exceed the one-dollar limit including fees');
          if (c.fair - maximumDebitCents / 100 / quantity < 0.03) throw new Error('Not enough edge after size and rounded fee allowance');
          const request = Object.freeze({ marketSlug: c.ticker, intent: c.side === 'yes' ? 'ORDER_INTENT_BUY_LONG' : 'ORDER_INTENT_BUY_SHORT', type: 'ORDER_TYPE_LIMIT', price: Object.freeze({ value: String(yesPrice), currency: 'USD' }), quantity, tif: 'TIME_IN_FORCE_IMMEDIATE_OR_CANCEL', manualOrderIndicator: 'MANUAL_ORDER_INDICATOR_AUTOMATIC', synchronousExecution: true, maxBlockTime: '10s' });
          return Object.freeze({ request, maximumDebitCents, limit: p, side: c.side });
        }

        export function createOrderClient({ keyId, secretKey, confirmation = '', fetchImpl = globalThis.fetch, now = Date.now } = {}) {
          const enabled = confirmation === CONFIRMATION;
          async function request(method, path, body) {
            const headers = tradingHeaders({ keyId, secretKey }, method, path, now());
            let r;
            try { r = await fetchImpl(API + path, { method, headers, ...(body ? { body: JSON.stringify(body) } : {}), redirect: 'error', signal: AbortSignal.timeout(30000) }); }
            catch { throw new Error('Trading request outcome is unknown; do not resubmit. Check Polymarket US.'); }
            if (!r.ok) throw new Error(`Polymarket US trading request refused (HTTP ${r.status}). No automatic retry.`);
            if (r.status === 204) return {};
            try { return await r.json(); }
            catch { throw new Error('Trading response is unreadable; do not resubmit. Check Polymarket US.'); }
          }
          return {
            async openOrders() {
              const j = await request('GET', '/v1/orders/open');
              if (!Array.isArray(j.orders)) throw new Error('Unknown open-order format');
              return j.orders;
            },
            async preview(plan) {
              const j = await request('POST', '/v1/order/preview', { request: plan.request });
              const o = j.order, p = plan.request;
              if (!o || o.marketSlug !== p.marketSlug || o.type !== p.type || o.intent !== p.intent || o.tif !== p.tif || o.price?.currency !== 'USD' || Number(o.price.value) !== Number(p.price.value) || Math.abs(Number(o.quantity) - p.quantity) > 1e-9) throw new Error('Order preview changed the request; nothing will be sent');
              return true;
            },
            async submit(plan, durableReservation) {
              if (!enabled) throw new Error('Real orders are disabled');
              if (durableReservation?.reservedCents !== 100 || durableReservation?.requestHash !== hashRequest(plan.request) || durableReservation?.committed !== true) throw new Error('Durable one-dollar reservation is required');
              const j = await request('POST', '/v1/orders', plan.request);
              if (typeof j.id !== 'string' || !/^[a-zA-Z0-9-]+$/.test(j.id)) throw new Error('Order acknowledgement is unknown; do not resubmit');
              return { id: j.id }; // An ID confirms acknowledgement, never a fill.
            },
            async cancelOwnOrder(id, slug) {
              if (!enabled || !/^[a-zA-Z0-9-]+$/.test(id) || !/^[a-z0-9-]+$/.test(slug)) throw new Error('Invalid cancellation');
              return request('POST', `/v1/order/${id}/cancel`, { marketSlug: slug });
            },
          };
        }

        import { createHash } from 'node:crypto';
        export const hashRequest = request => createHash('sha256').update(JSON.stringify(request)).digest('hex');

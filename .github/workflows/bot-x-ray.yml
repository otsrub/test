          const p = plan('yes'), calls = [];
          const fetchImpl = async (url, options) => { calls.push({ url, options }); throw new Error('secret response must not be printed'); };
          const disabled = createOrderClient({ keyId: 'id', secretKey, fetchImpl });
          await assert.rejects(disabled.submit(p, reservation(p)), /disabled/);
          const live = createOrderClient({ keyId: 'id', secretKey, confirmation: CONFIRMATION, fetchImpl });

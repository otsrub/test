        // Official Polymarket US account API. Account viewing only; no order endpoint exists here.
        import { createPrivateKey, sign } from 'node:crypto';

        const ORIGIN = 'https://api.polymarket.us';
        const PKCS8_PREFIX = Buffer.from('302e020100300506032b657004220420', 'hex');

        export function signingHeaders({ keyId, secretKey }, path, timestamp = Date.now()) {
          if (!keyId || !secretKey) throw new Error('Polymarket US credentials are missing');
          if (!['/v1/account/balances', '/v1/portfolio/positions'].includes(path)) throw new Error('Only account-viewing requests are supported');
          const text = secretKey.trim();
          if (!/^[A-Za-z0-9+/]+={0,2}$/.test(text)) throw new Error('The Polymarket US Secret Key must be base64');
          const bytes = Buffer.from(text, 'base64');
          if (![32, 64].includes(bytes.length)) throw new Error('The Polymarket US Secret Key must contain a 32-byte seed or 64-byte key');
          const key = createPrivateKey({ key: Buffer.concat([PKCS8_PREFIX, bytes.subarray(0, 32)]), format: 'der', type: 'pkcs8' });
          const time = String(timestamp);
          return {
            'X-PM-Access-Key': keyId,
            'X-PM-Timestamp': time,
            'X-PM-Signature': sign(null, Buffer.from(time + 'GET' + path), key).toString('base64'),
            Accept: 'application/json',
          };
        }

        export function createClient({ keyId, secretKey, fetchImpl = globalThis.fetch, now = Date.now } = {}) {
          const configured = Boolean(keyId && secretKey);
          async function read(path) {
            const headers = signingHeaders({ keyId, secretKey }, path, now());
            let response;
            try {
              response = await fetchImpl(ORIGIN + path, { method: 'GET', headers, redirect: 'error', signal: AbortSignal.timeout(10000) });
            } catch {
              throw new Error('Polymarket US did not answer. Try the account check again.');
            }
            if (!response.ok) {
              const status = response.status;
              const message = status === 401 || status === 403
                ? 'Polymarket US did not accept these credentials. Check the Key ID, Secret Key, and API access in its developer portal.'
                : status === 429 ? 'Polymarket US is limiting requests. Try again in a moment.'
                : `Polymarket US account request failed (HTTP ${status}).`;
              throw new Error(message);
            }
            try { return await response.json(); }
            catch { throw new Error('Polymarket US returned an unreadable account response.'); }
          }
          return {
            configured,
            async account() {
              if (!configured) return { ok: false, configured: false, mode: null, liveTrading: false, note: 'Add POLYMARKET_US_KEY_ID and POLYMARKET_US_SECRET_KEY to the repository secrets, then start a new session.' };
              const data = await read('/v1/account/balances');
              if (!Array.isArray(data.balances)) throw new Error('Polymarket US returned an unexpected balance format.');
              return {
                ok: true, configured: true, mode: 'live', liveTrading: false,
                note: 'Real Polymarket US account verified. Account viewing is connected; automated orders are disabled.',
                balances: data.balances.map(b => ({ currency: b.currency, currentBalance: b.currentBalance, buyingPower: b.buyingPower, lastUpdated: b.lastUpdated })),
              };
            },
            async positions() {
              if (!configured) throw new Error('Polymarket US credentials are missing');
              const data = await read('/v1/portfolio/positions');
              if (!data.positions || typeof data.positions !== 'object') throw new Error('Polymarket US returned an unexpected positions format.');
              return { positions: data.positions, eof: data.eof === true, moreAvailable: data.eof !== true && Boolean(data.nextCursor) };
            },
          };
        }

        export default {
          name: 'polymarket-us', title: 'Polymarket US', live: false, venues: ['polymarket-us'],
          note: 'Polymarket US account viewing is prepared. Open the Polymarket US account link to verify credentials and view balances and positions. Automated orders are disabled. The strategy currently runs on paper on Kalshi and ETF options.',
          account: keys => createClient({ keyId: keys.keyId, secretKey: keys.secret }).account(),
          positions: keys => createClient({ keyId: keys.keyId, secretKey: keys.secret }).positions(),
          async submit() { throw new Error('Polymarket US automated orders are disabled. No order was sent.'); },
        };
        BOTXRAY_SOURCE
        cat > bot-x-ray-actions/polymarket-us.test.mjs <<'BOTXRAY_SOURCE'
        import test from 'node:test';
        import assert from 'node:assert/strict';
        import { createPublicKey, createPrivateKey, verify } from 'node:crypto';
        import adapter, { createClient, signingHeaders } from './polymarket-us.mjs';

        // RFC 8032 Ed25519 test seed and public key, independent of the account credentials.
        const seed = Buffer.from('9d61b19deffd5a60ba844af492ec2cc44449c5697b326919703bac031cae7f60', 'hex');
        const secretKey = seed.toString('base64');
        const publicKey = createPublicKey({ key: Buffer.from('302a300506032b6570032100d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a', 'hex'), format: 'der', type: 'spki' });

        test('official signature format uses timestamp + GET + fixed path', () => {
          const path = '/v1/account/balances', timestamp = 1792600000123;
          const headers = signingHeaders({ keyId: 'test-key-id', secretKey }, path, timestamp);
          assert.equal(headers['X-PM-Timestamp'], String(timestamp));
          assert.equal(verify(null, Buffer.from(String(timestamp) + 'GET' + path), publicKey, Buffer.from(headers['X-PM-Signature'], 'base64')), true);
          assert.throws(() => signingHeaders({ keyId: 'id', secretKey }, '/v1/orders'), /Only account-viewing/);
          assert.throws(() => signingHeaders({ keyId: 'id', secretKey: 'not-a-key' }, path), /base64/);
        });
        test('missing credentials never make a request; connected status never returns keys', async () => {
          const calls = [];
          const fetchImpl = async (url, options) => {
            calls.push({ url, options });
            return { ok: true, json: async () => ({ balances: [{ currency: 'USD', currentBalance: 20, buyingPower: 10 }] }) };
          };
          assert.equal((await createClient({ fetchImpl }).account()).configured, false);
          assert.equal(calls.length, 0);
          const status = await createClient({ keyId: 'test-key-id', secretKey, fetchImpl }).account();
          assert.equal(status.ok, true);
          assert.equal(status.liveTrading, false);
          assert.ok(!JSON.stringify(status).includes(secretKey));
          assert.ok(!JSON.stringify(status).includes('test-key-id'));
          assert.equal(calls[0].url, 'https://api.polymarket.us/v1/account/balances');
          assert.equal(calls[0].options.redirect, 'error');
        });
        test('account failures are sanitized and the adapter cannot submit orders', async () => {
          const fetchImpl = async () => ({ ok: false, status: 401, text: async () => secretKey });
          await assert.rejects(createClient({ keyId: 'id', secretKey, fetchImpl }).account(), error => !error.message.includes(secretKey) && /did not accept/.test(error.message));
          assert.equal(adapter.live, false);
          await assert.rejects(adapter.submit({}, {}), /No order was sent/);
        });
        BOTXRAY_SOURCE
    - name: Download the verified Bot X-Ray release
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p results
        curl --fail --location --retry 2 --connect-timeout 20 --max-time 120 \
          https://part-timequant.com/kit/bot-x-ray.tar.gz -o bot-x-ray.tar.gz
        echo '3073d5071c70b868c62e327a717917b6b40d5ee238803a4a161f5a132ae20910  bot-x-ray.tar.gz' | sha256sum --check
        python3 - <<'PY'
        import tarfile
        from pathlib import PurePosixPath
        with tarfile.open('bot-x-ray.tar.gz') as archive:
            for member in archive.getmembers():
                p = PurePosixPath(member.name)
                if p.is_absolute() or '..' in p.parts or not p.parts or p.parts[0] != 'bot-x-ray' or not (member.isfile() or member.isdir()):
                    raise SystemExit('Unexpected archive entry: ' + member.name)
            archive.extractall('.', filter='data')
        PY

        cp bot-x-ray-actions/polymarket-us.mjs bot-x-ray/lib/brokers/polymarket-us.js
    - name: Restore the latest saved paper records
      env:
        GH_TOKEN: ${{ github.token }}
        SESSION_PASSWORD: ${{ secrets.BOTXRAY_SESSION_PASSWORD }}
      shell: bash
      run: |-
        set -euo pipefail
        mkdir -p previous-state
        saved_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=bot-x-ray-state&per_page=100" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")][0].workflow_run.id // empty')
        if [ -n "$saved_run" ]; then
          gh run download "$saved_run" --repo "$GITHUB_REPOSITORY" --name bot-x-ray-state --dir previous-state
          node bot-x-ray-actions/state.mjs restore previous-state/state.enc previous-state/state.tar.gz
          python3 - <<'RESTORE'
        import tarfile
        from pathlib import PurePosixPath
        with tarfile.open('previous-state/state.tar.gz') as archive:
            for member in archive.getmembers():
                p = PurePosixPath(member.name)
                if p.is_absolute() or '..' in p.parts or not p.parts or p.parts[0] not in ('data', 'session-results') or not (member.isfile() or member.isdir()):
                    raise SystemExit('Unexpected state archive entry: ' + member.name)
            archive.extractall('bot-x-ray', members=[m for m in archive.getmembers() if PurePosixPath(m.name).parts[0] == 'data'], filter='data')
        RESTORE
          echo "Restored encrypted state from run $saved_run"
        else
          legacy_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=bot-x-ray-results&per_page=100" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")][0].workflow_run.id // empty')
          if [ -n "$legacy_run" ]; then
            gh run download "$legacy_run" --repo "$GITHUB_REPOSITORY" --name bot-x-ray-results --dir previous-state
            if [ -d previous-state/paper-records ]; then
              mkdir -p bot-x-ray/data/strategy
              cp -r previous-state/paper-records/. bot-x-ray/data/strategy/
              echo "Imported paper records from the original test run $legacy_run"
            fi
          fi
        fi
        rm -f bot-x-ray/data/strategy/armed.json
        if [ ! -f bot-x-ray/data/strategy/config.json ]; then
          (cd bot-x-ray && node scripts/setup.js --country US)
        fi
    - name: Check public data connections
      working-directory: bot-x-ray
      shell: bash
      run: |-
        set -euo pipefail
        mkdir -p ../session-results
        node scripts/doctor.js 2>&1 | tee ../session-results/data-sources.txt
    - name: Download Cloudflare tunnel client
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |-
        set -euo pipefail
        curl --fail --location --retry 2 --max-time 120 https://github.com/cloudflare/cloudflared/releases/download/2026.10.3/cloudflared-linux-amd64 -o cloudflared
        expected=$(gh api repos/cloudflare/cloudflared/releases/tags/2026.10.3 --jq '.assets[] | select(.name == "cloudflared-linux-amd64") | .digest')
        case "$expected" in sha256:*) ;; *) echo 'Release digest is missing'; exit 1 ;; esac
        printf '%s  cloudflared\n' "${expected#sha256:}" | sha256sum --check
        chmod +x cloudflared
    - name: Open the protected app (expand this step for the link)
      env:
        SESSION_PASSWORD: ${{ secrets.BOTXRAY_SESSION_PASSWORD }}
        POLYMARKET_US_KEY_ID: ${{ secrets.POLYMARKET_US_KEY_ID }}
        POLYMARKET_US_SECRET_KEY: ${{ secrets.POLYMARKET_US_SECRET_KEY }}
      run: |-
        set -euo pipefail
        mkdir -p session-results
        (
          set +e
          node bot-x-ray-actions/session.mjs > session-results/session.log 2>&1
          echo $? > session-results/session.exit
        ) &
        for attempt in $(seq 1 180); do
          if [ -f session-results/session.json ]; then
            node --input-type=module -e 'import fs from "node:fs"; const s=JSON.parse(fs.readFileSync("session-results/session.json")); console.log("Open Bot X-Ray: " + s.url); console.log("Session ends: " + s.end);'
            exit 0
          fi
          if [ -f session-results/session.exit ]; then
            cat session-results/session.log
            exit 1
          fi
          sleep 1
        done
        cat session-results/session.log
        exit 1
    - name: Keep the app open until the session ends
      shell: bash
      run: |
        set -euo pipefail
        while [ ! -f session-results/session.exit ]; do
          sleep 10
        done
        cat session-results/session.log
        exit "$(cat session-results/session.exit)"
    - name: Encrypt and save settings, paper trades, and session logs
      if: always()
      env:
        SESSION_PASSWORD: ${{ secrets.BOTXRAY_SESSION_PASSWORD }}
      shell: bash
      run: |-
        set -euo pipefail
        if [ -d bot-x-ray/data/strategy ] && [ -n "$SESSION_PASSWORD" ]; then
          mkdir -p session-results session-backup
          (cd bot-x-ray && node scripts/stop.js)
          tar -czf state.tar.gz -C "$GITHUB_WORKSPACE/bot-x-ray" data -C "$GITHUB_WORKSPACE" session-results
          node bot-x-ray-actions/state.mjs save state.tar.gz session-backup/state.enc
          echo 'Encrypted settings and paper records saved. The next session restores this backup.' >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Upload encrypted session backup
      if: always() && hashFiles('session-backup/state.enc') != ''
      uses: actions/upload-artifact@v5
      with:
        name: bot-x-ray-state
        path: session-backup/state.enc
        retention-days: 90
        if-no-files-found: error
    concurrency:
      group: bot-x-ray-paper
      cancel-in-progress: false
    needs: checks
    if: github.event_name == 'workflow_dispatch'

        // Official Polymarket US account API. Account viewing only; no order endpoint exists here.
        import { createPrivateKey, sign } from 'node:crypto';

        const ORIGIN = 'https://api.polymarket.us';
        const PKCS8_PREFIX = Buffer.from('302e020100300506032b657004220420', 'hex');

        export function signingHeaders({ keyId, secretKey }, path, timestamp = Date.now()) {
          if (!keyId || !secretKey) throw new Error('Polymarket US credentials are missing');
          if (!['/v1/account/balances', '/v1/portfolio/positions'].includes(path)) throw new Error('Only account-viewing requests are supported');
          const text = secretKey.trim();
          if (!/^[A-Za-z0-9+/]+={0,2}$/.test(text)) throw new Error('The Polymarket US Secret Key must be base64');
          const bytes = Buffer.from(text, 'base64');
          if (![32, 64].includes(bytes.length)) throw new Error('The Polymarket US Secret Key must contain a 32-byte seed or 64-byte key');
          const key = createPrivateKey({ key: Buffer.concat([PKCS8_PREFIX, bytes.subarray(0, 32)]), format: 'der', type: 'pkcs8' });
          const time = String(timestamp);
          return {
            'X-PM-Access-Key': keyId,
            'X-PM-Timestamp': time,
            'X-PM-Signature': sign(null, Buffer.from(time + 'GET' + path), key).toString('base64'),
            Accept: 'application/json',
          };
        }

        export function createClient({ keyId, secretKey, fetchImpl = globalThis.fetch, now = Date.now } = {}) {
          const configured = Boolean(keyId && secretKey);
          async function read(path) {
            const headers = signingHeaders({ keyId, secretKey }, path, now());
            let response;
            try {
              response = await fetchImpl(ORIGIN + path, { method: 'GET', headers, redirect: 'error', signal: AbortSignal.timeout(10000) });
            } catch {
              throw new Error('Polymarket US did not answer. Try the account check again.');
            }
            if (!response.ok) {
              const status = response.status;
              const message = status === 401 || status === 403
                ? 'Polymarket US did not accept these credentials. Check the Key ID, Secret Key, and API access in its developer portal.'
                : status === 429 ? 'Polymarket US is limiting requests. Try again in a moment.'
                : `Polymarket US account request failed (HTTP ${status}).`;
              throw new Error(message);
            }
            try { return await response.json(); }
            catch { throw new Error('Polymarket US returned an unreadable account response.'); }
          }
          return {
            configured,
            async account() {
              if (!configured) return { ok: false, configured: false, mode: null, liveTrading: false, note: 'Add POLYMARKET_US_KEY_ID and POLYMARKET_US_SECRET_KEY to the repository secrets, then start a new session.' };
              const data = await read('/v1/account/balances');
              if (!Array.isArray(data.balances)) throw new Error('Polymarket US returned an unexpected balance format.');
              return {
                ok: true, configured: true, mode: 'live', liveTrading: false,
                note: 'Real Polymarket US account verified. Account viewing is connected; automated orders are disabled.',
                balances: data.balances.map(b => ({ currency: b.currency, currentBalance: b.currentBalance, buyingPower: b.buyingPower, lastUpdated: b.lastUpdated })),
              };
            },
            async positions() {
              if (!configured) throw new Error('Polymarket US credentials are missing');
              const data = await read('/v1/portfolio/positions');
              if (!data.positions || typeof data.positions !== 'object') throw new Error('Polymarket US returned an unexpected positions format.');
              return { positions: data.positions, eof: data.eof === true, moreAvailable: data.eof !== true && Boolean(data.nextCursor) };
            },
          };
        }

        export default {
          name: 'polymarket-us', title: 'Polymarket US', live: false, venues: ['polymarket-us'],
          note: 'Polymarket US account viewing is prepared. Open the Polymarket US account link to verify credentials and view balances and positions. Automated orders are disabled. The strategy currently runs on paper on Kalshi and ETF options.',
          account: keys => createClient({ keyId: keys.keyId, secretKey: keys.secret }).account(),
          positions: keys => createClient({ keyId: keys.keyId, secretKey: keys.secret }).positions(),
          async submit() { throw new Error('Polymarket US automated orders are disabled. No order was sent.'); },
        };

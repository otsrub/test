name: REA image - MAAnalytics
'on':
  push:
    paths:
    - .github/workflows/rea-image-maanalytics.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MAAnalytics.framework/MAAnalytics
      artifact: rea-image-maanalytics

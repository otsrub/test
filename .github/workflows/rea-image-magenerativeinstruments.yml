name: REA image - MAGenerativeInstruments
'on':
  push:
    paths:
    - .github/workflows/rea-image-magenerativeinstruments.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MAGenerativeInstruments.framework/MAGenerativeInstruments
      artifact: rea-image-magenerativeinstruments

        \ 'The account check could not finish. Try again in a moment.' })); }\n    }\n    if (req.url === '/__account') {\n      res.writeHead(200, { 'Content-Type': 'text/html; charset=utf-8' });\n      return res.end(`<!doctype html><meta name=\"viewport\" content=\"width=device-width\"><title>Polymarket US account \xB7 Bot X-Ray</title><style>body{font:18px system-ui;max-width:800px;margin:6vh auto;padding:24px;background:#f8f7f4;color:#1c2529}button{font:inherit;padding:12px;cursor:pointer}pre{font:14px ui-monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:20px}a{color:#075b73}</style><p><a href=\"/\">Back to Bot X-Ray</a></p><h1>Your Polymarket US account</h1><p>Check the connection to your real account and view its balances and positions. Automated orders are disabled. The app's strategy continues using simulated money on its existing Kalshi and ETF option markets.</p><button id=\"check\">Check account</button><p id=\"note\">Credentials are read from encrypted\
        \ GitHub secrets when a new session starts.</p><pre id=\"result\" hidden></pre><h2>Connect your account</h2><ol><li>Open <a href=\"https://polymarket.us/developer\" target=\"_blank\" rel=\"noreferrer\">Polymarket US's developer portal</a>, sign in using the same method as your app, and create an API key.</li><li>In <a href=\"https://github.com/otsrub/test/settings/secrets/actions\" target=\"_blank\" rel=\"noreferrer\">your GitHub repository's encrypted secrets</a>, add <code>POLYMARKET_US_KEY_ID</code> and <code>POLYMARKET_US_SECRET_KEY</code>. Enter each value there, never in chat or in repository files.</li><li>Start a new Bot X-Ray session, then return here and select Check account.</li></ol><p>Account values below are returned by Polymarket US's API. They are not saved in paper-trade backups. Keep your account credentials separate from the password used to open this page.</p><script>document.querySelector('#check').onclick=async()=>{const b=document.querySelector('#check'),n=document.querySelector('#note'),p=document.querySelector('#result');b.disabled=true;n.textContent='Checking\
        \ Polymarket US\u2026';p.hidden=true;try{const r=await fetch('/__account/check',{method:'POST',headers:{'x-bx':'1'}});const j=await r.json();n.textContent=j.note||'Account check complete';if(j.connected){p.textContent=JSON.stringify({balances:j.balances,positions:j.positions,morePositionsAvailable:j.morePositionsAvailable},null,2);p.hidden=false;}}catch{n.textContent='The account check did not finish. Try again.';}finally{b.disabled=false;}}</script>`);\n    }\n    if (req.url === '/__session') {\n      if (req.method === 'POST') {\n        res.end('Session ending. Your paper records are being saved to GitHub.');\n        setTimeout(onFinish, 250);\n        return;\n      }\n      res.writeHead(200, { 'Content-Type': 'text/html; charset=utf-8' });\n      return res.end(`<!doctype html><meta name=\"viewport\" content=\"width=device-width\"><title>Bot X-Ray session</title><style>body{font:18px system-ui;max-width:650px;margin:10vh auto;padding:24px}button{font:inherit;padding:12px}</style><h1>Bot\
        \ X-Ray session</h1><p>End this session to save your settings and paper trades for the next run.</p><button id=\"finish\">Finish and save</button><p><a href=\"/\">Back to Bot X-Ray</a></p><script>document.querySelector('#finish').onclick=async()=>{const r=await fetch('/__session',{method:'POST',headers:{'x-bx':'1'}});document.body.textContent=await r.text();}</script>`);\n    }\n    if (req.url.split('?')[0] === '/api/shutdown') {\n      res.writeHead(403);\n      return res.end('Use /__session to finish and save.');\n    }\n    const headers = { ...req.headers, host: `127.0.0.1:${upstreamPort}` };\n    for (const name of ['authorization', 'proxy-authorization', 'connection', 'forwarded', 'x-forwarded-host', 'x-forwarded-proto', 'cookie']) delete headers[name];\n    if (headers.origin) headers.origin = `http://127.0.0.1:${upstreamPort}`;\n    const upstream = http.request({ hostname: '127.0.0.1', port: upstreamPort, path: req.url, method: req.method, headers }, incoming => {\n  \
        \    const out = { ...incoming.headers, 'cache-control': 'no-store', 'x-frame-options': 'DENY', 'referrer-policy': 'no-referrer' };\n      delete out['www-authenticate'];\n      if (incoming.headers['content-type']?.startsWith('text/html')) {\n        delete out['content-length'];\n        let html = '';\n        incoming.setEncoding('utf8');\n        incoming.on('data', chunk => { html += chunk; });\n        incoming.on('end', () => {\n          const link = '<a href=\"/__account\" style=\"position:fixed;right:16px;bottom:16px;z-index:1000;background:#173b49;color:white;padding:12px 16px;border-radius:8px;text-decoration:none;font:15px system-ui\">Polymarket US account</a>';\n          res.writeHead(incoming.statusCode, out);\n          res.end(html.includes('</body>') ? html.replace('</body>', link + '</body>') : html + link);\n        });\n      } else {\n        res.writeHead(incoming.statusCode, out);\n        incoming.pipe(res);\n      }\n    });\n    upstream.on('error', ()\

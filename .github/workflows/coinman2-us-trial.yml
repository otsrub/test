        \nfunction report(note) {\n  console.log(note);\n  if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, note + '\\n\\n');\n}\n\nexport async function executeTrial({ candidate, orderClient, ledger, shouldStop = () => false }) {\n  // All network/state dependencies are injected so the complete order path is tested offline.\n  if (shouldStop()) return { status: 'stopped' };\n  await orderClient.preview(candidate);\n  if (shouldStop()) return { status: 'stopped' };\n  const reservation = await ledger.reserve(candidate);\n  if (shouldStop()) return { status: 'reserved-without-order' };\n  await orderClient.submit(candidate, reservation);\n  return { status: 'acknowledged' }; // Never infer a fill from acknowledgement.\n}\n\nasync function main() {\n  const mode = process.env.US_TRIAL_MODE || 'check';\n  if (!['check', 'live'].includes(mode)) throw new Error('Invalid trial mode');\n  const live = mode === 'live';\n  if (live && process.env.US_TRIAL_CONFIRMATION\
        \ !== CONFIRMATION) throw new Error('Live trial requires the exact manual confirmation');\n  if (live && process.env.GITHUB_ACTOR === 'github-actions[bot]') throw new Error('The live trial must be launched manually by the account owner');\n  let stopped = false;\n  process.once('SIGTERM', () => { stopped = true; });\n  process.once('SIGINT', () => { stopped = true; });\n  const marketClient = createMarketClient();\n  const keys = { keyId: process.env.POLYMARKET_US_KEY_ID, secretKey: process.env.POLYMARKET_US_SECRET_KEY };\n  const orderClient = live ? createOrderClient({ ...keys, confirmation: process.env.US_TRIAL_CONFIRMATION }) : null;\n  const ledger = live ? createTrialLedger({ token: process.env.GH_TOKEN, password: process.env.SESSION_PASSWORD }) : null;\n  if (live && await ledger.read()) {\n    report('The authorized one-dollar trial is already reserved or used. No further orders were sent.');\n    return;\n  }\n  const accountClient = live ? createClient(keys) : null;\n \
        \ const end = Date.now() + 330 * 60000;\n  report(live ? 'Manual live trial: maximum cumulative new debit $1 including fees. One order attempt only; never recycle the dollar. Limit buys only; hold filled contracts to settlement.' : 'Read-only strategy check. Real orders are disabled; no account keys are used.');\n  do {\n    let supported = 0, signals = 0;\n    for (const coin of ['btc', 'eth']) {\n      if (stopped || Date.now() >= end) return;\n      let ladders, volatility;\n      try {\n        volatility = await realisedVol(coin);\n        ladders = await marketClient.ladders(coin);\n      } catch {\n        report(coin.toUpperCase() + ': price or market data unavailable; no orders for this scan.');\n        continue;\n      }\n      const s = (await spot(coin)).price;\n      for (const ladder of ladders) {\n        supported += ladder.contracts.length;\n        const priced = priceLadder(ladder, { S: s, sigma: volatility.sigma, cfg: DEFAULTS });\n        const candidates =\
        \ priced.contracts.filter(c => c.signal).sort((a, b) => b.best.edge - a.best.edge);\n        signals += candidates.length;\n        if (!live || !candidates.length) continue;\n        // Refresh this entire volatility ladder, then the selected quote and model inputs.\n        const fresh = [];\n        for (let i = 0; i < ladder.contracts.length; i += 4) {\n          fresh.push(...(await Promise.all(ladder.contracts.slice(i, i + 4).map(c => marketClient.quote(c)))).filter(Boolean));\n          await new Promise(resolve => setTimeout(resolve, 250));\n        }\n        const updatedSpot = (await spot(coin)).price;\n        const current = priceLadder({ ...ladder, contracts: fresh }, { S: updatedSpot, sigma: volatility.sigma, cfg: DEFAULTS });\n        for (const c of current.contracts.filter(c => c.signal).sort((a, b) => b.best.edge - a.best.edge)) {\n          if (stopped || Date.now() >= end) return;\n          const account = await accountClient.account();\n          const usd\
        \ = account.balances?.find(b => b.currency === 'USD');\n          if (!account.ok || typeof usd?.buyingPower !== 'number' || !Number.isFinite(usd.buyingPower)) throw new Error('Cannot verify USD buying power; no order sent');\n          if ((await orderClient.openOrders()).length) throw new Error('Existing open orders need review before this trial; no order sent');\n          let plan;\n          try { plan = planOneDollarOrder({ ...c, side: c.best.side, limit: c.best.ask, fair: c.best.fair }, Math.floor(usd.buyingPower * 100 + 1e-9)); }\n          catch { continue; }\n          const outcome = await executeTrial({ candidate: plan, orderClient, ledger, shouldStop: () => stopped || Date.now() >= end });\n          report(outcome.status === 'acknowledged' ? 'One limit order was acknowledged. This is not fill confirmation. The dollar will not be reused. Check Polymarket US for fills; filled contracts remain held to settlement.' : 'Stopped. The dollar may remain reserved; no replacement\
        \ order will be sent automatically.');\n          return;\n        }\n      }\n    }\n    report(`Strategy scan complete: ${supported} supported contracts; ${signals} model signals before size and rounded-fee checks.`);\n    if (!live) return;\n    const next = Date.now() + 5 * 60000;\n    while (!stopped && Date.now() < next && Date.now() < end) await new Promise(resolve => setTimeout(resolve, 1000));\n  } while (!stopped && Date.now() < end);\n  report('Trial session ended without submitting an order.');\n}\n\nif (process.argv[1] && import.meta.url === pathToFileURL(process.argv[1]).href) {\n  main().catch(error => { report(error.message); process.exitCode = 1; });\n}\nBOTXRAY_SOURCE\n"
    - name: Download the verified Bot X-Ray release
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p results
        curl --fail --location --retry 2 --connect-timeout 20 --max-time 120 \
          https://part-timequant.com/kit/bot-x-ray.tar.gz -o bot-x-ray.tar.gz
        echo '3073d5071c70b868c62e327a717917b6b40d5ee238803a4a161f5a132ae20910  bot-x-ray.tar.gz' | sha256sum --check
        python3 - <<'PY'
        import tarfile
        from pathlib import PurePosixPath
        with tarfile.open('bot-x-ray.tar.gz') as archive:
            for member in archive.getmembers():
                p = PurePosixPath(member.name)
                if p.is_absolute() or '..' in p.parts or not p.parts or p.parts[0] != 'bot-x-ray' or not (member.isfile() or member.isdir()):
                    raise SystemExit('Unexpected archive entry: ' + member.name)
            archive.extractall('.', filter='data')
        PY

        cp bot-x-ray-actions/polymarket-us.mjs bot-x-ray/lib/brokers/polymarket-us.js
        cp bot-x-ray-actions/paper-bankroll.mjs bot-x-ray/lib/strategy/paper-bankroll.js
        node bot-x-ray-actions/paper-bankroll.mjs patch bot-x-ray
        cp bot-x-ray-actions/polymarket-us-markets.mjs bot-x-ray/lib/strategy/polymarket-us-markets.js
        node bot-x-ray-actions/polymarket-us-strategy-patch.mjs bot-x-ray

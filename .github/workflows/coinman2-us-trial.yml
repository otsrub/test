        \ view balances and positions. Automated orders are disabled. The strategy currently runs on paper on Kalshi and ETF options.',\n  account: keys => createClient({ keyId: keys.keyId, secretKey: keys.secret }).account(),\n  positions: keys => createClient({ keyId: keys.keyId, secretKey: keys.secret }).positions(),\n  async submit() { throw new Error('Polymarket US automated orders are disabled. No order was sent.'); },\n};\nBOTXRAY_SOURCE\ncat > bot-x-ray-actions/polymarket-us.test.mjs <<'BOTXRAY_SOURCE'\nimport test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { createPublicKey, createPrivateKey, verify } from 'node:crypto';\nimport adapter, { createClient, signingHeaders } from './polymarket-us.mjs';\n\n// RFC 8032 Ed25519 test seed and public key, independent of the account credentials.\nconst seed = Buffer.from('9d61b19deffd5a60ba844af492ec2cc44449c5697b326919703bac031cae7f60', 'hex');\nconst secretKey = seed.toString('base64');\nconst publicKey = createPublicKey({\

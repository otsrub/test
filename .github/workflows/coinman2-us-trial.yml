        \  try {\n    const state = await (await get('http://127.0.0.1:3797/api/strategy')).json();\n    fs.writeFileSync('session-results/strategy-final.json', JSON.stringify(state, null, 2));\n  } catch {}\n} finally {\n  tunnel?.kill('SIGTERM');\n  gateway.closeAllConnections();\n  gateway.close();\n  server.kill('SIGTERM');\n  fs.closeSync(log);\n}\nBOTXRAY_SOURCE\ncat > bot-x-ray-actions/gateway.test.mjs <<'BOTXRAY_SOURCE'\nimport test from 'node:test';\nimport assert from 'node:assert/strict';\nimport http from 'node:http';\nimport { once } from 'node:events';\nimport { createGateway } from './gateway.mjs';\nimport { encryptState, decryptState } from './state.mjs';\n\ntest('password gate, same-origin writes, and shutdown protection', async () => {\n  const password = 'test-password-for-isolated-tests-only';\n  const upstream = http.createServer((req, res) => res.end(JSON.stringify({ host: req.headers.host, origin: req.headers.origin, auth: req.headers.authorization })));\n  upstream.listen(0,\
        \ '127.0.0.1');\n  await once(upstream, 'listening');\n  const gateway = createGateway({ password, upstreamPort: upstream.address().port });\n  gateway.listen(0, '127.0.0.1');\n  await once(gateway, 'listening');\n  const base = `http://127.0.0.1:${gateway.address().port}`;\n  const authorization = 'Basic ' + Buffer.from(`botxray:${password}`).toString('base64');\n  try {\n    assert.equal((await fetch(base)).status, 401);\n    assert.equal((await fetch(base + '/__account')).status, 401);\n    assert.equal((await fetch(base, { headers: { authorization: 'Basic wrong' } })).status, 401);\n    const read = await (await fetch(base, { headers: { authorization } })).json();\n    assert.equal(read.auth, undefined);\n    const headers = { authorization, 'x-bx': '1', origin: 'https://another.example' };\n    assert.equal((await fetch(base, { method: 'POST', headers })).status, 403);\n    headers.origin = base;\n    assert.equal((await fetch(base + '/__account/check', { method: 'POST', headers\
        \ })).status, 200);\n    assert.equal((await fetch(base + '/__account/check', { headers })).status, 405);\n    const write = await (await fetch(base, { method: 'POST', headers })).json();\n    assert.equal(write.origin, `http://127.0.0.1:${upstream.address().port}`);\n    assert.equal((await fetch(base + '/api/shutdown', { method: 'POST', headers })).status, 403);\n  } finally { gateway.closeAllConnections(); gateway.close(); upstream.closeAllConnections(); upstream.close(); }\n});\ntest('state encryption restores bytes and rejects a wrong password or tampered backup', () => {\n  const original = Buffer.from('saved paper trades and settings');\n  const password = 'test-password-for-isolated-tests-only';\n  const encrypted = encryptState(original, password);\n  assert.deepEqual(decryptState(encrypted, password), original);\n  assert.throws(() => decryptState(encrypted, 'different-password'));\n  encrypted[encrypted.length - 1] ^= 1;\n  assert.throws(() => decryptState(encrypted, password));\n\

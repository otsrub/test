name: Coinman2 US - one dollar trial
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: check reads public prices only. live may place one real limit order costing at most $1 including fees.
        type: choice
        options:
        - check
        - live
        default: check
        required: true
      confirmation:
        description: 'For live mode, type exactly: RISK AT MOST 1 USD'
        type: string
        required: false
        default: ''
  push:
    branches:
    - main
    paths:
    - .github/workflows/coinman2-us-trial.yml
permissions:
  contents: read
concurrency:
  group: bot-x-ray-us-one-dollar-trial
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
        package-manager-cache: false
    - name: Prepare the protected session helper
      shell: bash
      run: "set -euo pipefail\nmkdir -p bot-x-ray-actions\ncat > bot-x-ray-actions/gateway.mjs <<'BOTXRAY_SOURCE'\nimport http from 'node:http';\nimport { createHash, timingSafeEqual } from 'node:crypto';\n\nconst hash = value => createHash('sha256').update(value).digest();\n\nexport function createGateway({ password, upstreamPort = 3797, onFinish = () => {}, onAccountCheck = async () => ({ connected: false, note: 'Account credentials have not been configured.' }) }) {\n  if (!password || password.length < 24) throw new Error('A strong session password is required');\n  const expected = hash('Basic ' + Buffer.from(`botxray:${password}`).toString('base64'));\n  return http.createServer(async (req, res) => {\n    res.setHeader('Cache-Control', 'no-store');\n    res.setHeader('X-Content-Type-Options', 'nosniff');\n    res.setHeader('X-Frame-Options', 'DENY');\n    res.setHeader('Referrer-Policy', 'no-referrer');\n    if (!timingSafeEqual(hash(req.headers.authorization || ''), expected)) {\n\
        \      res.writeHead(401, { 'WWW-Authenticate': 'Basic realm=\"Bot X-Ray\", charset=\"UTF-8\"' });\n      return res.end('Sign in with your Bot X-Ray session password.');\n    }\n    const writes = !['GET', 'HEAD'].includes(req.method);\n    if (writes) {\n      const origin = req.headers.origin;\n      const ownOrigin = origin === `https://${req.headers.host}` || origin === `http://${req.headers.host}`;\n      if (req.headers['x-bx'] !== '1' || !ownOrigin) {\n        res.writeHead(403);\n        return res.end('This action must come from your Bot X-Ray page.');\n      }\n    }\n    if (req.url === '/__account/check') {\n      if (req.method !== 'POST') { res.writeHead(405, { Allow: 'POST' }); return res.end('Use the Check account button.'); }\n      res.setHeader('Content-Type', 'application/json');\n      try { return res.end(JSON.stringify(await onAccountCheck())); }\n      catch { res.writeHead(502); return res.end(JSON.stringify({ connected: false, liveTrading: false, note:\
        \ 'The account check could not finish. Try again in a moment.' })); }\n    }\n    if (req.url === '/__account') {\n      res.writeHead(200, { 'Content-Type': 'text/html; charset=utf-8' });\n      return res.end(`<!doctype html><meta name=\"viewport\" content=\"width=device-width\"><title>Polymarket US account \xB7 Bot X-Ray</title><style>body{font:18px system-ui;max-width:800px;margin:6vh auto;padding:24px;background:#f8f7f4;color:#1c2529}button{font:inherit;padding:12px;cursor:pointer}pre{font:14px ui-monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:20px}a{color:#075b73}</style><p><a href=\"/\">Back to Bot X-Ray</a></p><h1>Your Polymarket US account</h1><p>Check the connection to your real account and view its balances and positions. Automated orders are disabled. The app's strategy continues using simulated money on its existing Kalshi and ETF option markets.</p><button id=\"check\">Check account</button><p id=\"note\">Credentials are read from encrypted\
        \ GitHub secrets when a new session starts.</p><pre id=\"result\" hidden></pre><h2>Connect your account</h2><ol><li>Open <a href=\"https://polymarket.us/developer\" target=\"_blank\" rel=\"noreferrer\">Polymarket US's developer portal</a>, sign in using the same method as your app, and create an API key.</li><li>In <a href=\"https://github.com/otsrub/test/settings/secrets/actions\" target=\"_blank\" rel=\"noreferrer\">your GitHub repository's encrypted secrets</a>, add <code>POLYMARKET_US_KEY_ID</code> and <code>POLYMARKET_US_SECRET_KEY</code>. Enter each value there, never in chat or in repository files.</li><li>Start a new Bot X-Ray session, then return here and select Check account.</li></ol><p>Account values below are returned by Polymarket US's API. They are not saved in paper-trade backups. Keep your account credentials separate from the password used to open this page.</p><script>document.querySelector('#check').onclick=async()=>{const b=document.querySelector('#check'),n=document.querySelector('#note'),p=document.querySelector('#result');b.disabled=true;n.textContent='Checking\
        \ Polymarket US\u2026';p.hidden=true;try{const r=await fetch('/__account/check',{method:'POST',headers:{'x-bx':'1'}});const j=await r.json();n.textContent=j.note||'Account check complete';if(j.connected){p.textContent=JSON.stringify({balances:j.balances,positions:j.positions,morePositionsAvailable:j.morePositionsAvailable},null,2);p.hidden=false;}}catch{n.textContent='The account check did not finish. Try again.';}finally{b.disabled=false;}}</script>`);\n    }\n    if (req.url === '/__session') {\n      if (req.method === 'POST') {\n        res.end('Session ending. Your paper records are being saved to GitHub.');\n        setTimeout(onFinish, 250);\n        return;\n      }\n      res.writeHead(200, { 'Content-Type': 'text/html; charset=utf-8' });\n      return res.end(`<!doctype html><meta name=\"viewport\" content=\"width=device-width\"><title>Bot X-Ray session</title><style>body{font:18px system-ui;max-width:650px;margin:10vh auto;padding:24px}button{font:inherit;padding:12px}</style><h1>Bot\
        \ X-Ray session</h1><p>End this session to save your settings and paper trades for the next run.</p><button id=\"finish\">Finish and save</button><p><a href=\"/\">Back to Bot X-Ray</a></p><script>document.querySelector('#finish').onclick=async()=>{const r=await fetch('/__session',{method:'POST',headers:{'x-bx':'1'}});document.body.textContent=await r.text();}</script>`);\n    }\n    if (req.url.split('?')[0] === '/api/shutdown') {\n      res.writeHead(403);\n      return res.end('Use /__session to finish and save.');\n    }\n    const headers = { ...req.headers, host: `127.0.0.1:${upstreamPort}` };\n    for (const name of ['authorization', 'proxy-authorization', 'connection', 'forwarded', 'x-forwarded-host', 'x-forwarded-proto', 'cookie']) delete headers[name];\n    if (headers.origin) headers.origin = `http://127.0.0.1:${upstreamPort}`;\n    const upstream = http.request({ hostname: '127.0.0.1', port: upstreamPort, path: req.url, method: req.method, headers }, incoming => {\n  \
        \    const out = { ...incoming.headers, 'cache-control': 'no-store', 'x-frame-options': 'DENY', 'referrer-policy': 'no-referrer' };\n      delete out['www-authenticate'];\n      if (incoming.headers['content-type']?.startsWith('text/html')) {\n        delete out['content-length'];\n        let html = '';\n        incoming.setEncoding('utf8');\n        incoming.on('data', chunk => { html += chunk; });\n        incoming.on('end', () => {\n          const link = '<a href=\"/__account\" style=\"position:fixed;right:16px;bottom:16px;z-index:1000;background:#173b49;color:white;padding:12px 16px;border-radius:8px;text-decoration:none;font:15px system-ui\">Polymarket US account</a>';\n          res.writeHead(incoming.statusCode, out);\n          res.end(html.includes('</body>') ? html.replace('</body>', link + '</body>') : html + link);\n        });\n      } else {\n        res.writeHead(incoming.statusCode, out);\n        incoming.pipe(res);\n      }\n    });\n    upstream.on('error', ()\
        \ => {\n      if (!res.headersSent) res.writeHead(502);\n      res.end('Bot X-Ray is starting or this session has ended.');\n    });\n    req.on('aborted', () => upstream.destroy());\n    req.pipe(upstream);\n  });\n}\nBOTXRAY_SOURCE\ncat > bot-x-ray-actions/state.mjs <<'BOTXRAY_SOURCE'\nimport fs from 'node:fs';\nimport { randomBytes, scryptSync, createCipheriv, createDecipheriv } from 'node:crypto';\n\nexport function encryptState(bytes, password) {\n  if (!password || password.length < 24) throw new Error('Session password is missing');\n  const salt = randomBytes(16), iv = randomBytes(12);\n  const cipher = createCipheriv('aes-256-gcm', scryptSync(password, salt, 32), iv);\n  const encrypted = Buffer.concat([cipher.update(bytes), cipher.final()]);\n  return Buffer.concat([Buffer.from('BXR1'), salt, iv, cipher.getAuthTag(), encrypted]);\n}\nexport function decryptState(bytes, password) {\n  if (bytes.subarray(0, 4).toString() !== 'BXR1') throw new Error('Unrecognized state backup');\n\
        \  const decipher = createDecipheriv('aes-256-gcm', scryptSync(password, bytes.subarray(4, 20), 32), bytes.subarray(20, 32));\n  decipher.setAuthTag(bytes.subarray(32, 48));\n  return Buffer.concat([decipher.update(bytes.subarray(48)), decipher.final()]);\n}\nif (process.argv[1]?.endsWith('/state.mjs')) {\n  const [mode, input, output] = process.argv.slice(2);\n  if (!['save', 'restore'].includes(mode) || !input || !output) throw new Error('Use state.mjs save|restore INPUT OUTPUT');\n  const transform = mode === 'save' ? encryptState : decryptState;\n  fs.writeFileSync(output, transform(fs.readFileSync(input), process.env.SESSION_PASSWORD), { mode: 0o600 });\n}\nBOTXRAY_SOURCE\ncat > bot-x-ray-actions/session.mjs <<'BOTXRAY_SOURCE'\nimport fs from 'node:fs';\nimport { spawn } from 'node:child_process';\nimport { once } from 'node:events';\nimport { createGateway } from './gateway.mjs';\nimport { createClient } from './polymarket-us.mjs';\nimport { initialisePaperAccount } from './paper-bankroll.mjs';\n\
        \nconst password = process.env.SESSION_PASSWORD;\nconst minutes = Number(process.env.SESSION_MINUTES || 30);\nif (![2, 30, 60, 180, 300, 330].includes(minutes)) throw new Error('Invalid session length');\nif (!password || password.length < 24) throw new Error('Create the BOTXRAY_SESSION_PASSWORD repository secret first');\nconst auth = 'Basic ' + Buffer.from(`botxray:${password}`).toString('base64');\nconst childEnv = { PATH: process.env.PATH, HOME: process.env.HOME, TMPDIR: process.env.TMPDIR || '/tmp', HOST: '127.0.0.1', PORT: '3797', BOTXRAY_NO_OPEN: '1', BOTXRAY_BROKER: 'stub', BOTXRAY_KEY_MODE: 'paper' };\nfs.mkdirSync('session-results', { recursive: true });\nconst log = fs.openSync('session-results/server.log', 'a');\nlet stopped = false;\nlet finish;\nconst done = new Promise(resolve => { finish = () => { stopped = true; resolve(); }; });\nprocess.once('SIGTERM', finish);\nprocess.once('SIGINT', finish);\nconst accountClient = createClient({ keyId: process.env.POLYMARKET_US_KEY_ID,\
        \ secretKey: process.env.POLYMARKET_US_SECRET_KEY });\nconst appEnv = { ...childEnv, BOTXRAY_BROKER: 'polymarket-us', BOTXRAY_KEY_MODE: 'live', BOTXRAY_KEY_ID: process.env.POLYMARKET_US_KEY_ID || '', BOTXRAY_SECRET: process.env.POLYMARKET_US_SECRET_KEY || '' };\ninitialisePaperAccount('bot-x-ray', 15);\nconst server = spawn(process.execPath, ['server.js'], { cwd: 'bot-x-ray', env: appEnv, stdio: ['ignore', log, log] });\nlet tunnel;\nlet lastAccountCheck = 0;\nlet accountCheckInProgress = null;\nasync function checkAccount() {\n  if (accountCheckInProgress) return accountCheckInProgress;\n  if (Date.now() - lastAccountCheck < 15000) return { connected: false, liveTrading: false, note: 'Wait 15 seconds before checking again.' };\n  lastAccountCheck = Date.now();\n  accountCheckInProgress = (async () => {\n    try {\n      const status = await accountClient.account();\n      if (!status.ok) return { connected: false, liveTrading: false, note: status.note };\n      const positionData\
        \ = await accountClient.positions();\n      return { connected: true, liveTrading: false, note: status.note, balances: status.balances, positions: positionData.positions, morePositionsAvailable: positionData.moreAvailable };\n    } catch (error) {\n      return { connected: false, liveTrading: false, note: error.message };\n    }\n  })();\n  try { return await accountCheckInProgress; } finally { accountCheckInProgress = null; }\n}\nconst gateway = createGateway({ password, onFinish: finish, onAccountCheck: checkAccount });\nconst delay = ms => new Promise(resolve => setTimeout(resolve, ms));\nconst get = (url, options = {}) => fetch(url, { ...options, signal: AbortSignal.timeout(15000) });\ntry {\n  let healthy = false;\n  for (let i = 0; i < 40; i++) {\n    try { healthy = (await (await get('http://127.0.0.1:3797/api/health')).json()).app === 'bot-x-ray'; } catch {}\n    if (healthy) break;\n    if (server.exitCode !== null) throw new Error('Bot X-Ray exited during startup');\n\
        \    await delay(500);\n  }\n  if (!healthy) throw new Error('Bot X-Ray did not start');\n  const status = await (await get('http://127.0.0.1:3797/api/strategy')).json();\n  if (status.broker.armed || status.broker.adapterLive || !['stub', 'polymarket-us'].includes(status.broker.adapter)) throw new Error('Expected a session with automated orders disabled');\n  if (status.stats.paperAccount?.startingBalance !== 15 || status.config.stake !== 1) throw new Error('The $15 paper account is not configured');\n  const accountVerification = await checkAccount();\n  console.log(accountVerification.connected\n    ? 'Polymarket US connection verified: balances and positions accessible. Automated orders disabled.'\n    : `Polymarket US connection not verified: ${accountVerification.note}`);\n  gateway.listen(8080, '127.0.0.1');\n  await once(gateway, 'listening');\n  tunnel = spawn('./cloudflared', ['tunnel', '--no-autoupdate', '--protocol', 'http2', '--url', 'http://127.0.0.1:8080'], { env:\
        \ childEnv, stdio: ['ignore', 'pipe', 'pipe'] });\n  let tunnelLog = '';\n  tunnel.on('error', error => { console.error(error.message); finish(); });\n  const collect = chunk => { tunnelLog = (tunnelLog + chunk.toString()).slice(-20000); };\n  tunnel.stdout.on('data', collect);\n  tunnel.stderr.on('data', collect);\n  let url;\n  for (let i = 0; i < 120; i++) {\n    url = tunnelLog.match(/https:\\/\\/[a-z0-9-]+\\.trycloudflare\\.com/)?.[0];\n    if (url) break;\n    if (tunnel.exitCode !== null) throw new Error(`Tunnel exited: ${tunnelLog.slice(-2000)}`);\n    await delay(500);\n  }\n  if (!url) throw new Error(`No tunnel address appeared: ${tunnelLog.slice(-2000)}`);\n  let verified = false;\n  for (let i = 0; i < 24; i++) {\n    try {\n      const anonymous = await get(url + '/api/health');\n      if (anonymous.status !== 401) throw new Error('Password gate did not reject anonymous access');\n      const page = await get(url, { headers: { authorization: auth } });\n      if (!page.ok\
        \ || !(await page.text()).includes('Bot X-Ray')) throw new Error('App page not ready');\n      const presets = await get(url + '/api/presets', { headers: { authorization: auth } });\n      if (!(await presets.json()).wallets?.length) throw new Error('App data not ready');\n      const update = await get(url + '/api/strategy/config', { method: 'POST', headers: { authorization: auth, origin: url, 'x-bx': '1', 'content-type': 'application/json' }, body: '{}' });\n      if (!update.ok) throw new Error('App settings could not be saved through the tunnel');\n      verified = true;\n      break;\n    } catch (error) {\n      if (i === 23) throw error;\n      await delay(2000);\n    }\n  }\n  if (!verified) throw new Error('Could not verify the protected app');\n  const end = new Date(Date.now() + minutes * 60000).toISOString();\n  fs.writeFileSync('session-results/session.json', JSON.stringify({ url, end, paperOnly: true, paperStartingBalance: 15, paperTradeSize: 1 }, null, 2));\n  console.log(`Bot\
        \ X-Ray is ready: ${url}`);\n  console.log(`Username: botxray. Password: the session password supplied in chat. Ends at ${end}.`);\n  if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Bot X-Ray is open\\n\\n[Open the full app](${url}) \xB7 [Finish session and save](${url}/__session)\\n\\nUsername: **botxray**. Use the password supplied in chat; it is stored as a repository secret.\\n\\nSession ends at **${end}**. Paper trading only. Settings and paper records restore from the previous encrypted backup.\\n\\nFor another session: Actions \u2192 Bot X-Ray paper run \u2192 Run workflow.\\n`);\n  const timer = setTimeout(finish, minutes * 60000);\n  const monitor = setInterval(() => {\n    if (server.exitCode !== null || tunnel.exitCode !== null) {\n      console.error('The app or tunnel stopped unexpectedly');\n      process.exitCode = 1;\n      finish();\n    }\n  }, 5000);\n  await done;\n  clearTimeout(timer);\n  clearInterval(monitor);\n\
        \  try {\n    const state = await (await get('http://127.0.0.1:3797/api/strategy')).json();\n    fs.writeFileSync('session-results/strategy-final.json', JSON.stringify(state, null, 2));\n  } catch {}\n} finally {\n  tunnel?.kill('SIGTERM');\n  gateway.closeAllConnections();\n  gateway.close();\n  server.kill('SIGTERM');\n  fs.closeSync(log);\n}\nBOTXRAY_SOURCE\ncat > bot-x-ray-actions/gateway.test.mjs <<'BOTXRAY_SOURCE'\nimport test from 'node:test';\nimport assert from 'node:assert/strict';\nimport http from 'node:http';\nimport { once } from 'node:events';\nimport { createGateway } from './gateway.mjs';\nimport { encryptState, decryptState } from './state.mjs';\n\ntest('password gate, same-origin writes, and shutdown protection', async () => {\n  const password = 'test-password-for-isolated-tests-only';\n  const upstream = http.createServer((req, res) => res.end(JSON.stringify({ host: req.headers.host, origin: req.headers.origin, auth: req.headers.authorization })));\n  upstream.listen(0,\
        \ '127.0.0.1');\n  await once(upstream, 'listening');\n  const gateway = createGateway({ password, upstreamPort: upstream.address().port });\n  gateway.listen(0, '127.0.0.1');\n  await once(gateway, 'listening');\n  const base = `http://127.0.0.1:${gateway.address().port}`;\n  const authorization = 'Basic ' + Buffer.from(`botxray:${password}`).toString('base64');\n  try {\n    assert.equal((await fetch(base)).status, 401);\n    assert.equal((await fetch(base + '/__account')).status, 401);\n    assert.equal((await fetch(base, { headers: { authorization: 'Basic wrong' } })).status, 401);\n    const read = await (await fetch(base, { headers: { authorization } })).json();\n    assert.equal(read.auth, undefined);\n    const headers = { authorization, 'x-bx': '1', origin: 'https://another.example' };\n    assert.equal((await fetch(base, { method: 'POST', headers })).status, 403);\n    headers.origin = base;\n    assert.equal((await fetch(base + '/__account/check', { method: 'POST', headers\
        \ })).status, 200);\n    assert.equal((await fetch(base + '/__account/check', { headers })).status, 405);\n    const write = await (await fetch(base, { method: 'POST', headers })).json();\n    assert.equal(write.origin, `http://127.0.0.1:${upstream.address().port}`);\n    assert.equal((await fetch(base + '/api/shutdown', { method: 'POST', headers })).status, 403);\n  } finally { gateway.closeAllConnections(); gateway.close(); upstream.closeAllConnections(); upstream.close(); }\n});\ntest('state encryption restores bytes and rejects a wrong password or tampered backup', () => {\n  const original = Buffer.from('saved paper trades and settings');\n  const password = 'test-password-for-isolated-tests-only';\n  const encrypted = encryptState(original, password);\n  assert.deepEqual(decryptState(encrypted, password), original);\n  assert.throws(() => decryptState(encrypted, 'different-password'));\n  encrypted[encrypted.length - 1] ^= 1;\n  assert.throws(() => decryptState(encrypted, password));\n\
        });\nBOTXRAY_SOURCE\ncat > bot-x-ray-actions/polymarket-us.mjs <<'BOTXRAY_SOURCE'\n// Official Polymarket US account API. Account viewing only; no order endpoint exists here.\nimport { createPrivateKey, sign } from 'node:crypto';\n\nconst ORIGIN = 'https://api.polymarket.us';\nconst PKCS8_PREFIX = Buffer.from('302e020100300506032b657004220420', 'hex');\n\nexport function signingHeaders({ keyId, secretKey }, path, timestamp = Date.now()) {\n  if (!keyId || !secretKey) throw new Error('Polymarket US credentials are missing');\n  if (!['/v1/account/balances', '/v1/portfolio/positions'].includes(path)) throw new Error('Only account-viewing requests are supported');\n  const text = secretKey.trim();\n  if (!/^[A-Za-z0-9+/]+={0,2}$/.test(text)) throw new Error('The Polymarket US Secret Key must be base64');\n  const bytes = Buffer.from(text, 'base64');\n  if (![32, 64].includes(bytes.length)) throw new Error('The Polymarket US Secret Key must contain a 32-byte seed or 64-byte key');\n\
        \  const key = createPrivateKey({ key: Buffer.concat([PKCS8_PREFIX, bytes.subarray(0, 32)]), format: 'der', type: 'pkcs8' });\n  const time = String(timestamp);\n  return {\n    'X-PM-Access-Key': keyId,\n    'X-PM-Timestamp': time,\n    'X-PM-Signature': sign(null, Buffer.from(time + 'GET' + path), key).toString('base64'),\n    Accept: 'application/json',\n  };\n}\n\nexport function createClient({ keyId, secretKey, fetchImpl = globalThis.fetch, now = Date.now } = {}) {\n  const configured = Boolean(keyId && secretKey);\n  async function read(path) {\n    const headers = signingHeaders({ keyId, secretKey }, path, now());\n    let response;\n    try {\n      response = await fetchImpl(ORIGIN + path, { method: 'GET', headers, redirect: 'error', signal: AbortSignal.timeout(10000) });\n    } catch {\n      throw new Error('Polymarket US did not answer. Try the account check again.');\n    }\n    if (!response.ok) {\n      const status = response.status;\n      const message = status\
        \ === 401 || status === 403\n        ? 'Polymarket US did not accept these credentials. Check the Key ID, Secret Key, and API access in its developer portal.'\n        : status === 429 ? 'Polymarket US is limiting requests. Try again in a moment.'\n        : `Polymarket US account request failed (HTTP ${status}).`;\n      throw new Error(message);\n    }\n    try { return await response.json(); }\n    catch { throw new Error('Polymarket US returned an unreadable account response.'); }\n  }\n  return {\n    configured,\n    async account() {\n      if (!configured) return { ok: false, configured: false, mode: null, liveTrading: false, note: 'Add POLYMARKET_US_KEY_ID and POLYMARKET_US_SECRET_KEY to the repository secrets, then start a new session.' };\n      const data = await read('/v1/account/balances');\n      if (!Array.isArray(data.balances)) throw new Error('Polymarket US returned an unexpected balance format.');\n      return {\n        ok: true, configured: true, mode: 'live',\

        \    await delay(500);\n  }\n  if (!healthy) throw new Error('Bot X-Ray did not start');\n  const status = await (await get('http://127.0.0.1:3797/api/strategy')).json();\n  if (status.broker.armed || status.broker.adapterLive || !['stub', 'polymarket-us'].includes(status.broker.adapter)) throw new Error('Expected a session with automated orders disabled');\n  if (status.stats.paperAccount?.startingBalance !== 15 || status.config.stake !== 1) throw new Error('The $15 paper account is not configured');\n  const accountVerification = await checkAccount();\n  console.log(accountVerification.connected\n    ? 'Polymarket US connection verified: balances and positions accessible. Automated orders disabled.'\n    : `Polymarket US connection not verified: ${accountVerification.note}`);\n  gateway.listen(8080, '127.0.0.1');\n  await once(gateway, 'listening');\n  tunnel = spawn('./cloudflared', ['tunnel', '--no-autoupdate', '--protocol', 'http2', '--url', 'http://127.0.0.1:8080'], { env:\
        \ childEnv, stdio: ['ignore', 'pipe', 'pipe'] });\n  let tunnelLog = '';\n  tunnel.on('error', error => { console.error(error.message); finish(); });\n  const collect = chunk => { tunnelLog = (tunnelLog + chunk.toString()).slice(-20000); };\n  tunnel.stdout.on('data', collect);\n  tunnel.stderr.on('data', collect);\n  let url;\n  for (let i = 0; i < 120; i++) {\n    url = tunnelLog.match(/https:\\/\\/[a-z0-9-]+\\.trycloudflare\\.com/)?.[0];\n    if (url) break;\n    if (tunnel.exitCode !== null) throw new Error(`Tunnel exited: ${tunnelLog.slice(-2000)}`);\n    await delay(500);\n  }\n  if (!url) throw new Error(`No tunnel address appeared: ${tunnelLog.slice(-2000)}`);\n  let verified = false;\n  for (let i = 0; i < 24; i++) {\n    try {\n      const anonymous = await get(url + '/api/health');\n      if (anonymous.status !== 401) throw new Error('Password gate did not reject anonymous access');\n      const page = await get(url, { headers: { authorization: auth } });\n      if (!page.ok\

name: REA image - MAGenerativeInstrumentsCore
'on':
  push:
    paths:
    - .github/workflows/rea-image-magenerativeinstrumentscore.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MAGenerativeInstrumentsCore.framework/MAGenerativeInstrumentsCore
      artifact: rea-image-magenerativeinstrumentscore

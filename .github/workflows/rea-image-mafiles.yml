name: REA image - MAFiles
'on':
  push:
    paths:
    - .github/workflows/rea-image-mafiles.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MAFiles.framework/MAFiles
      artifact: rea-image-mafiles

name: REA image - LogicAnalytics
'on':
  push:
    paths:
    - .github/workflows/rea-image-logicanalytics.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/LogicAnalytics.framework/LogicAnalytics
      artifact: rea-image-logicanalytics

name: REA image - MAStepSequencer
'on':
  push:
    paths:
    - .github/workflows/rea-image-mastepsequencer.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MAStepSequencer.framework/MAStepSequencer
      artifact: rea-image-mastepsequencer

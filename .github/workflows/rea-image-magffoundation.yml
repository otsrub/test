name: REA image - MAGFFoundation
'on':
  push:
    paths:
    - .github/workflows/rea-image-magffoundation.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MAGFFoundation.framework/MAGFFoundation
      artifact: rea-image-magffoundation

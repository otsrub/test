name: REA MACore context cache lookup source

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/rea-context-cache.yml

permissions:
  actions: read
  contents: read

jobs:
  verify-cache-lookup:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded verifier dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18
          python -m pip install --disable-pip-version-check unicorn==2.1.4
      - name: Retrieve immutable MACore input
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 39769268152 --repo "$GITHUB_REPOSITORY" -n rea-context-init-evidence -D prior-context-readonly
      - name: Stage source and verifier
        run: |
          mkdir -p work
          cp reconstruction/macore/macore_context_cache_lookup.c work/
          echo '' | base64 -d > work/verify_context_cache_lookup.py
          cp -a prior-context-readonly/macore-input work/macore-input
      - name: Differential verification against original cache lookup
        run: cd work && python verify_context_cache_lookup.py
      - name: Assemble immutable evidence
        if: always()
        run: |
          mkdir -p evidence
          cp work/macore_context_cache_lookup.c work/verify_context_cache_lookup.py evidence/
          cp -a work/context-cache-lookup evidence/ 2>/dev/null || true
          cp -a work/macore-input evidence/
          find evidence -type f -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-context-cache-evidence
          path: evidence
          if-no-files-found: error
          retention-days: 90

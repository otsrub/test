name: REA image - MAPlugInGUI
'on':
  push:
    paths:
    - .github/workflows/rea-image-maplugingui.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MAPlugInGUI.framework/MAPlugInGUI
      artifact: rea-image-maplugingui

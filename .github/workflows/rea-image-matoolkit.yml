name: REA image - MAToolKit
'on':
  push:
    paths:
    - .github/workflows/rea-image-matoolkit.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MAToolKit.framework/MAToolKit
      artifact: rea-image-matoolkit

name: REA image - MAAccessibility
'on':
  push:
    paths:
    - .github/workflows/rea-image-maaccessibility.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MAAccessibility.framework/MAAccessibility
      artifact: rea-image-maaccessibility

name: REA Logic tail adapters source

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/rea-logic-tail-adapters.yml

permissions:
  contents: read

jobs:
  verify-logic-tail-adapters:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded verifier dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18
          python -m pip install --disable-pip-version-check unicorn==2.1.4
      - name: Download immutable original release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download mobilelogic-3.4-archive --repo "$GITHUB_REPOSITORY" --pattern MobileLogic.zip
      - name: Stage verifier
        run: |
          printf '%s' '' | base64 -d | gzip -d > verify_logic_tail_adapters.py
          sha256sum verify_logic_tail_adapters.py
      - name: Recover source and differentially verify tail adapters
        run: python verify_logic_tail_adapters.py
      - name: Assemble immutable evidence
        if: always()
        run: |
          mkdir -p evidence
          cp verify_logic_tail_adapters.py evidence/
          cp -a logic-tail-adapters evidence/ 2>/dev/null || true
          sha256sum MobileLogic.zip > evidence/ORIGINAL_ARCHIVE_SHA256.txt
          find evidence -type f -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rea-logic-tail-adapters-evidence
          path: evidence
          if-no-files-found: error
          retention-days: 90

name: REA Logic resolved spec integration
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/rea-logic-resolved-specs.yml
      - reconstruction/logic/verify_logic_resolved_specs.py
permissions:
  contents: read
  actions: read
jobs:
  recover-and-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: rea-format-presentation-evidence
          run-id: '39887815905'
          github-token: ${{ github.token }}
          path: presentation-prior
      - uses: actions/download-artifact@v4
        with:
          name: rea-logic-tail-adapters-evidence
          run-id: '39845208071'
          github-token: ${{ github.token }}
          path: prior
      - uses: actions/download-artifact@v4
        with:
          name: rea-continuation-dossiers-evidence
          run-id: '38815798247'
          github-token: ${{ github.token }}
          path: dossiers
      - name: Install bounded verifier dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          python -m pip install unicorn==2.1.4
      - name: Recover source and execute original comparisons
        run: python reconstruction/logic/verify_logic_resolved_specs.py
      - name: Preserve source and diagnostics
        if: always()
        run: |
          mkdir -p evidence
          cp reconstruction/logic/verify_logic_resolved_specs.py evidence/
          cp reconstruction/logic/logic-helper-boundaries.json evidence/
          cp -a presentation-prior evidence/
          cp -a resolved-specs evidence/ 2>/dev/null || true
          sha256sum dossiers/logic-input/target.bin > evidence/ORIGINAL_SHA256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rea-resolved-specs-evidence
          path: evidence
          retention-days: 90

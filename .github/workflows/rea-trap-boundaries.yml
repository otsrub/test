name: REA explicit exception-exit boundary review
'on':
  push:
    paths:
    - .github/workflows/rea-trap-boundaries.yml
permissions:
  contents: read
  actions: read
jobs:
  trap-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: ${{ github.run_attempt == 1 }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: rea-eighty-original-boundary-dossiers
        run-id: '38730918942'
        github-token: ${{ github.token }}
        path: prior
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned decoder and emulator
      run: python -m pip install capstone==5.0.6 unicorn==2.1.4
    - name: Stage explicit exception-exit reviewer
      shell: python
      run: 'import pathlib,base64

        p=pathlib.Path("evidence");p.mkdir(exist_ok=True)

        assets={''review_trap_boundaries.py'': ''''}

        for name,data in assets.items():(p/name).write_bytes(base64.b64decode(data))

        '
    - name: Resolve only full reachable extents with original BRK exception exits
      run: python evidence/review_trap_boundaries.py prior/dossiers evidence/trap-review
    - name: Preserve original bytes and every prior source checkpoint
      if: always()
      run: cp -R prior evidence/prior-boundary-dossiers
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rea-explicit-exception-boundary-review
        path: evidence/
        if-no-files-found: error
        retention-days: 90

name: REA image - MACore
'on':
  push:
    paths:
    - .github/workflows/rea-image-macore.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MACore.framework/MACore
      artifact: rea-image-macore

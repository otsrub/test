name: REA Logic tree and aliasing source expansion
'on':
  push:
    paths:
    - .github/workflows/rea-logic-tree-source.yml
permissions:
  contents: read
  actions: read
jobs:
  logic-source-expansion:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ github.run_attempt == 1 }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: rea-clean-source-package-and-rebuild-evidence
        run-id: '38751580429'
        github-token: ${{ github.token }}
        path: prior
    - uses: actions/download-artifact@v4
      with:
        name: rea-fourteen-function-logic-evidence
        run-id: '38758641890'
        github-token: ${{ github.token }}
        path: previous-failure
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install official compiler and pinned emulator
      run: 'sudo apt-get update

        sudo apt-get install -y clang-18 lld-18 llvm-18 make

        python -m pip install unicorn==2.1.4 capstone==5.0.6'
    - name: Stage instruction-derived source and tests
      shell: python
      run: 'import pathlib,json

        p=pathlib.Path("assets");p.mkdir(exist_ok=True)

        assets={''logic_tree_subset.c'': ''/* Instruction-derived Logic routines. Standalone C ABI, not
        recovered class\n * types. Valid ordinary memory and finite acyclic node graphs only. */\ntypedef
        __UINT64_TYPE__ u64;\nstatic u64 ld64(const void *p) { u64 v; __asm__ volatile("ldr %0, [%1]":"=r"(v):"r"(p):"memory");
        return v; }\nstatic unsigned ld32(const void *p) { unsigned v; __asm__ volatile("ldr %w0, [%1]":"=r"(v):"r"(p):"memory");
        return v; }\nstatic unsigned ld8(const void *p) { unsigned v; __asm__ volatile("ldrb %w0, [%1]":"=r"(v):"r"(p):"memory");
        return v; }\nstatic int ld16s(const void *p) { int v; __asm__ volatile("ldrsh %w0, [%1]":"=r"(v):"r"(p):"memory");
        return v; }\n/* Native 0x587b3c: flag bit six suppresses modulo-2^32 increment. */\nunsigned mobilelogic_logic_587b3c(const
        void *object,void *counter) {\n    if (!(ld8((const unsigned char *)object+0x99)&64u)) {\n        unsigned
        v=ld32(counter)+1u;\n        __asm__ volatile("str %w0, [%1]"::"r"(v),"r"(counter):"memory");\n    }\n    return
        1;\n}\n/* Native 0xe949c: preserve the observed traversal, including signed keys,\n * unsigned
        query byte, candidate selection, and the final key re-read.\n * Deliberately does not assume a
        sorted, balanced, or unique-key tree. */\nunsigned mobilelogic_logic_e949c(const void *object,const
        void *query) {\n    const unsigned char *q=query;\n    if (!(ld8(q+0x4b)&8u)) return 0;\n    const
        unsigned char *owner=(const void *)ld64((const unsigned char *)object+0x20);\n    const unsigned
        char *sentinel=owner+8;\n    const unsigned char *node=(const void *)ld64(sentinel);\n    if (!node)
        return 0;\n    int key=(int)ld8(q+0x47);\n    const unsigned char *candidate=sentinel;\n    do
        {\n        unsigned lower=ld16s(node+0x1a)<key-1;\n        if(!lower) candidate=node;\n        node=(const
        void *)ld64(node+8*lower);\n    } while(node);\n    if(candidate==sentinel) return 0;\n    return
        ld16s(candidate+0x1a)<key;\n}\n'', ''verify_logic_tree.py'': ''"""Actual linked ARM64 vs original
        bytes: two Logic functions, no runtime stubs.\nUsage: python verify_logic_tree.py INVENTORY OUT
        [--combined DYLIB]\n"""\nimport pathlib,json,hashlib,struct,random,sys,subprocess\nfrom unicorn
        import Uc,UC_ARCH_ARM64,UC_MODE_ARM,UC_HOOK_MEM_READ,UC_HOOK_MEM_WRITE,UC_HOOK_CODE\nfrom unicorn.arm64_const
        import *\nfrom payload_inventory import macho\nroot=pathlib.Path(__file__).resolve().parent\ninv=pathlib.Path(sys.argv[1]);out=pathlib.Path(sys.argv[2]);out.mkdir(parents=True,exist_ok=True)\nrows=json.loads(inv.read_text());spec=[]\nfor
        a in [0x587b3c,0xe949c]:\n    matches=[r for r in rows if r[\''image\''].split(\''/\'')[-1]==\''Logic\''
        and int(r[\''address\''],16)==a];assert len(matches)==1\n    r=matches[0];assert r[\''exact_contiguous_extent_verified\'']
        and not r[\''calls\''] and not r[\''tail_targets\'']\n    assert hashlib.sha256(bytes.fromhex(r[\''original_hex\''])).hexdigest()==r[\''extent_sha256\'']\n    spec.append({**r,\''symbol\'':f\''mobilelogic_logic_{a:x}\''})\nassert
        len({(r[\''image_sha256\''],int(r[\''address\''],16)) for r in spec})==2\ndiagnostics=[]\ndef
        run(argv):\n    p=subprocess.run(argv,text=True,capture_output=True);diagnostics.append({\''argv\'':argv,\''exit_code\'':p.returncode,\''stdout\'':p.stdout,\''stderr\'':p.stderr})\n    (out/\''compile-diagnostics.json\'').write_text(json.dumps(diagnostics,indent=2)+\''\\n\'');p.check_returncode()\npaths=[]\nif
        \''--combined\'' in sys.argv:paths=[pathlib.Path(sys.argv[sys.argv.index(\''--combined\'')+1])]\nelse:\n    for
        opt in [0,2,3]:\n        obj=out/f\''logic-O{opt}.o\'';lib=out/f\''liblogic-O{opt}.dylib\''\n        run([\''clang-18\'',\''-target\'',\''arm64-apple-ios17.0\'',f\''-O{opt}\'',\''-ffreestanding\'',\''-Wall\'',\''-Wextra\'',\''-Werror\'',\''-c\'',str(root/\''logic_tree_subset.c\''),\''-o\'',str(obj)])\n        run([\''ld64.lld-18\'',\''-arch\'',\''arm64\'',\''-platform_version\'',\''ios\'',\''17.0\'',\''17.0\'',\''-dylib\'',\''-undefined\'',\''error\'',str(obj),\''-o\'',str(lib)])\n        paths.append(lib)\nBASE=0x200000;SIZE=0x10000;STACK=0x400000;STOP=0x1000000\nsavedregs=[UC_ARM64_REG_X19,UC_ARM64_REG_X20,UC_ARM64_REG_X21,UC_ARM64_REG_X22,UC_ARM64_REG_X23,UC_ARM64_REG_X24,UC_ARM64_REG_X25,UC_ARM64_REG_X26,UC_ARM64_REG_X27,UC_ARM64_REG_X28,UC_ARM64_REG_X29]\nvectors=[UC_ARM64_REG_Q8,UC_ARM64_REG_Q9,UC_ARM64_REG_Q10,UC_ARM64_REG_Q11,UC_ARM64_REG_Q12,UC_ARM64_REG_Q13,UC_ARM64_REG_Q14,UC_ARM64_REG_Q15]\ndef
        engine():\n    u=Uc(UC_ARCH_ARM64,UC_MODE_ARM);u.mem_map(BASE,SIZE);u.mem_map(STACK,0x4000);return
        u\nreports=[];mismatches=0\nfor r in spec:\n    entry=int(r[\''address\''],16);code=bytes.fromhex(r[\''original_hex\'']);ref=engine();ref.mem_map(entry&~4095,8192);ref.mem_write(entry,code)\n    engines=[(ref,entry)];modules=[]\n    for
        p in paths:\n        b=p.read_bytes();m=macho(b);assert not [s for s in m[\''symbols\''] if s[\''undefined\'']]\n        symbols={s[\''name\''].lstrip(\''_\''):int(s[\''address\''],16)
        for s in m[\''symbols\''] if s[\''external\''] and not s[\''undefined\'']}\n        u=engine()\n        for
        vm,off,n in m[\''segments\'']:\n            if n:u.mem_map(vm&~4095,((vm+n+4095)&~4095)-(vm&~4095));u.mem_write(vm,b[off:off+n])\n        engines.append((u,symbols[r[\''symbol\'']]));modules.append({\''path\'':str(p),\''sha256\'':hashlib.sha256(b).hexdigest()})\n    traces=[];covered=set();branches=set();previous=[None]\n    def
        coverage(u,a,n,user):\n        covered.add(a)\n        if previous[0] is not None:branches.add((previous[0],a))\n        previous[0]=a\n    ref.hook_add(UC_HOOK_CODE,coverage)\n    for
        u,_ in engines:\n        rd=set();wr=set();traces.append((rd,wr))\n        def hook(dest):\n            def
        f(uc,access,a,n,value,user):\n                if BASE<=a and a+n<=BASE+SIZE:dest.update(range(a,a+n))\n            return
        f\n        u.hook_add(UC_HOOK_MEM_READ,hook(rd));u.hook_add(UC_HOOK_MEM_WRITE,hook(wr))\n    rng=random.Random(entry);passed=[0]*len(paths);failures=[];outcomes=set();maxnodes=0\n    for
        case in range(12000):\n        initial=bytearray(rng.randbytes(SIZE));ao=case%16;x0=BASE+0x100+ao;x1=BASE+0x500+ao\n        def
        put(fmt,addr,v):struct.pack_into(fmt,initial,addr-BASE,v)\n        if entry==0x587b3c:\n            if
        case%3==0:x1=x0+0x98+(case%4)\n            put(\''<I\'',x1,[0,1,0x7fffffff,0x80000000,0xfffffffe,0xffffffff,rng.getrandbits(32)][case%7]);put(\''<B\'',x0+0x99,case%256)\n        else:\n            put(\''<B\'',x1+0x4b,case%256);query=case%256;put(\''<B\'',x1+0x47,query)\n            owner=BASE+0x1000+ao;put(\''<Q\'',x0+0x20,owner)\n            count=case%33;maxnodes=max(maxnodes,count)\n            nodes=[BASE+0x2000+i*0x40+ao
        for i in range(count)];put(\''<Q\'',owner+8,nodes[0] if nodes else 0)\n            for i,node
        in enumerate(nodes):\n                # Binary heap is finite and acyclic; keys deliberately unsorted.\n                for
        side in [0,1]:\n                    child=2*i+1+side;put(\''<Q\'',node+8*side,nodes[child] if
        child<count and (case%5!=0 or side==(case%2)) else 0)\n                key=[-32768,-1,0,1,254,255,256,32767,query-2,query-1,query,rng.randint(-32768,32767)][(case+i)%12]\n                put(\''<h\'',node+0x1a,key)\n        saved={reg:rng.getrandbits(64)
        for reg in savedregs};vs={reg:rng.getrandbits(128) for reg in vectors};states=[]\n        for
        j,(u,pc) in enumerate(engines):\n            u.mem_write(BASE,bytes(initial));u.mem_write(STACK,bytes(0x4000));u.reg_write(UC_ARM64_REG_SP,STACK+0x2000);u.reg_write(UC_ARM64_REG_X30,STOP)\n            for
        reg,v in [(UC_ARM64_REG_X0,x0),(UC_ARM64_REG_X1,x1),(UC_ARM64_REG_FPCR,0),(UC_ARM64_REG_FPSR,0)]:u.reg_write(reg,v)\n            for
        reg,v in saved.items():u.reg_write(reg,v)\n            for reg,v in vs.items():u.reg_write(reg,v)\n            traces[j][0].clear();traces[j][1].clear();previous[0]=None;u.emu_start(pc,STOP,count=10000)\n            assert
        u.reg_read(UC_ARM64_REG_PC)==STOP\n            abi=u.reg_read(UC_ARM64_REG_SP)==STACK+0x2000 and
        all(u.reg_read(reg)==v for reg,v in saved.items()) and all((u.reg_read(reg)&((1<<64)-1))==(v&((1<<64)-1))
        for reg,v in vs.items())\n            states.append((u.reg_read(UC_ARM64_REG_X0),bytes(u.mem_read(BASE,SIZE)),u.reg_read(UC_ARM64_REG_FPSR),abi))\n        assert
        states[0][3];outcomes.add(states[0][0])\n        for j in range(len(paths)):\n            ok=states[j+1]==states[0]
        and traces[j+1]==traces[0];passed[j]+=ok;mismatches+=not ok\n            if not ok and len(failures)<8:failures.append({\''case\'':case,\''module\'':str(paths[j]),\''state_match\'':states[j+1]==states[0],\''access_sets_match\'':traces[j+1]==traces[0]})\n    assert
        covered==set(range(entry,entry+len(code),4)),(r[\''symbol\''],covered)\n    reports.append({**r,\''cases_per_module\'':12000,\''passed_per_module\'':passed,\''original_instruction_coverage\'':len(covered),\''original_CFG_edges_exercised\'':[[hex(a),hex(b)]
        for a,b in sorted(branches)],\''return_outcomes\'':sorted(outcomes),\''maximum_nodes\'':maxnodes,\''first_failures\'':failures,\''linked_modules\'':modules})\n    print(r[\''symbol\''],passed,flush=True)\nreport={\''functions\'':reports,\''new_functions\'':2,\''new_original_bytes\'':128,\''mismatches\'':mismatches,\''scope\'':\''Actual
        original and linked iOS ARM64 instructions in Unicorn; result, full data memory, data read/write
        byte sets, FPSR and preserved ABI. All original instructions exercised. Sixteen alignment offsets,
        overlapping counter/object cases, signed key edges, empty and finite unsorted acyclic trees. No
        access order, faults, MMIO, concurrent mutation, cyclic graphs, iOS/device runtime, caller integration
        or whole-app equivalence.\'',\''decompiler_attempts\'':0,\''whole_app_equivalence_verified\'':False}\n(out/\''verification.json\'').write_text(json.dumps(report,indent=2)+\''\\n\'');assert
        mismatches==0,mismatches\n''}

        for name,data in assets.items():(p/name).write_text(data)

        '
    - name: Prepare clean fourteen-function source package
      shell: python
      run: "import pathlib,shutil,json,hashlib\nprior=pathlib.Path('prior');out=pathlib.Path('source-package')\n\
        shutil.copytree(prior/'source-package',out,ignore=shutil.ignore_patterns('build','reports','__pycache__'))\n\
        for row in json.loads((out/'SOURCE_SHA256.json').read_text()):\n    assert hashlib.sha256((out/row['path']).read_bytes()).hexdigest()==row['sha256']\n\
        inventory=list((prior/'prior-exception-checkpoint').rglob('inventory/compiler-boundaries.json'))\n\
        inventory=[p for p in inventory if len(json.loads(p.read_text()))==353];assert inventory\nrows=json.loads(inventory[0].read_text());selected=[r\
        \ for r in rows if r['image'].split('/')[-1]=='Logic' and int(r['address'],16) in [0x587b3c,0xe949c]];assert\
        \ len(selected)==2\n(out/'reference/logic-boundaries.json').write_text(json.dumps(selected,indent=2)+'\\\
        n')\nshutil.copy2('assets/logic_tree_subset.c',out/'src/logic_tree_subset.c')\nshutil.copy2('assets/verify_logic_tree.py',out/'tools/verify_logic_tree.py')\n\
        p=out/'tools/build.py';s=p.read_text().replace('len(sources)==5','len(sources)==6').replace('==12','==14').replace(\"\
        'function_count':12\",\"'function_count':14\").replace(\"'original_instruction_bytes':528\",\"\
        'original_instruction_bytes':656\");p.write_text(s)\np=out/'include/mobilelogic_subset.h';s=p.read_text();pos=s.index('#ifdef\
        \ __cplusplus',s.index('#ifdef __cplusplus')+1);s=s[:pos]+'unsigned mobilelogic_logic_587b3c(const\
        \ void *object,void *counter);\\nunsigned mobilelogic_logic_e949c(const void *object,const void\
        \ *query);\\n'+s[pos:];p.write_text(s)\np=out/'reference/functions.json';manifest=json.loads(p.read_text())\n\
        for r in selected:manifest.append({**r,'symbol':f\"mobilelogic_logic_{int(r['address'],16):x}\"\
        ,'returns_value':True})\nassert len(manifest)==len({(r['image_sha256'],int(r['address'],16)) for\
        \ r in manifest})==14\nassert sum(len(bytes.fromhex(r['original_hex'])) for r in manifest)==656\n\
        p.write_text(json.dumps(manifest,indent=2)+'\\n')\np=out/'Makefile';p.write_text(p.read_text()+'\\\
        tpython3 tools/verify_logic_tree.py reference/logic-boundaries.json reports/logic --combined build/libmobilelogic_subset.dylib\\\
        n')\np=out/'README.md';s=p.read_text().replace('twelve-function','fourteen-function').replace('528','656').replace('all\
        \ five C files','all six C files');s+='\\nTwo additional Logic routines (128 original bytes) use\
        \ 24,000 combined-module cases;\\nseparate O0/O2/O3 builds also run 24,000 cases each. Tree input\
        \ contract requires\\nfinite acyclic valid-memory nodes, but not ordering or balancing. Counter\
        \ tests\\ninclude object/counter overlap. All original instructions must be exercised.\\nThese\
        \ are standalone C interfaces, not recovered caller/class integration.\\n';p.write_text(s)\n(out/'SOURCE_SHA256.json').unlink()\n\
        hashes=[{'path':str(p.relative_to(out)),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for\
        \ p in sorted(out.rglob('*')) if p.is_file()]\n(out/'SOURCE_SHA256.json').write_text(json.dumps(hashes,indent=2)+'\\\
        n')\nassert not list(out.rglob('*.o')) and not list(out.rglob('*.dylib')) and not list(out.rglob('*.a'))\n"
    - name: Test new routines at O0 O2 O3
      run: 'cp prior/source-package/tools/payload_inventory.py assets/

        python assets/verify_logic_tree.py source-package/reference/logic-boundaries.json new-tests'
    - name: Package source only and rebuild combined module
      run: 'zip -qr mobilelogic-fourteen-source-only.zip source-package

        make -C source-package verify'
    - name: Preserve all evidence and immutable prior checkpoints
      if: always()
      run: 'mkdir -p evidence

        cp -R prior evidence/prior-clean-source-checkpoint

        cp -R previous-failure evidence/rejected-first-tree-source

        cp -R assets source-package evidence/

        if [ -d new-tests ]; then cp -R new-tests evidence/; fi

        if [ -f mobilelogic-fourteen-source-only.zip ]; then cp mobilelogic-fourteen-source-only.zip evidence/;
        fi'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rea-fourteen-function-logic-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 90

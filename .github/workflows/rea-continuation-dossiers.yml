name: REA remaining failure byte and dependency dossiers
'on':
  push:
    paths:
    - .github/workflows/rea-continuation-dossiers.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: rea-new-continuation-dossiers-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bounded-dossiers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ github.run_attempt == 1 }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: rea-madsp-capacity-phase-evidence
        run-id: '38781063249'
        github-token: ${{ github.token }}
        path: prior-readonly
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned analysis dependencies
      run: python -m pip install unicorn==2.1.4 capstone==5.0.6
    - name: Stage bounded source task and immutable checkpoint reference
      shell: python
      run: 'import pathlib,json,shutil

        a=json.loads(''{"payload_inventory.py": "\\"\\"\\"Read-only original archive inventory and conservative compiler extent review.\\nNo binary patching, stubs, type invention, or source-equivalence claims.\\n\\"\\"\\"\\nimport pathlib,struct,hashlib,json,zipfile,sys,collections,plistlib\\nfrom capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM\\nfrom capstone.arm64 import ARM64_OP_IMM\\nEXPECTED=\''f2a650fd7a51a7bb2bc5e8e5cc35a95236c02723ab3faeb162cca64ee62a744e\''\\ndef sha(b):return hashlib.sha256(b).hexdigest()\\ndef cstr(b,o=0):return b[o:].split(b\''\\\\0\'',1)[0].decode(\''utf-8\'',\''replace\'')\\ndef macho(b):\\n assert b[:4]==bytes.fromhex(\''cffaedfe\'')\\n pos=32;segments=[];sections=[];deps=[];rpaths=[];symtab=None;startdata=None;uuid=None;crypt=[];base=None\\n for _ in range(struct.unpack_from(\''<I\'',b,16)[0]):\\n  cmd,size=struct.unpack_from(\''<II\'',b,pos);assert size>=8 and pos+size<=len(b)\\n  if cmd==25:\\n   name=cstr(b[pos+8:pos+24]);vm,vmsz,off,fs=struct.unpack_from(\''<QQQQ\'',b,pos+24);segments.append((vm,off,fs))\\n   if name==\''__TEXT\'':base=vm\\n   for j in range(struct.unpack_from(\''<I\'',b,pos+64)[0]):\\n    p=pos+72+80*j;va,n,fo=struct.unpack_from(\''<QQI\'',b,p+32);sections.append({\''name\'':cstr(b[p:p+16]),\''segment\'':name,\''address\'':va,\''bytes\'':n,\''fileoff\'':fo,\''flags\'':struct.unpack_from(\''<I\'',b,p+64)[0]})\\n  elif cmd in [12,0x80000018,0x8000001f,0x80000023,0x20,13]:\\n   no,ts,cur,compat=struct.unpack_from(\''<IIII\'',b,pos+8);deps.append({\''kind\'':hex(cmd),\''name\'':cstr(b[pos:pos+size],no),\''current_version\'':cur,\''compatibility_version\'':compat})\\n  elif cmd==0x8000001c:rpaths.append(cstr(b[pos:pos+size],struct.unpack_from(\''<I\'',b,pos+8)[0]))\\n  elif cmd==2:symtab=struct.unpack_from(\''<IIII\'',b,pos+8)\\n  elif cmd==0x26:\\n   off,n=struct.unpack_from(\''<II\'',b,pos+8);startdata=b[off:off+n]\\n  elif cmd==0x1b:uuid=b[pos+8:pos+24].hex()\\n  elif cmd in [0x21,0x2c]:crypt.append({\''offset\'':struct.unpack_from(\''<I\'',b,pos+8)[0],\''size\'':struct.unpack_from(\''<I\'',b,pos+12)[0],\''cryptid\'':struct.unpack_from(\''<I\'',b,pos+16)[0]})\\n  pos+=size\\n starts=[]\\n if startdata is not None:\\n  assert base is not None\\n  a=base;v=shift=0\\n  for byte in startdata:\\n   v|=(byte&127)<<shift\\n   if byte&128:shift+=7;continue\\n   if v==0:break\\n   a+=v;starts.append(a);v=shift=0\\n symbols=[]\\n if symtab:\\n  off,n,so,sz=symtab;strings=b[so:so+sz]\\n  for i in range(n):\\n   si,kind,sec,desc,value=struct.unpack_from(\''<IBBHQ\'',b,off+16*i)\\n   if kind&0xe0 or not si:continue\\n   symbols.append({\''name\'':cstr(strings,si),\''address\'':hex(value),\''n_type\'':kind,\''section_index\'':sec,\''description_bits\'':desc,\''external\'':bool(kind&1),\''undefined\'':kind&14==0})\\n return {\''segments\'':segments,\''sections\'':sections,\''dependencies\'':deps,\''rpaths\'':rpaths,\''uuid\'':uuid,\''encryption\'':crypt,\''starts\'':starts,\''symbols\'':symbols}\\ndef review(b,m,row):\\n a=int(row[\''compiler_start\''],16);starts=m[\''starts\''];r={\''image\'':row[\''image\''],\''image_sha256\'':sha(b),\''address\'':hex(a),\''exact_contiguous_extent_verified\'':False,\''semantic_equivalence_verified\'':False}\\n if a not in starts:r[\''status\'']=\''compiler_start_not_in_original_metadata\'';return r\\n index=starts.index(a)\\n if index+1==len(starts):r[\''status\'']=\''last_start_has_no_metadata_upper_bound\'';return r\\n end=starts[index+1];r[\''next_compiler_start\'']=hex(end);code=None\\n for vm,off,n in m[\''segments\'']:\\n  if vm<=a and end<=vm+n:code=b[off+a-vm:off+end-vm]\\n if code is None:r[\''status\'']=\''extent_not_file_backed\'';return r\\n r.update({\''extent_bytes\'':len(code),\''extent_sha256\'':sha(code)})\\n if len(code)>1024*1024:r[\''status\'']=\''extent_exceeds_bounded_review\'';return r\\n cs=Cs(CS_ARCH_ARM64,CS_MODE_ARM);cs.detail=True;ins=list(cs.disasm(code,a));byaddr={i.address:i for i in ins}\\n reasons=[];tails=[];calls=[]\\n if len(ins)*4!=len(code):reasons.append(\''not_all_extent_bytes_decode\'')\\n reachable=set();todo=[a]\\n while todo:\\n  pc=todo.pop()\\n  if pc in reachable:continue\\n  if pc not in byaddr:reasons.append(\''control_flow_outside_decoded_extent\'');continue\\n  reachable.add(pc);i=byaddr[pc];mn=i.mnemonic\\n  if mn in [\''ret\'',\''retaa\'',\''retab\'']:continue\\n  if mn in [\''br\'',\''braa\'',\''brab\'',\''braaz\'',\''brabz\'',\''eret\'',\''brk\'',\''hlt\'',\''udf\'']:reasons.append(\''indirect_or_exception_exit_requires_review\'');continue\\n  if mn==\''b\'':\\n   target=i.operands[-1].imm\\n   if a<=target<end:todo.append(target)\\n   elif target in starts:tails.append(hex(target))\\n   else:reasons.append(\''external_branch_not_known_compiler_start\'')\\n   continue\\n  if mn.startswith(\''b.\'') or mn in [\''cbz\'',\''cbnz\'',\''tbz\'',\''tbnz\'']:\\n   target=i.operands[-1]\\n   if target.type==ARM64_OP_IMM and a<=target.imm<end:todo.append(target.imm)\\n   else:reasons.append(\''conditional_branch_outside_extent\'')\\n  if mn in [\''bl\'',\''blr\'',\''blraa\'',\''blrab\'']:calls.append({\''address\'':hex(pc),\''instruction\'':mn+\'' \''+i.op_str,\''behavior_verified\'':False})\\n  todo.append(pc+4)\\n if reachable!=set(byaddr):reasons.append(\''unreachable_bytes_or_extra_function_fragments\'')\\n if ins and ins[-1].mnemonic not in [\''ret\'',\''retaa\'',\''retab\'',\''b\'']:reasons.append(\''no_terminal_return_or_tail_at_metadata_end\'')\\n reasons=sorted(set(reasons));r.update({\''status\'':\''requires_exact_boundary_review\'' if reasons else \''contiguous_extent_resolved\'',\''exact_contiguous_extent_verified\'':not reasons,\''limitations\'':reasons,\''tail_targets\'':sorted(set(tails)),\''calls\'':calls,\''instruction_count\'':len(ins),\''reachable_instruction_count\'':len(reachable)})\\n # Only resolved extents get original instruction evidence; unknowns retain hashes.\\n if not reasons:r.update({\''original_hex\'':code.hex(),\''assembly\'':[f\''{i.address:#x}: {i.mnemonic} {i.op_str}\'' for i in ins],\''basis\'':\''Original LC_FUNCTION_STARTS adjacent entries; complete decoding; reachable local CFG; explicit return/tail; no inferred Ghidra ranges\''})\\n return r\\ndef main():\\n archive=pathlib.Path(sys.argv[1]);out=pathlib.Path(sys.argv[3]);out.mkdir(parents=True,exist_ok=True)\\n with archive.open(\''rb\'') as f:assert hashlib.file_digest(f,\''sha256\'').hexdigest()==EXPECTED\\n triage=json.loads(pathlib.Path(sys.argv[2]).read_text());wanted=collections.defaultdict(list)\\n for r in triage:wanted[r[\''image\'']].append(r)\\n images=[];resources=[];boundaries=[];seen=set();plists=[]\\n with zipfile.ZipFile(archive) as z,(out/\''symbols.jsonl\'').open(\''w\'') as symbolout:\\n  for member in z.infolist():\\n   if member.is_dir():continue\\n   name=member.filename\\n   with z.open(member) as f:\\n    prefix=f.read(4)\\n    if prefix==bytes.fromhex(\''cffaedfe\''):\\n     b=prefix+f.read();digest=sha(b);m=macho(b)\\n     row={\''path\'':name,\''sha256\'':digest,\''bytes\'':len(b),\''uuid\'':m[\''uuid\''],\''dependencies\'':m[\''dependencies\''],\''rpaths\'':m[\''rpaths\''],\''encryption\'':m[\''encryption\''],\''sections\'':m[\''sections\''],\''native_symbol_records\'':len(m[\''symbols\'']),\''compiler_start_count\'':len(m[\''starts\'']),\''source_types_recovered\'':False}\\n     images.append(row)\\n     for s in m[\''symbols\'']:print(json.dumps({\''image_sha256\'':digest,**s},separators=(\'',\'',\'':\'')),file=symbolout)\\n     if name in wanted:\\n      seen.add(name)\\n      for r in wanted[name]:\\n       assert digest==r[\''image_sha256\''];boundaries.append(review(b,m,r))\\n    else:\\n     h=hashlib.sha256();h.update(prefix);data=bytearray(prefix) if name.endswith(\''Info.plist\'') else None\\n     while chunk:=f.read(1024*1024):\\n      h.update(chunk)\\n      if data is not None:data.extend(chunk)\\n     resources.append({\''path\'':name,\''bytes\'':member.file_size,\''sha256\'':h.hexdigest(),\''kind\'':\''resource-or-metadata-not-reconstructed-source\''})\\n     if data is not None:\\n      try:\\n       p=plistlib.loads(data);plists.append({\''path\'':name,\''bundle_id\'':p.get(\''CFBundleIdentifier\''),\''executable\'':p.get(\''CFBundleExecutable\''),\''minimum_os\'':p.get(\''MinimumOSVersion\''),\''bundle_version\'':p.get(\''CFBundleVersion\''),\''package_type\'':p.get(\''CFBundlePackageType\'')})\\n      except Exception as e:plists.append({\''path\'':name,\''parse_error\'':str(e)})\\n assert seen==set(wanted) and len(boundaries)==353\\n resolved=sum(r[\''exact_contiguous_extent_verified\''] for r in boundaries)\\n for filename,content in [(\''native-images.json\'',images),(\''resources.json\'',resources),(\''bundles.json\'',plists),(\''compiler-boundaries.json\'',boundaries)]:\\n  (out/filename).write_text(json.dumps(content,indent=2)+\''\\\\n\'')\\n summary={\''archive_sha256\'':EXPECTED,\''archive_bytes\'':archive.stat().st_size,\''native_images\'':len(images),\''native_symbol_records\'':sum(x[\''native_symbol_records\''] for x in images),\''resource_records\'':len(resources),\''compiler_starts_examined\'':353,\''resolved_contiguous_extents\'':resolved,\''remaining_boundary_unknowns\'':353-resolved,\''source_types_recovered\'':False,\''whole_payload_decompiled\'':False,\''whole_application_build_verified\'':False,\''behavior_equivalence_verified\'':False}\\n (out/\''summary.json\'').write_text(json.dumps(summary,indent=2)+\''\\\\n\'');print(json.dumps(summary,indent=2))\\nif __name__==\''__main__\'':main()\\n", "continuation_target_dossiers.py": "\\"\\"\\"Target-only original-byte evidence. No decompiler profiles or recovery reruns.\\"\\"\\"\\nimport pathlib,hashlib,json,sys,struct,collections\\nfrom capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM\\nfrom payload_inventory import macho\\nroot=pathlib.Path(__file__).resolve().parent;out=root/\''remaining-target-dossiers\'';out.mkdir(exist_ok=True)\\ntargets={\\n \''logic\'':(\''8dc0169c2d2bd0b15a48340a9f1c1508315cd33a2cce3f49704de5ba51734287\'',[(0x8b493c,\''format visitor, inferred name; computed dispatch\'')]),\\n \''macore\'':(\''88a8d93c6cb4b411648601efdfc5ca2863c3b833339e55e2470369df1d3bc9d5\'',[(0x3c144,\''png_write_find_filter; manual candidate integration open\''),(0xc6d64,\''unnamed computed-dispatch function\'')]),\\n \''madsp\'':(\''8b7cbaa383d3050241921e74d1334b22703193afed6ea5e9388599cc42a60fe8\'',[(0xa946c,\''CDS1Seq::GetAllEvents; manual phases integration open\''),(0x449cf0,\''AlchemyPresetSummary::load\''),(0x8961a8,\''PUBInstrument constructor\''),(0x8afac0,\''constructor thunk; not independent implementation\''),(0x8cb148,\''CMidiProcessorSTI::SetupArticulationProperties\'')]),\\n \''magenerativeinstruments\'':(\''cf2e3dc0b233e6e1a878a4040095494d57b0ab97b8ed461b16960d232d6d10d7\'',[(0x77858,\''CGenLua::LuaEnums::enumEntries\''),(0xeecb8,\''BuildDrumInstTreeV1\'')]),\\n \''maplugingui\'':(\''74caec7240779c9be25d4dbf9fde574a2783c8192cca262866b1511bb01fe1b4\'',[(0x25210,\''first ComposeLine; manually recovered candidate\''),(0x26390,\''second ComposeLine; manually recovered candidate\'')])}\\ncs=Cs(CS_ARCH_ARM64,CS_MODE_ARM);cs.detail=True;summary=[];missing=[]\\nfor name,(sha,entries) in targets.items():\\n p=root/f\''{name}-input/target.bin\''\\n if not p.exists():missing.append(name);continue\\n b=p.read_bytes();assert hashlib.sha256(b).hexdigest()==sha;m=macho(b);symbols=collections.defaultdict(list)\\n for s in m[\''symbols\'']:\\n  if not s[\''undefined\'']:symbols[int(s[\''address\''],16)].append(s[\''name\''])\\n def original(a,n):\\n  for vm,off,size in m[\''segments\'']:\\n   if vm<=a and a+n<=vm+size:return b[off+a-vm:off+a-vm+n]\\n  raise ValueError((\''not file backed\'',hex(a),n))\\n (out/f\''{name}-dependencies.json\'').write_text(json.dumps({\''image_sha256\'':sha,\''dependencies\'':m[\''dependencies\''],\''rpaths\'':m[\''rpaths\''],\''uuid\'':m[\''uuid\''],\''source_types_recovered\'':False},indent=2)+\''\\\\n\'')\\n for a,label in entries:\\n  d=out/sha/f\''{a:x}\'';d.mkdir(parents=True,exist_ok=True);idx=m[\''starts\''].index(a);end=m[\''starts\''][idx+1];code=original(a,end-a);ins=list(cs.disasm(code,a));calls=[];branches=[];indirect=[]\\n  for i in ins:\\n   if i.mnemonic==\''bl\'':calls.append({\''from\'':hex(i.address),\''to\'':hex(i.operands[0].imm),\''exact_symbols\'':symbols[i.operands[0].imm]})\\n   elif i.mnemonic in [\''blr\'',\''br\'']:indirect.append({\''address\'':hex(i.address),\''instruction\'':i.mnemonic+\'' \''+i.op_str})\\n   elif i.mnemonic==\''b\'' or i.mnemonic.startswith(\''b.\'') or i.mnemonic in [\''cbz\'',\''cbnz\'',\''tbz\'',\''tbnz\'']:\\n    t=i.operands[-1].imm;branches.append({\''from\'':hex(i.address),\''to\'':hex(t),\''outside_compiler_extent\'':not a<=t<end,\''known_compiler_start\'':t in m[\''starts\'']})\\n  row={\''image\'':name,\''image_sha256\'':sha,\''address\'':hex(a),\''label\'':label,\''native_symbols\'':symbols[a],\''adjacent_compiler_start\'':hex(end),\''compiler_envelope_bytes\'':end-a,\''compiler_envelope_sha256\'':hashlib.sha256(code).hexdigest(),\''all_bytes_decode\'':len(ins)*4==len(code),\''instruction_count\'':len(ins),\''calls\'':calls,\''branches\'':branches,\''indirect_edges\'':indirect,\''extent_is_exact_semantic_function_boundary\'':False,\''semantic_equivalence_verified\'':False,\''warning\'':\''Compiler-adjacent envelope may contain fragments/data. Branches/calls are byte facts, not recovered prototypes or verified semantics.\''}\\n  if (name,a) in [(\''logic\'',0x8b493c),(\''macore\'',0xc6d64)]:\\n   table,base,domain=(0xfb49a8,0x8b4970,32) if name==\''logic\'' else (0x11ceee,0xc6dc4,256)\\n   raw=original(table,domain*2);row[\''dispatch_audit\'']={\''table\'':hex(table),\''jump_base\'':hex(base),\''index_domain\'':\''raw five-bit caller domain; validity not proven\'' if name==\''logic\'' else \''raw loaded byte domain; validity not proven\'',\''entries\'':[{\''index\'':j,\''target\'':hex(base+4*struct.unpack_from(\''<H\'',raw,2*j)[0]),\''inside_compiler_envelope\'':a<=base+4*struct.unpack_from(\''<H\'',raw,2*j)[0]<end} for j in range(domain)],\''all_entries_are_valid_function_targets\'':False}\\n  (d/\''original-envelope.bin\'').write_bytes(code);(d/\''assembly.txt\'').write_text(\''\\\\n\''.join(f\''{i.address:#x}: {i.mnemonic} {i.op_str}\'' for i in ins)+\''\\\\n\'');(d/\''result.json\'').write_text(json.dumps(row,indent=2)+\''\\\\n\'');summary.append(row)\\nreport={\''targets\'':summary,\''target_records\'':len(summary),\''independent_implementations\'':11,\''thunks\'':1,\''missing_images\'':missing,\''new_decompiler_attempts\'':0,\''new_gap_closures\'':0,\''compiler_boundary_unknowns_unchanged\'':72,\''scope\'':\''Target-only byte envelopes, exact symbol matches, native call/branch and dependency evidence for manual source work. Not decompilation, exact-boundary resolution, source builds or equivalence.\''}\\n(out/\''summary.json\'').write_text(json.dumps(report,indent=2)+\''\\\\n\'');print([(r[\''image\''],r[\''address\''],r[\''compiler_envelope_bytes\''],len(r[\''calls\'']),len(r[\''indirect_edges\''])) for r in summary]);assert len(summary)==12 and not missing\\n", "PRIOR_CHECKPOINT.json": "{\\n  \\"run_id\\": 38781063249,\\n  \\"artifact_id\\": 11996186499,\\n  \\"artifact_name\\": \\"rea-madsp-capacity-phase-evidence\\",\\n  \\"artifact_zip_sha256\\": \\"cc1bd2442c37fb98468c017ce47db4b6ab485136e737fde7252d4414c1d1b53e\\",\\n  \\"commit\\": \\"437fcca96f46ce0ebaa1b443df2d3de2b557fe57\\",\\n  \\"preservation\\": \\"Existing checkpoint is read-only and never overwritten; retain its complete immutable ancestry and original hashes.\\"\\n}\\n"}'')

        for n,s in a.items():pathlib.Path(n).write_text(s)

        shutil.copytree("prior-readonly/madsp-input","madsp-input")

        '
    - uses: actions/download-artifact@v4
      with:
        name: rea-original-input-logic
        run-id: '38670888947'
        github-token: ${{ github.token }}
        path: logic-input
    - uses: actions/download-artifact@v4
      with:
        name: rea-original-input-macore
        run-id: '38670888947'
        github-token: ${{ github.token }}
        path: macore-input
    - uses: actions/download-artifact@v4
      with:
        name: rea-original-input-magenerativeinstruments
        run-id: '38670888947'
        github-token: ${{ github.token }}
        path: magenerativeinstruments-input
    - uses: actions/download-artifact@v4
      with:
        name: rea-original-input-maplugingui
        run-id: '38670888947'
        github-token: ${{ github.token }}
        path: maplugingui-input
    - name: Resolve target envelopes symbols calls and raw dispatch entries
      run: python continuation_target_dossiers.py
    - name: Preserve source originals diagnostics and explicit limits
      if: always()
      shell: python
      run: "import pathlib,shutil,json,hashlib\np=pathlib.Path('evidence');p.mkdir(exist_ok=True)\nfor n in ['payload_inventory.py', 'continuation_target_dossiers.py', 'madsp-input', 'remaining-target-dossiers', 'logic-input', 'macore-input', 'magenerativeinstruments-input', 'maplugingui-input', 'PRIOR_CHECKPOINT.json']:\n q=pathlib.Path(n)\n if q.is_dir():shutil.copytree(q,p/n)\n elif q.is_file():shutil.copy2(q,p/n)\n(p/'LIMITS.txt').write_text('New bounded target-only work. No decompiler retries, no recovered-function reruns, no stubs, no full-image recovery. A source phase or static dossier is not whole-function/application equivalence. Prior checkpoints and original hashes are immutable.\\n')\n(p/'SHA256.json').write_text(json.dumps([{'path':str(q.relative_to(p)),'sha256':hashlib.sha256(q.read_bytes()).hexdigest()} for q in sorted(p.rglob('*')) if q.is_file()],indent=2)+'\\n')"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rea-continuation-dossiers-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 90

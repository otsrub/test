name: REA corrected profile continuation
'on':
  push:
    paths:
    - .github/workflows/rea-profile-continuation.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: rea-corrected-profile-continuation
  cancel-in-progress: false
jobs:
  select:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    outputs:
      has_targets: ${{ steps.choose.outputs.has_targets }}
      has_remaining: ${{ steps.choose.outputs.has_remaining }}
      probe: ${{ steps.choose.outputs.probe }}
      matrix: ${{ steps.choose.outputs.matrix }}
    steps:
    - name: Wait for previous checkpoints to finish
      env:
        GH_TOKEN: ${{ github.token }}
      run: "for tick in $(seq 1 180); do\n state=$(gh api repos/otsrub/test/actions/runs/38670888947 --jq .status)\n if [\
        \ \"$state\" = completed ]; then exit 0; fi\n echo \"Waiting for earlier bounded run to retain its final checkpoints:\
        \ $state\"\n sleep 30\ndone\necho 'Previous run did not complete within the bounded wait' >&2\nexit 1\n"
    - uses: actions/download-artifact@v4
      with:
        pattern: rea-profile-target-*
        run-id: '38670888947'
        github-token: ${{ github.token }}
        path: earlier
        merge-multiple: false
    - name: Select only targets without an earlier decompilation attempt

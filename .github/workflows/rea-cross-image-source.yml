name: REA cross-image source expansion and final-profile assessment
'on':
  push:
    paths:
    - .github/workflows/rea-cross-image-source.yml
permissions:
  contents: read
  actions: read
jobs:
  cross-image-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ github.run_attempt == 1 }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: rea-payload-inventory-and-five-function-module
        run-id: '38698377304'
        github-token: ${{ github.token }}
        path: prior-inventory
    - uses: actions/download-artifact@v4
      with:
        name: rea-five-function-darwin-module-link
        run-id: '38698984659'
        github-token: ${{ github.token }}
        path: prior-link
    - uses: actions/download-artifact@v4
      with:
        pattern: rea-final-admitted-*
        run-id: '38698984659'
        github-token: ${{ github.token }}
        path: final-targets
        merge-multiple: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install official compilers and pinned verification engines
      run: 'sudo apt-get update

        sudo apt-get install -y clang-18 lld-18 llvm-18

        python -m pip install unicorn==2.1.4 capstone==5.0.6 pyelftools==0.32'
    - name: Stage reviewed source, tests and final-profile assessment
      shell: python
      run: 'import pathlib,base64

        p=pathlib.Path("reconstruction");p.mkdir(exist_ok=True)

        assets={''cross_image_subset.c'': '''',
        ''verify_cross_image.py'': '''',
        ''CROSS_IMAGE_STATUS.md'': '''',
        ''final-profile-assessment.json'': ''''}

        for name,data in assets.items():(p/name).write_bytes(base64.b64decode(data))

        '
    - name: Verify three original-byte functions across images and ARM64 ABI
      run: python reconstruction/verify_cross_image.py prior-inventory/inventory reconstruction/new-tests --arm
    - name: Link eight-function standalone module with existing evidence preserved
      run: 'set -eu

        mkdir -p reconstruction/module

        cp prior-link/click.o prior-link/small.o prior-link/madsp_fdc4.o reconstruction/module/

        cp reconstruction/new-tests/cross-image-ios-arm64.o reconstruction/module/

        llvm-ar-18 --format=darwin rcs reconstruction/module/libmobilelogic_eight_function_subset.a reconstruction/module/click.o
        reconstruction/module/small.o reconstruction/module/madsp_fdc4.o reconstruction/module/cross-image-ios-arm64.o

        ld64.lld-18 -arch arm64 -platform_version ios 17.0 17.0 -dylib -install_name @rpath/libmobilelogic_eight_function_subset.dylib
        -undefined error -all_load reconstruction/module/libmobilelogic_eight_function_subset.a -o reconstruction/module/libmobilelogic_eight_function_subset.dylib

        llvm-nm-18 --print-armap reconstruction/module/libmobilelogic_eight_function_subset.a > reconstruction/module/archive-symbols.txt

        llvm-nm-18 --undefined-only reconstruction/module/libmobilelogic_eight_function_subset.dylib > reconstruction/module/undefined-symbols.txt

        test ! -s reconstruction/module/undefined-symbols.txt

        llvm-nm-18 --defined-only reconstruction/module/libmobilelogic_eight_function_subset.dylib > reconstruction/module/defined-symbols.txt

        sha256sum reconstruction/module/*.a reconstruction/module/*.dylib reconstruction/module/*.o > reconstruction/module/SHA256SUMS

        python - <<''PYREPORT''

        import json,pathlib

        p=pathlib.Path(''reconstruction'');r=json.loads((p/''new-tests/verification.json'').read_text());symbols=(p/''module/defined-symbols.txt'').read_text()

        assert len(r[''functions''])==3 and all(f[''compiled_arm64_result_and_memory_matching_cases'']==10262 for f in r[''functions''])

        for name in [''mobilelogic_madsp_fdc4'',''mobilelogic_madsp_10170'',''mobilelogic_madsp_2505c'',''mobilelogic_madsp_25068'',''mobilelogic_madsp_9f7ec8'']+[f[''symbol'']
        for f in r[''functions'']]:assert name in symbols

        (p/''module/build-report.json'').write_text(json.dumps({''source_functions'':8,''original_instruction_bytes'':280,''darwin_archive_and_ios_arm64_dylib_linked'':True,''undefined_symbols'':[],''new_functions_tested'':3,''new_function_cases_each'':10262,''read_access_set_difference_cases'':{f[''symbol'']:f[''read_access_set_difference_cases'']
        for f in r[''functions'']},''whole_app_linked'':False,''whole_app_behavior_verified'':False},indent=2)+''\n'')

        PYREPORT'
    - name: Retain manifests, prior source evidence and final profile checkpoints
      if: always()
      run: 'mkdir -p reconstruction

        cp -R prior-inventory/inventory reconstruction/original-inventory

        cp -R prior-link reconstruction/prior-five-function-evidence

        cp -R final-targets reconstruction/final-profile-targets'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rea-cross-image-eight-function-source-module
        path: reconstruction/
        if-no-files-found: error
        retention-days: 90

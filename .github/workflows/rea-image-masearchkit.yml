name: REA image - MASearchKit
'on':
  push:
    paths:
    - .github/workflows/rea-image-masearchkit.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MASearchKit.framework/MASearchKit
      artifact: rea-image-masearchkit

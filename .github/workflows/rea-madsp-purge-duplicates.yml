name: REA flagged transient purge source
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/rea-madsp-purge-duplicates.yml
      - reconstruction/verify_madsp_purge_duplicates.py
      - reconstruction/madsp_purge_duplicates.c
      - reconstruction/madsp_purge_stale.c
      - reconstruction/package_madsp_purge_source.py
permissions:
  contents: read
  actions: read
jobs:
  recover-and-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [duplicates, stale]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: rea-logic-tail-adapters-evidence
          run-id: '39845208071'
          github-token: ${{ github.token }}
          path: prior
      - uses: actions/download-artifact@v4
        with:
          name: rea-continuation-dossiers-evidence
          run-id: '38815798247'
          github-token: ${{ github.token }}
          path: dossiers
      - name: Install bounded verifier dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          python -m pip install unicorn==2.1.4
      - name: Recover source and execute original comparisons
        env:
          REA_LANE: ${{ matrix.lane }}
        run: |
          python reconstruction/verify_madsp_purge_duplicates.py
      - name: Preserve source and diagnostics
        if: always()
        run: |
          mkdir -p evidence
          cp reconstruction/verify_madsp_purge_duplicates.py reconstruction/madsp_purge_duplicates.c reconstruction/madsp_purge_stale.c evidence/
          cp -a madsp-purge-${{ matrix.lane }} evidence/ 2>/dev/null || true
          sha256sum dossiers/madsp-input/target.bin > evidence/ORIGINAL_SHA256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rea-madsp-purge-${{ matrix.lane }}-evidence
          path: evidence
          retention-days: 90
  clean-source-package:
    needs: recover-and-compare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: rea-madsp-purge-duplicates-evidence
          path: parents/duplicates
      - uses: actions/download-artifact@v4
        with:
          name: rea-madsp-purge-stale-evidence
          path: parents/stale
      - uses: actions/download-artifact@v4
        with:
          name: rea-logic-tail-adapters-evidence
          run-id: '39845208071'
          github-token: ${{ github.token }}
          path: prior
      - uses: actions/download-artifact@v4
        with:
          name: rea-continuation-dossiers-evidence
          run-id: '38815798247'
          github-token: ${{ github.token }}
          path: dossiers
      - name: Clean source build and provenance
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          python -m pip install unicorn==2.1.4
          python reconstruction/package_madsp_purge_source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rea-madsp-purge-clean-source-package
          path: madsp-purge-source-package
          retention-days: 90

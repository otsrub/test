name: REA image - MAApplication
'on':
  push:
    paths:
    - .github/workflows/rea-image-maapplication.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MAApplication.framework/MAApplication
      artifact: rea-image-maapplication

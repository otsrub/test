name: REA image - MASwiftUIControls
'on':
  push:
    paths:
    - .github/workflows/rea-image-maswiftuicontrols.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MASwiftUIControls.framework/MASwiftUIControls
      artifact: rea-image-maswiftuicontrols

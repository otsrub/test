name: REA image - MAMachineLearning
'on':
  push:
    paths:
    - .github/workflows/rea-image-mamachinelearning.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MAMachineLearning.framework/MAMachineLearning
      artifact: rea-image-mamachinelearning

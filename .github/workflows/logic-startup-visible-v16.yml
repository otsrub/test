name: Logic startup file move trace v23
on:
  push:
    branches: [logic-startup-visible-v16]
    paths: [.github/workflows/logic-startup-visible-v16.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Build visible status and request fix dylib
        shell: bash
        run: |
          cat > Fix.m <<'OBJC'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>
          typedef void (^Completion)(NSData*,NSURLResponse*,NSError*);
          typedef id (*TaskIMP)(id,SEL,NSURLRequest*,Completion);
          typedef void (^DownloadCompletion)(NSURL*,NSURLResponse*,NSError*);
          typedef id (*DownloadTaskIMP)(id,SEL,NSURLRequest*,DownloadCompletion);
          typedef id (*DownloadURLIMP)(id,SEL,NSURL*,DownloadCompletion);
          static DownloadTaskIMP originalDownloadTask; static DownloadURLIMP originalDownloadURL;
          static TaskIMP originalTask; static void Log(NSString *s); typedef void (*ResumeIMP)(id,SEL); static ResumeIMP originalResume; static char progressKey; typedef BOOL (*MoveURLIMP)(id,SEL,NSURL*,NSURL*,NSError**); typedef BOOL (*MovePathIMP)(id,SEL,NSString*,NSString*,NSError**); static MoveURLIMP originalMoveURL; static MovePathIMP originalMovePath;          typedef BOOL (*CopyURLIMP)(id,SEL,NSURL*,NSURL*,NSError**); typedef BOOL (*CopyPathIMP)(id,SEL,NSString*,NSString*,NSError**); static CopyURLIMP originalCopyURL; static CopyPathIMP originalCopyPath;
          static void PollTask(NSURLSessionTask *task, NSString *path, NSUInteger sample) {
            NSInteger state=task.state, code=0;
            long long received=task.countOfBytesReceived, expected=task.countOfBytesExpectedToReceive;
            if ([task.response isKindOfClass:NSHTTPURLResponse.class]) code=((NSHTTPURLResponse*)task.response).statusCode;
            Log([NSString stringWithFormat:@"TASK PROGRESS %@ state=%ld http=%ld bytes=%lld/%lld",path,(long)state,(long)code,received,expected]);
            if (state!=NSURLSessionTaskStateCompleted && sample<18) dispatch_after(dispatch_time(DISPATCH_TIME_NOW,10*NSEC_PER_SEC),dispatch_get_global_queue(QOS_CLASS_UTILITY,0),^{ PollTask(task,path,sample+1); });
          }
          static void ResumeHook(id self,SEL cmd){ NSURLRequest *r=nil; @try { r=[self currentRequest]; } @catch(__unused NSException *e) {} if (r.URL) Log([NSString stringWithFormat:@"TASK RESUME %@ %@",r.HTTPMethod?:@"?",r.URL.path?:@"/"]); originalResume(self,cmd); if (!objc_getAssociatedObject(self,&progressKey)) { objc_setAssociatedObject(self,&progressKey,@YES,OBJC_ASSOCIATION_RETAIN_NONATOMIC); NSString *path=r.URL.path?:@"?"; NSURLSessionTask *task=self; dispatch_after(dispatch_time(DISPATCH_TIME_NOW,10*NSEC_PER_SEC),dispatch_get_global_queue(QOS_CLASS_UTILITY,0),^{ PollTask(task,path,0); }); } }
                    static NSString *ShortPath(id p) { if ([p isKindOfClass:NSString.class]) return [p lastPathComponent] ?: @"?"; if ([p isKindOfClass:NSURL.class]) return [p lastPathComponent] ?: @"?"; return @"?"; }          static BOOL CopyURLHook(id self,SEL cmd,NSURL *src,NSURL *dst,NSError **err) { NSDate *start=[NSDate date]; BOOL ok=originalCopyURL(self,cmd,src,dst,err); NSDictionary *a=[NSFileManager.defaultManager attributesOfItemAtPath:src.path error:nil]; long long size=[a fileSize]; Log([NSString stringWithFormat:@"FILE COPY %@ -> %@ ok=%d source_bytes=%lld elapsed=%.2f error=%@",ShortPath(src),(dst.path?:@"?"),ok,size,-[start timeIntervalSinceNow],(err&&*err)?[NSString stringWithFormat:@"%@/%ld",(*err).domain,(long)(*err).code]:@"none"]); return ok; }          static BOOL CopyPathHook(id self,SEL cmd,NSString *src,NSString *dst,NSError **err) { NSDate *start=[NSDate date]; BOOL ok=originalCopyPath(self,cmd,src,dst,err); NSDictionary *a=[NSFileManager.defaultManager attributesOfItemAtPath:src error:nil]; long long size=[a fileSize]; Log([NSString stringWithFormat:@"FILE COPY %@ -> %@ ok=%d source_bytes=%lld elapsed=%.2f error=%@",ShortPath(src),ShortPath(dst),ok,size,-[start timeIntervalSinceNow],(err&&*err)?[NSString stringWithFormat:@"%@/%ld",(*err).domain,(long)(*err).code]:@"none"]); return ok; } static BOOL MoveURLHook(id self,SEL cmd,NSURL *src,NSURL *dst,NSError **err) { NSDictionary *a=[NSFileManager.defaultManager attributesOfItemAtPath:src.path error:nil]; long long size=[a fileSize]; NSDate *start=[NSDate date]; BOOL ok=originalMoveURL(self,cmd,src,dst,err); Log([NSString stringWithFormat:@"FILE MOVE %@ -> %@ ok=%d source_bytes=%lld elapsed=%.2f error=%@",ShortPath(src),ShortPath(dst),ok,size,-[start timeIntervalSinceNow],(err&&*err)?[NSString stringWithFormat:@"%@/%ld",(*err).domain,(long)(*err).code]:@"none"]); return ok; } static BOOL MovePathHook(id self,SEL cmd,NSString *src,NSString *dst,NSError **err) { NSDictionary *a=[NSFileManager.defaultManager attributesOfItemAtPath:src error:nil]; long long size=[a fileSize]; NSDate *start=[NSDate date]; BOOL ok=originalMovePath(self,cmd,src,dst,err); Log([NSString stringWithFormat:@"FILE MOVE %@ -> %@ ok=%d source_bytes=%lld elapsed=%.2f error=%@",ShortPath(src),ShortPath(dst),ok,size,-[start timeIntervalSinceNow],(err&&*err)?[NSString stringWithFormat:@"%@/%ld",(*err).domain,(long)(*err).code]:@"none"]); return ok; } static NSString *subscriptionID;
          static dispatch_queue_t logQueue;
          static NSMutableArray *lines;
          static UITextView *label;
          static BOOL UUID(id v) {
            if (![v isKindOfClass:NSString.class]) return NO;
            NSRegularExpression *r=[NSRegularExpression regularExpressionWithPattern:@"^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$" options:0 error:nil];
            return [r firstMatchInString:v options:0 range:NSMakeRange(0,[v length])]!=nil;
          }
          static void Show(NSString *s) {
          dispatch_async(dispatch_get_main_queue(), ^{
            UIWindow *w=nil;
            for (UIWindow *x in UIApplication.sharedApplication.windows) if (x.isKeyWindow) { w=x; break; }
            if (!w) w=UIApplication.sharedApplication.windows.firstObject;
            if (!w) return;
            if (!label || label.superview!=w) {
              label=[[UITextView alloc] initWithFrame:CGRectZero];
              label.backgroundColor=[UIColor colorWithWhite:0 alpha:0.88];
              label.textColor=UIColor.whiteColor;
              label.font=[UIFont monospacedSystemFontOfSize:13 weight:UIFontWeightRegular];
              label.editable=NO; label.selectable=YES; label.scrollEnabled=YES; label.alwaysBounceVertical=YES;
              label.textContainerInset=UIEdgeInsetsMake(10,10,10,10);
              label.layer.cornerRadius=12; label.clipsToBounds=YES;
              [w addSubview:label];
            }
            CGFloat top=MAX(w.safeAreaInsets.top,24)+8;
            CGFloat height=MIN(w.bounds.size.height*0.45,w.bounds.size.height-top-12);
            label.frame=CGRectMake(10,top,w.bounds.size.width-20,height);
            label.text=s; [w bringSubviewToFront:label];
          });
          }
          static void Log(NSString *s) {
            if (!logQueue) return;
            dispatch_async(logQueue, ^{
              NSDateFormatter *f=[NSDateFormatter new]; f.dateFormat=@"HH:mm:ss";
              NSString *line=[NSString stringWithFormat:@"%@ %@",[f stringFromDate:[NSDate date]],s];
              NSString *dir=NSSearchPathForDirectoriesInDomains(NSDocumentDirectory,NSUserDomainMask,YES).firstObject?:NSTemporaryDirectory();
              NSString *path=[dir stringByAppendingPathComponent:@"LogicStartupFix-v23.txt"];
              NSFileHandle *h=[NSFileHandle fileHandleForWritingAtPath:path];
              NSData *d=[line dataUsingEncoding:NSUTF8StringEncoding]; NSMutableData *md=[NSMutableData dataWithData:d]; uint8_t nl=10; [md appendBytes:&nl length:1]; d=md;
              if (h) { [h seekToEndOfFile]; [h writeData:d]; [h closeFile]; } else [d writeToFile:path atomically:YES];
              [lines addObject:line]; while (lines.count>100) [lines removeObjectAtIndex:0];
              Show([lines componentsJoinedByString:@"\n"]);
            });
          }
          static id Hook(id self,SEL cmd,NSURLRequest *req,Completion cb) {
            NSURLRequest *out=req; NSString *kind=@"NETWORK";
            id json=req.HTTPBody?[NSJSONSerialization JSONObjectWithData:req.HTTPBody options:NSJSONReadingFragmentsAllowed error:nil]:nil;
            if ([json isKindOfClass:NSDictionary.class]) {
              id fid=json[@"feldsparId"];
              if (json[@"appSubscriptionsConfigRequest"]) {
                kind=@"SUBSCRIPTIONS CONFIG";
                if (UUID(fid)) { @synchronized([NSURLSession class]) { subscriptionID=[fid copy]; } Log(@"SUBSCRIPTIONS UUID CAPTURED"); }
              } else if (json[@"logicProConfigRequest"]) {
                kind=@"LOGIC CONFIG"; NSString *replacement=nil;
                @synchronized([NSURLSession class]) { replacement=[subscriptionID copy]; }
                if (!UUID(fid) && UUID(replacement)) {
                  NSMutableDictionary *m=[json mutableCopy]; m[@"feldsparId"]=replacement;
                  NSMutableDictionary *device=[m[@"deviceInfo"] mutableCopy];
                  if (device) { device[@"deviceClass"]=@"ipad"; m[@"deviceInfo"]=device; }
                  NSData *b=[NSJSONSerialization dataWithJSONObject:m options:0 error:nil];
                  if (b) { NSMutableURLRequest *r=[req mutableCopy]; r.HTTPBody=b; out=r; Log(@"LOGIC REQUEST REWRITTEN; DEVICE CLASS IPAD"); }
                  else Log(@"LOGIC REQUEST REWRITE FAILED");
                } else if (!UUID(fid)) Log(@"LOGIC REQUEST NOT REWRITTEN: NO UUID");
                else Log(@"LOGIC REQUEST HAS UUID");
              }
            }
            NSString *path=req.URL.path?:@"/";
            Completion wrapped=cb?^(NSData *data,NSURLResponse *resp,NSError *err) {
              NSInteger code=[resp isKindOfClass:NSHTTPURLResponse.class]?((NSHTTPURLResponse*)resp).statusCode:0;
              Log([NSString stringWithFormat:@"TASK COMPLETE %@ HTTP %ld (%lu bytes)",path,(long)code,(unsigned long)data.length]);
              
              
              if (err) Log([NSString stringWithFormat:@"ERROR %@/%ld",err.domain,(long)err.code]);
              cb(data,resp,err);
            }:nil;
            return originalTask(self,cmd,out,wrapped);
          }
          static DownloadCompletion ObserveDownload(NSString *path,DownloadCompletion cb) {
            return cb?^(NSURL *location,NSURLResponse *resp,NSError *err) {
              long long size=-1; NSString *name=location.lastPathComponent?:@"none"; NSString *sig=@"none";
              if (location) { NSDictionary *a=[NSFileManager.defaultManager attributesOfItemAtPath:location.path error:nil]; if (a) size=[a fileSize]; NSError *readErr=nil; NSFileHandle *h=[NSFileHandle fileHandleForReadingFromURL:location error:&readErr]; if (h) { NSData *head=[h readDataOfLength:8]; NSMutableString *hex=[NSMutableString string]; const unsigned char *p=head.bytes; for (NSUInteger i=0;i<head.length;i++) [hex appendFormat:@"%02x",p[i]]; sig=hex.length?hex:@"empty"; [h closeFile]; } else sig=[NSString stringWithFormat:@"read-error:%ld",(long)readErr.code]; }
              NSInteger code=[resp isKindOfClass:NSHTTPURLResponse.class]?((NSHTTPURLResponse*)resp).statusCode:0; NSString *mime=resp.MIMEType?:@"none";
              Log([NSString stringWithFormat:@"DOWNLOAD COMPLETE %@ status=%ld mime=%@ temp=%@ bytes=%lld sig8=%@ error=%@",path,(long)code,mime,name,size,sig,err?[NSString stringWithFormat:@"%@/%ld",err.domain,(long)err.code]:@"none"]);
              cb(location,resp,err);
            }:nil;
          }
          static id DownloadHook(id self,SEL cmd,NSURLRequest *req,DownloadCompletion cb) {
            return originalDownloadTask(self,cmd,req,ObserveDownload(req.URL.path?:@"?",cb));
          }
          static id DownloadURLHook(id self,SEL cmd,NSURL *url,DownloadCompletion cb) {
            return originalDownloadURL(self,cmd,url,ObserveDownload(url.path?:@"?",cb));
          }
          static NSMutableDictionary *snapshotState;
          static void SnapshotContentFiles(NSUInteger sample) {
            NSArray *roots=@[NSSearchPathForDirectoriesInDomains(NSDocumentDirectory,NSUserDomainMask,YES).firstObject?:@"",NSSearchPathForDirectoriesInDomains(NSApplicationSupportDirectory,NSUserDomainMask,YES).firstObject?:@"",NSSearchPathForDirectoriesInDomains(NSCachesDirectory,NSUserDomainMask,YES).firstObject?:@"",NSTemporaryDirectory()?:@""];
            NSMutableDictionary *now=[NSMutableDictionary new]; NSUInteger seen=0; NSFileManager *fm=NSFileManager.defaultManager;
            for (NSString *root in roots) { if (!root.length) continue; NSDirectoryEnumerator *e=[fm enumeratorAtURL:[NSURL fileURLWithPath:root] includingPropertiesForKeys:@[NSURLIsRegularFileKey,NSURLFileSizeKey] options:NSDirectoryEnumerationSkipsHiddenFiles errorHandler:nil]; for (NSURL *u in e) { if (++seen>2500) break; NSString *ext=u.pathExtension.lowercaseString; NSString *low=u.path.lowercaseString; if (![(@[@"aar",@"db",@"sqlite",@"sqlite3"]) containsObject:ext] && ![low containsString:@"contentdatabase"] && ![low containsString:@"contentdb"]) continue; NSDictionary *a=[fm attributesOfItemAtPath:u.path error:nil]; long long size=a?[a fileSize]:-1; NSString *key=[NSString stringWithFormat:@"%@/%@",u.URLByDeletingLastPathComponent.lastPathComponent?:@"?",u.lastPathComponent?:@"?"]; NSString *value=[NSString stringWithFormat:@"%lld",size]; now[key]=value; if (![snapshotState[key] isEqual:value]) Log([NSString stringWithFormat:@"CONTENT FILE path=%@ bytes=%lld",key,size]); } if (seen>2500) break; }
            for (NSString *key in snapshotState) if (!now[key]) Log([NSString stringWithFormat:@"CONTENT FILE REMOVED path=%@",key]); snapshotState=now;
            if (sample<12) dispatch_after(dispatch_time(DISPATCH_TIME_NOW,5*NSEC_PER_SEC),dispatch_get_global_queue(QOS_CLASS_UTILITY,0),^{ SnapshotContentFiles(sample+1); });
          }
          static void InstallLifecycleTrace(void) {
            NSArray *names=@[UIApplicationDidBecomeActiveNotification,UIApplicationWillResignActiveNotification,UIApplicationDidEnterBackgroundNotification,UIApplicationWillEnterForegroundNotification];
            for (NSNotificationName n in names) [[NSNotificationCenter defaultCenter] addObserverForName:n object:nil queue:nil usingBlock:^(NSNotification *note){ Log([NSString stringWithFormat:@"LIFECYCLE %@",note.name]); }];
            Log([NSString stringWithFormat:@"APP STATE AT HOOK state=%ld windows=%lu",(long)UIApplication.sharedApplication.applicationState,(unsigned long)UIApplication.sharedApplication.windows.count]);
          }
          __attribute__((constructor)) static void Start(void) {
            if (![NSBundle.mainBundle.bundleIdentifier isEqualToString:@"com.apple.mobilelogic"]) return;
            logQueue=dispatch_queue_create("logic.visible.status.v23",DISPATCH_QUEUE_SERIAL); lines=[NSMutableArray new];
            Method du=class_getInstanceMethod(NSURLSession.class,@selector(downloadTaskWithURL:completionHandler:)); if (du) { originalDownloadURL=(DownloadURLIMP)method_getImplementation(du); method_setImplementation(du,(IMP)DownloadURLHook); Log(@"DOWNLOAD URL COMPLETION HOOK INSTALLED"); }
            Method dm=class_getInstanceMethod(NSURLSession.class,@selector(downloadTaskWithRequest:completionHandler:)); if (dm) { originalDownloadTask=(DownloadTaskIMP)method_getImplementation(dm); method_setImplementation(dm,(IMP)DownloadHook); Log(@"DOWNLOAD COMPLETION HOOK INSTALLED"); }
            Method cu=class_getInstanceMethod(NSFileManager.class,@selector(copyItemAtURL:toURL:error:)); if (cu) { originalCopyURL=(CopyURLIMP)method_getImplementation(cu); method_setImplementation(cu,(IMP)CopyURLHook); Log(@"FILE COPY URL HOOK INSTALLED"); }
            Method cp=class_getInstanceMethod(NSFileManager.class,@selector(copyItemAtPath:toPath:error:)); if (cp) { originalCopyPath=(CopyPathIMP)method_getImplementation(cp); method_setImplementation(cp,(IMP)CopyPathHook); Log(@"FILE COPY PATH HOOK INSTALLED"); }
            Method mu=class_getInstanceMethod(NSFileManager.class,@selector(moveItemAtURL:toURL:error:)); if (mu) { originalMoveURL=(MoveURLIMP)method_getImplementation(mu); method_setImplementation(mu,(IMP)MoveURLHook); Log(@"FILE MOVE URL HOOK INSTALLED"); }
            Method mp=class_getInstanceMethod(NSFileManager.class,@selector(moveItemAtPath:toPath:error:)); if (mp) { originalMovePath=(MovePathIMP)method_getImplementation(mp); method_setImplementation(mp,(IMP)MovePathHook); Log(@"FILE MOVE PATH HOOK INSTALLED"); }
            InstallLifecycleTrace(); SnapshotContentFiles(0);
            Log(@"PATCH LOADED; WAITING FOR CONFIG");
            Method tm=class_getInstanceMethod(objc_getClass("NSURLSessionTask"),@selector(resume)); if (tm) { originalResume=(ResumeIMP)method_getImplementation(tm); method_setImplementation(tm,(IMP)ResumeHook); } Method m=class_getInstanceMethod(objc_getClass("NSURLSession"),@selector(dataTaskWithRequest:completionHandler:));
            if (m) { originalTask=(TaskIMP)method_getImplementation(m); method_setImplementation(m,(IMP)Hook); }
            dispatch_after(dispatch_time(DISPATCH_TIME_NOW,2*NSEC_PER_SEC),dispatch_get_main_queue(),^{ Log(@"APP ACTIVE; STATUS OVERLAY READY"); });
          }
          OBJC
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc -isysroot "$SDK" -miphoneos-version-min=15.0 -install_name @rpath/LogicStartupVisible.dylib -framework Foundation -framework UIKit -framework CoreGraphics -o LogicStartupVisible.dylib Fix.m
          file LogicStartupVisible.dylib
      - name: Upload v23 file-processing trace and compatibility tweak
        uses: actions/upload-artifact@v4
        with:
          name: logic-startup-visible-v23-dylib
          path: LogicStartupVisible.dylib
          retention-days: 30

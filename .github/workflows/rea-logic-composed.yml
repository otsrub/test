name: REA Logic composed source lanes
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/rea-logic-composed.yml
permissions:
  contents: read
  actions: read
jobs:
  original-source-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane: [composed-tail, prehelper]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: rea-logic-tail-adapters-evidence
          run-id: '39845208071'
          github-token: ${{ github.token }}
          path: prior
      - uses: actions/download-artifact@v4
        with:
          name: rea-continuation-dossiers-evidence
          run-id: '38815798247'
          github-token: ${{ github.token }}
          path: dossiers
      - name: Install bounded verifier dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18
          python -m pip install unicorn==2.1.4
      - name: Stage source verifier
        run: |
          mkdir -p logic-input
          cp dossiers/logic-input/target.bin logic-input/target.bin
          printf '%s' '' | base64 -d | gzip -d > verify_logic_composed.py
          echo 'd436784b64cdd596b9769c8b77957ebc1f8cfb19be1f8baa087a798d158e2422  verify_logic_composed.py' | sha256sum -c -
          echo 'c7e09be891a5cf7c1ab3df11dddb6066bb41acd674fb3f8125c5719cf9316747  prior/verify_logic_tail_adapters.py' | sha256sum -c -
      - name: Compile and compare uninterrupted original slice
        env:
          REA_LANE: ${{ matrix.lane }}
        run: python verify_logic_composed.py
      - name: Preserve new evidence
        if: always()
        run: |
          mkdir -p evidence
          cp verify_logic_composed.py evidence/
          cp -a logic-${{ matrix.lane }} evidence/ 2>/dev/null || true
          sha256sum logic-input/target.bin > evidence/ORIGINAL_SHA256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rea-logic-${{ matrix.lane }}-evidence
          path: evidence
          retention-days: 90

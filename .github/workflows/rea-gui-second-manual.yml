name: REA second ComposeLine pointer arithmetic verification
'on':
  push:
    paths:
    - .github/workflows/rea-gui-second-manual.yml
permissions:
  contents: read
  actions: read
jobs:
  gui-second-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ github.run_attempt == 1 }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: rea-second-composeline-manual-evidence
        run-id: '38776924706'
        github-token: ${{ github.token }}
        path: rejected-harness-checkpoint
    - uses: actions/download-artifact@v4
      with:
        name: rea-png-gui-manual-source-evidence
        run-id: '38776383102'
        github-token: ${{ github.token }}
        path: prior-checkpoint
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install official compiler and pinned emulator
      run: 'sudo apt-get update

        sudo apt-get install -y clang-18 lld-18 llvm-18

        python -m pip install unicorn==2.1.4 capstone==5.0.6'
    - name: Stage second overload without repeating prior tests
      shell: python
      run: 'import pathlib,shutil,json

        a=json.loads(''{"gui_26390_candidate.c": "/* Instruction-derived second ComposeLine candidate, MAPlugInGUI 0x26390.\\n * Deliberately preserves pointer-dependent blending in the ORIGINAL code.\\n * Do not replace src+1 by src[0]+1: the native MADD consumes the address.\\n * Ordinary distinct buffers, nonnegative count; callback contract unverified.\\n */\\n#include <stdint.h>\\n#include <stddef.h>\\ntypedef unsigned char byte;\\nextern void *memset(void *,int,size_t);\\nextern void mobilelogic_maplugingui_25210_candidate(const void *,byte *,const byte *,const byte *,int,int);\\nstatic unsigned luma(unsigned r,unsigned g,unsigned b) {\\n return (unsigned)(((uint64_t)(299u*r+587u*g+114u*b)*0x418938u)>>32);\\n}\\nvoid mobilelogic_maplugingui_26390_candidate(const void *mode,byte *dst,const byte *src,const byte *rgba,int length,int extra) {\\n int32_t kind;__builtin_memcpy(&kind,mode,4);unsigned alpha=((const byte *)mode)[6];\\n if(kind==31||kind==32) {mobilelogic_maplugingui_25210_candidate(mode,dst,src,rgba,length,extra);return;}\\n if(!length)return;\\n if(kind==0){memset(dst,(int)alpha,(uint32_t)length);return;}\\n if(kind==1) {\\n  if(alpha==255) for(int i=0;i<length;i++,rgba+=4) *dst++=(byte)(((rgba[1]+rgba[2]+rgba[3])*0x5556u)>>16);\\n  return;\\n }\\n if(kind!=2 && kind!=6 && kind!=8 && kind!=14)return;\\n if(kind==14 && !alpha)return;\\n for(int i=0;i<length;i++,rgba+=4,src++,dst++) {\\n  unsigned gray;\\n  if(kind==8)gray=luma(rgba[1]*(*src)>>8,rgba[2]*(*src)>>8,rgba[3]*(*src)>>8);\\n  else gray=luma(rgba[1],rgba[2],rgba[3]);\\n  if(kind==14) {\\n   if(gray>*src)gray=*src;\\n   if(alpha==255)*dst=(byte)gray;\\n   else *dst=(byte)(((uintptr_t)src*(255u-alpha)+(255u-alpha)+alpha*(gray+1u))>>8);\\n  } else {\\n   unsigned eff=alpha*(rgba[0]+1u)>>8;\\n   if(eff==255)*dst=(byte)gray;\\n   else if(eff)*dst=(byte)(((uintptr_t)(src+1)*(255u-eff)+eff*(gray+1u))>>8);\\n  }\\n }\\n}\\n", "verify_gui_26390.py": "\\"\\"\\"Second ComposeLine built-in paths vs original instructions; callbacks excluded.\\"\\"\\"\\nimport pathlib,hashlib,struct,random,ctypes,subprocess,json,sys\\nfrom unicorn import Uc,UC_ARCH_ARM64,UC_MODE_ARM,UC_HOOK_CODE\\nfrom unicorn.arm64_const import *\\nfrom payload_inventory import macho\\nroot=pathlib.Path(__file__).resolve().parent;out=root/\''gui-26390-review\'';out.mkdir(exist_ok=True)\\nblob=(root/\''maplugingui-input/target.bin\'').read_bytes();sha=hashlib.sha256(blob).hexdigest()\\nassert sha==\''74caec7240779c9be25d4dbf9fde574a2783c8192cca262866b1511bb01fe1b4\''\\nm=macho(blob);A=0x26390;E=0x27a68;assert m[\''starts\''][m[\''starts\''].index(A)+1]==E\\nu=Uc(UC_ARCH_ARM64,UC_MODE_ARM)\\nfor vm,off,n in m[\''segments\'']:\\n if n:u.mem_map(vm&~4095,((vm+n+4095)&~4095)-(vm&~4095));u.mem_write(vm,blob[off:off+n])\\nBASE=0x2000000;SIZE=0x10000;STACK=0x2100000;STOP=0x3000000\\nu.mem_map(BASE,SIZE);u.mem_map(STACK,0x4000);covered=set()\\ndef hook(uc,pc,n,user):\\n assert A<=pc<E,hex(pc)\\n covered.add(pc)\\nu.hook_add(UC_HOOK_CODE,hook)\\nlibs=[];diag=[]\\nfor opt in [0,2,3]:\\n p=out/f\''gui-O{opt}.so\'';argv=[\''cc\'',\''-std=c11\'',f\''-O{opt}\'',\''-Wall\'',\''-Wextra\'',\''-Werror\'',\''-shared\'',\''-fPIC\'',str(root/\''gui_25210_candidate.c\''),str(root/\''gui_26390_candidate.c\''),\''-o\'',str(p)]\\n r=subprocess.run(argv,text=True,capture_output=True);diag.append({\''argv\'':argv,\''exit_code\'':r.returncode,\''stderr\'':r.stderr});(out/\''compile-diagnostics.json\'').write_text(json.dumps(diag,indent=2)+\''\\\\n\'');r.check_returncode()\\n lib=ctypes.CDLL(str(p));f=lib.mobilelogic_maplugingui_26390_candidate;f.argtypes=[ctypes.c_void_p]*4+[ctypes.c_int]*2;f.restype=None;libs.append((lib,f))\\narm=[]\\nif \''--arm\'' in sys.argv:\\n for opt in [0,2,3]:\\n  obj=out/f\''gui-arm-O{opt}.o\'';obj2=out/f\''gui2-arm-O{opt}.o\'';p=out/f\''gui2-arm-O{opt}.dylib\''\\n  for argv in [[\''clang-18\'',\''-target\'',\''arm64-apple-ios17.0\'',f\''-O{opt}\'',\''-ffreestanding\'',\''-Wall\'',\''-Wextra\'',\''-Werror\'',\''-c\'',str(root/\''gui_25210_candidate.c\''),\''-o\'',str(obj)],[\''clang-18\'',\''-target\'',\''arm64-apple-ios17.0\'',f\''-O{opt}\'',\''-ffreestanding\'',\''-Wall\'',\''-Wextra\'',\''-Werror\'',\''-c\'',str(root/\''gui_26390_candidate.c\''),\''-o\'',str(obj2)],[\''ld64.lld-18\'',\''-arch\'',\''arm64\'',\''-platform_version\'',\''ios\'',\''17.0\'',\''17.0\'',\''-dylib\'',\''-undefined\'',\''dynamic_lookup\'',str(obj),str(obj2),\''-o\'',str(p)]]:\\n   r=subprocess.run(argv,text=True,capture_output=True);diag.append({\''argv\'':argv,\''exit_code\'':r.returncode,\''stderr\'':r.stderr});(out/\''compile-diagnostics.json\'').write_text(json.dumps(diag,indent=2)+\''\\\\n\'');r.check_returncode()\\n  b=p.read_bytes();module=macho(b);assert sorted(s[\''name\''] for s in module[\''symbols\''] if s[\''undefined\''])==[\''_memset\'',\''dyld_stub_binder\'']\\n  entry=next(int(s[\''address\''],16) for s in module[\''symbols\''] if s[\''name\'']==\''_mobilelogic_maplugingui_26390_candidate\'')\\n  v=Uc(UC_ARCH_ARM64,UC_MODE_ARM)\\n  for vm,off,n in module[\''segments\'']:\\n   if n:v.mem_map(vm&~4095,((vm+n+4095)&~4095)-(vm&~4095));v.mem_write(vm,b[off:off+n])\\n  v.mem_map(BASE,SIZE);v.mem_map(STACK,0x4000);arm.append((v,entry))\\n(out/\''compile-diagnostics.json\'').write_text(json.dumps(diag,indent=2)+\''\\\\n\'')\\nrng=random.Random(A);host=ctypes.create_string_buffer(SIZE+0x10000);hp=(ctypes.addressof(host)+0xffff)&~0xffff\\nlengths=[0,1,2,7,8,9,15,16,17,31,32,33,63,64,65,127,128,129]\\nkinds=[1,2,6,8,14,31,32,-2147483648,-1,3,7,9,15,30,33,2147483647]\\nalphas=[0,1,2,63,127,128,129,254,255];passed=[0]*3;failures=[];bykind={};arm_passed=[0]*len(arm)\\nfor case in range(len(kinds)*len(alphas)*len(lengths)*4):\\n n=case;kind=kinds[n%len(kinds)];n//=len(kinds);alpha=alphas[n%len(alphas)];n//=len(alphas);length=lengths[n%len(lengths)];n//=len(lengths)\\n ao=case%16;obj=0x100+ao;dst=0x2000+ao;src=0x4000+ao;mask=0x6000+ao\\n initial=bytearray(rng.randbytes(SIZE));struct.pack_into(\''<i\'',initial,obj,kind);initial[obj+6]=alpha;struct.pack_into(\''<Q\'',initial,obj+8,0)\\n if n<3:\\n  initial[src:src+4*length]=bytes([[0,255,128][n]])*(4*length);initial[mask:mask+length]=bytes([[0,255,128][n]])*length\\n u.mem_write(BASE,bytes(initial));u.mem_write(STACK,bytes(0x4000));u.reg_write(UC_ARM64_REG_SP,STACK+0x2000);u.reg_write(UC_ARM64_REG_X30,STOP);u.reg_write(UC_ARM64_REG_CPACR_EL1,3<<20)\\n for reg,value in zip([UC_ARM64_REG_X0,UC_ARM64_REG_X1,UC_ARM64_REG_X2,UC_ARM64_REG_X3,UC_ARM64_REG_X4,UC_ARM64_REG_X5],[BASE+obj,BASE+dst,BASE+src,BASE+mask,length,17]):u.reg_write(reg,value)\\n saved={reg:rng.getrandbits(64) for reg in [UC_ARM64_REG_X19,UC_ARM64_REG_X20,UC_ARM64_REG_X21,UC_ARM64_REG_X22,UC_ARM64_REG_X23,UC_ARM64_REG_X24,UC_ARM64_REG_X25,UC_ARM64_REG_X26,UC_ARM64_REG_X27,UC_ARM64_REG_X28]}\\n # Explicit constants avoid depending on register enum arithmetic for x29.\\n saved[UC_ARM64_REG_X29]=rng.getrandbits(64)\\n for reg,value in saved.items():u.reg_write(reg,value)\\n u.emu_start(A,STOP,count=100000);assert u.reg_read(UC_ARM64_REG_PC)==STOP\\n assert u.reg_read(UC_ARM64_REG_SP)==STACK+0x2000 and all(u.reg_read(reg)==value for reg,value in saved.items())\\n wanted=bytes(u.mem_read(BASE,SIZE));row=bykind.setdefault(str(kind),{\''cases\'':0,\''mismatches\'':0});row[\''cases\'']+=1\\n for j,(_,f) in enumerate(libs):\\n  ctypes.memmove(hp,bytes(initial),SIZE);f(hp+obj,hp+dst,hp+src,hp+mask,length,17);actual=ctypes.string_at(hp,SIZE)\\n  ok=actual==wanted;passed[j]+=ok;row[\''mismatches\'']+=not ok\\n  if not ok and len(failures)<20:\\n   diffs=[i for i,(a,b) in enumerate(zip(actual,wanted)) if a!=b];failures.append({\''case\'':case,\''optimization\'':[0,2,3][j],\''kind\'':kind,\''alpha\'':alpha,\''length\'':length,\''pattern\'':n,\''first_differences\'':[{\''offset\'':hex(i),\''source\'':actual[i],\''original\'':wanted[i]} for i in diffs[:8]]})\\n for j,(v,entry) in enumerate(arm):\\n  v.mem_write(BASE,bytes(initial));v.mem_write(STACK,bytes(0x4000));v.reg_write(UC_ARM64_REG_SP,STACK+0x2000);v.reg_write(UC_ARM64_REG_X30,STOP);v.reg_write(UC_ARM64_REG_CPACR_EL1,3<<20)\\n  for reg,value in zip([UC_ARM64_REG_X0,UC_ARM64_REG_X1,UC_ARM64_REG_X2,UC_ARM64_REG_X3,UC_ARM64_REG_X4,UC_ARM64_REG_X5],[BASE+obj,BASE+dst,BASE+src,BASE+mask,length,17]):v.reg_write(reg,value)\\n  for reg,value in saved.items():v.reg_write(reg,value)\\n  v.emu_start(entry,STOP,count=100000)\\n  ok=v.reg_read(UC_ARM64_REG_PC)==STOP and v.reg_read(UC_ARM64_REG_SP)==STACK+0x2000 and all(v.reg_read(reg)==value for reg,value in saved.items()) and bytes(v.mem_read(BASE,SIZE))==wanted\\n  arm_passed[j]+=ok\\n  if not ok and len(failures)<20:failures.append({\''case\'':case,\''arm_optimization\'':[0,2,3][j],\''kind\'':kind,\''alpha\'':alpha,\''length\'':length})\\n if case%2000==0:print(\''case\'',case,\''passes\'',passed,\''arm\'',arm_passed,flush=True)\\nreport={\''original_image_sha256\'':sha,\''entry\'':hex(A),\''next_compiler_start\'':hex(E),\''extent_bytes\'':E-A,\''source_sha256\'':hashlib.sha256((root/\''gui_26390_candidate.c\'').read_bytes()).hexdigest(),\''cases\'':case+1,\''O0_O2_O3_passes\'':passed,\''mismatches\'':3*(case+1)-sum(passed),\''first_failures\'':failures,\''per_mode\'':bykind,\''original_instruction_locations_exercised\'':len(covered),\''scope\'':\''Original complete entry-to-return built-in paths against host compiled C memory results; distinct valid buffers, nonnegative lengths 0..129, all built-in mode IDs, selected unsupported IDs, 9 opacity edges, 16 alignments, zero/255/128/random source patterns. Callback modes only with null callback; mode 0 real memset tail excluded. Pointer-dependent native arithmetic preserved; host and emulated pointers agree modulo 65536, sufficient for compared byte results. Does not verify callback ABI/behavior, aliasing, access footprints/order, preserved ABI, faults or device runtime.\'',\''full_function_equivalence_verified\'':False,\''new_decompiler_attempts\'':0}\\nreport[\''ARM_O0_O2_O3_passes\'']=arm_passed\\nreport[\''ARM_mismatches\'']=len(arm)*(case+1)-sum(arm_passed)\\nreport[\''unresolved_real_dependencies\'']=[\''memset (mode 0 excluded from execution tests)\'',\''dyld_stub_binder (linker-generated loader reference; not executed)\'']\\nreport[\''standalone_module_link_verified\'']=False\\nreport[\''ARM_scope\'']=\''Original vs actual linked ARM64 source instructions, full modeled memory, SP and x19-x29 preservation; same input restrictions as host tests. SIMD saved registers, access traces, callbacks and aliasing remain unverified.\'' if arm else \''ARM source build/execution not performed in this environment.\''\\n(out/\''verification.json\'').write_text(json.dumps(report,indent=2)+\''\\\\n\'');print(json.dumps(report,indent=2));assert not report[\''mismatches\''] and not report[\''ARM_mismatches\'']\\n"}'')

        for n,s in a.items():pathlib.Path(n).write_text(s)

        for n in ["payload_inventory.py","gui_25210_candidate.c"]:shutil.copy2(pathlib.Path("prior-checkpoint")/n,n)

        shutil.copytree("prior-checkpoint/maplugingui-input","maplugingui-input")

        '
    - name: Compare original host and ARM64 second overload
      run: python verify_gui_26390.py --arm
    - name: Preserve prior checkpoint and second candidate
      if: always()
      shell: python
      run: "import pathlib,shutil,json,hashlib\np=pathlib.Path('evidence');p.mkdir(exist_ok=True)\nfor n in ['rejected-harness-checkpoint','prior-checkpoint','maplugingui-input','gui-26390-review','gui_26390_candidate.c','verify_gui_26390.py','gui_25210_candidate.c','payload_inventory.py']:\n q=pathlib.Path(n)\n if q.is_dir():shutil.copytree(q,p/n)\n elif q.is_file():shutil.copy2(q,p/n)\n(p/'SCOPE.txt').write_text('No full gap closure: non-null callbacks, aliasing, mode 0 real memset execution, SIMD saved ABI, accesses and caller integration remain unverified. Actual source test dylibs retain real unresolved memset import. No replacement callee or decompiler retry. Prior fourteen-function verified subset unchanged.\\n')\n(p/'SHA256.json').write_text(json.dumps([{'path':str(q.relative_to(p)),'sha256':hashlib.sha256(q.read_bytes()).hexdigest()} for q in sorted(p.rglob('*')) if q.is_file()],indent=2)+'\\n')"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rea-second-composeline-manual-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 90

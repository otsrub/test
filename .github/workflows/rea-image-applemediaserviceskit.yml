name: REA image - AppleMediaServicesKit
'on':
  push:
    paths:
    - .github/workflows/rea-image-applemediaserviceskit.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/AppleMediaServicesKit.framework/AppleMediaServicesKit
      artifact: rea-image-applemediaserviceskit

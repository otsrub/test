name: REA image - MADSP
'on':
  push:
    paths:
    - .github/workflows/rea-image-madsp.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MADSP.framework/MADSP
      artifact: rea-image-madsp

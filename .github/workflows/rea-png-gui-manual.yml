n  void (*flush)(void *)=mobilelogic_png_after_sync(p);\\n  if(flush) flush(p);\\n }\\n}\\n\\n#endif\\n", "png_filter_selection_candidate.c": "/* Candidate selection core adapted from libpng 1.6.38 pngwutil.c.\\n * Original libpng license applies; see upstream png.h/LICENSE.\\n * MACore 0x3c144. This returns before the real compression/helper calls.\\n * Object offsets independently observed in original ARM64 instructions.\\n * NOT a full function replacement, ABI reconstruction or gap closure. */\\n#include <stddef.h>\\n#include <stdint.h>\\ntypedef unsigned char png_byte;\\ntypedef png_byte *png_bytep;\\ntypedef uint32_t png_uint_32;\\n#define PNG_SIZE_MAX SIZE_MAX\\n#define PNG_FILTER_NONE 8\\n#define PNG_FILTER_SUB 16\\n#define PNG_FILTER_UP 32\\n#define PNG_FILTER_AVG 64\\n#define PNG_FILTER_PAETH 128\\n#define PNG_FILTER_VALUE_SUB 1\\n#define PNG_FILTER_VALUE_UP 2\\n#define PNG_FILTER_VALUE_AVG 3\\n#define PNG_FILTER_VALUE_PAETH 4\\n#define PNG_WRITE_FILTER_SUPPORTED\\n#define png_debug(a,b) ((void)0)\\ntypedef struct { unsigned char pad[0x218]; png_bytep prev_row,row_buf,try_row,tst_row; unsigned char pad2[0x26]; png_byte do_filter; } candidate_png;\\ntypedef candidate_png *png_structrp;\\ntypedef struct { unsigned char pad[8]; size_t rowbytes; unsigned char pad2[3]; png_byte pixel_depth; } candidate_row;\\ntypedef candidate_row *png_row_infop;\\n_Static_assert(offsetof(candidate_png,do_filter)==0x25e,\\"layout\\");\\n_Static_assert(offsetof(candidate_row,pixel_depth)==0x13,\\"layout\\");\\nstatic size_t /* PRIVATE */\\npng_setup_sub_row(png_structrp png_ptr, png_uint_32 bpp,\\n    size_t row_bytes, size_t lmins)\\n{\\n   png_bytep rp, dp, lp;\\n   size_t i;\\n   size_t sum = 0;\\n   unsigned int v;\\n\\n   png_ptr->try_row[0] = PNG_FILTER_VALUE_SUB;\\n\\n   for (i = 0, rp = png_ptr->row_buf + 1, dp = png_ptr->try_row + 1; i < bpp;\\n        i++, rp++, dp++)\\n   {\\n      v = *dp = *rp;\\n#ifdef PNG_USE_ABS\\n      sum += 128 - abs((int)v - 128);\\n#else\\n 
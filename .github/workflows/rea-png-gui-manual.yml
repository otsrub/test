name: REA PNG and ComposeLine manual source candidates
'on':
  push:
    paths:
    - .github/workflows/rea-png-gui-manual.yml
permissions:
  contents: read
  actions: read
jobs:
  manual-source-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ github.run_attempt == 1 }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: rea-fourteen-function-logic-evidence
        run-id: '38759134393'
        github-token: ${{ github.token }}
        path: prior-fourteen-checkpoint
    - uses: actions/download-artifact@v4
      with:
        name: rea-original-input-macore
        run-id: '38670888947'
        github-token: ${{ github.token }}
        path: macore-input
    - uses: actions/download-artifact@v4
      with:
        name: rea-original-input-maplugingui
        run-id: '38670888947'
        github-token: ${{ github.token }}
        path: maplugingui-input
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install official compiler and pinned emulator
      run: 'sudo apt-get update

        sudo apt-get install -y clang-18 lld-18 llvm-18

        python -m pip install unicorn==2.1.4 capstone==5.0.6'
    - name: Preserve instruction-derived candidates and scripts
      shell: python
      run: 'import pathlib,json

        a=json.loads(''{"png_full_candidate.c": "/* Candidate selection core adapted from libpng 1.6.38 pngwutil.c.\\n * Original libpng license applies; see upstream png.h/LICENSE.\\n * MACore 0x3c144. This returns before the real compression/helper calls.\\n * Object offsets independently observed in original ARM64 instructions.\\n * Full call sequence below remains a candidate with unresolved real helpers.\\n * Tests stop at calls; no whole-function runtime equivalence is claimed. */\\n#include <stddef.h>\\n#include <stdint.h>\\ntypedef unsigned char png_byte;\\ntypedef png_byte *png_bytep;\\ntypedef uint32_t png_uint_32;\\n#define PNG_SIZE_MAX SIZE_MAX\\n#define PNG_FILTER_NONE 8\\n#define PNG_FILTER_SUB 16\\n#define PNG_FILTER_UP 32\\n#define PNG_FILTER_AVG 64\\n#define PNG_FILTER_PAETH 128\\n#define PNG_FILTER_VALUE_SUB 1\\n#define PNG_FILTER_VALUE_UP 2\\n#define PNG_FILTER_VALUE_AVG 3\\n#define PNG_FILTER_VALUE_PAETH 4\\n#define PNG_WRITE_FILTER_SUPPORTED\\n#define png_debug(a,b) ((void)0)\\ntypedef struct {\\n unsigned char pad[0x1f8]; uint32_t num_rows;\\n unsigned char pad1[0x10]; uint32_t row_number;\\n unsigned char pad2[8]; png_bytep prev_row,row_buf,try_row,tst_row;\\n unsigned char pad3[0x26]; png_byte do_filter;\\n unsigned char pad4[0x29]; void (*output_flush)(void *);\\n uint32_t flush_dist,flush_rows;\\n} candidate_png;\\ntypedef candidate_png *png_structrp;\\ntypedef struct { unsigned char pad[8]; size_t rowbytes; unsigned char pad2[3]; png_byte pixel_depth; } candidate_row;\\ntypedef candidate_row *png_row_infop;\\n_Static_assert(offsetof(candidate_png,do_filter)==0x25e,\\"layout\\");\\n_Static_assert(offsetof(candidate_png,output_flush)==0x288,\\"flush layout\\");\\n_Static_assert(offsetof(candidate_png,row_number)==0x20c,\\"row layout\\");\\n_Static_assert(offsetof(candidate_png,flush_rows)==0x294,\\"counter layout\\");\\n_Static_assert(offsetof(candidate_row,pixel_depth)==0x13,\\"layout\\");\\nstatic size_t /* PRIVATE */\\npng_setup_sub_row(png_structrp png_ptr, png_uint_32 bpp,\\n    size_t row_bytes, size_t lmins)\\n{\\n   png_bytep rp, dp, lp;\\n   size_t i;\\n   size_t sum = 0;\\n   unsigned int v;\\n\\n   png_ptr->try_row[0] = PNG_FILTER_VALUE_SUB;\\n\\n   for (i = 0, rp = png_ptr->row_buf + 1, dp = png_ptr->try_row + 1; i < bpp;\\n        i++, rp++, dp++)\\n   {\\n      v = *dp = *rp;\\n#ifdef PNG_USE_ABS\\n      sum += 128 - abs((int)v - 128);\\n#else\\n      sum += (v < 128) ? v : 256 - v;\\n#endif\\n   }\\n\\n   for (lp = png_ptr->row_buf + 1; i < row_bytes;\\n      i++, rp++, lp++, dp++)\\n   {\\n      v = *dp = (png_byte)(((int)*rp - (int)*lp) & 0xff);\\n#ifdef PNG_USE_ABS\\n      sum += 128 - abs((int)v - 128);\\n#else\\n      sum += (v < 128) ? v : 256 - v;\\n#endif\\n\\n      if (sum > lmins)  /* We are already worse, don\''t continue. */\\n        break;\\n   }\\n\\n   return (sum);\\n}\\n\\nstatic void /* PRIVATE */\\npng_setup_sub_row_only(png_structrp png_ptr, png_uint_32 bpp,\\n    size_t row_bytes)\\n{\\n   png_bytep rp, dp, lp;\\n   size_t i;\\n\\n   png_ptr->try_row[0] = PNG_FILTER_VALUE_SUB;\\n\\n   for (i = 0, rp = png_ptr->row_buf + 1, dp = png_ptr->try_row + 1; i < bpp;\\n        i++, rp++, dp++)\\n   {\\n      *dp = *rp;\\n   }\\n\\n   for (lp = png_ptr->row_buf + 1; i < row_bytes;\\n      i++, rp++, lp++, dp++)\\n   {\\n      *dp = (png_byte)(((int)*rp - (int)*lp) & 0xff);\\n   }\\n}\\n\\nstatic size_t /* PRIVATE */\\npng_setup_up_row(png_structrp png_ptr, size_t row_bytes, size_t lmins)\\n{\\n   png_bytep rp, dp, pp;\\n   size_t i;\\n   size_t sum = 0;\\n   unsigned int v;\\n\\n   png_ptr->try_row[0] = PNG_FILTER_VALUE_UP;\\n\\n   for (i = 0, rp = png_ptr->row_buf + 1, dp = png_ptr->try_row + 1,\\n       pp = png_ptr->prev_row + 1; i < row_bytes;\\n       i++, rp++, pp++, dp++)\\n   {\\n      v = *dp = (png_byte)(((int)*rp - (int)*pp) & 0xff);\\n#ifdef PNG_USE_ABS\\n      sum += 128 - abs((int)v - 128);\\n#else\\n      sum += (v < 128) ? v : 256 - v;\\n#endif\\n\\n      if (sum > lmins)  /* We are already worse, don\''t continue. */\\n        break;\\n   }\\n\\n   return (sum);\\n}\\nstatic void /* PRIVATE */\\npng_setup_up_row_only(png_structrp png_ptr, size_t row_bytes)\\n{\\n   png_bytep rp, dp, pp;\\n   size_t i;\\n\\n   png_ptr->try_row[0] = PNG_FILTER_VALUE_UP;\\n\\n   for (i = 0, rp = png_ptr->row_buf + 1, dp = png_ptr->try_row + 1,\\n       pp = png_ptr->prev_row + 1; i < row_bytes;\\n       i++, rp++, pp++, dp++)\\n   {\\n      *dp = (png_byte)(((int)*rp - (int)*pp) & 0xff);\\n   }\\n}\\n\\nstatic size_t /* PRIVATE */\\npng_setup_avg_row(png_structrp png_ptr, png_uint_32 bpp,\\n    size_t row_bytes, size_t lmins)\\n{\\n   png_bytep rp, dp, pp, lp;\\n   png_uint_32 i;\\n   size_t sum = 0;\\n   unsigned int v;\\n\\n   png_ptr->try_row[0] = PNG_FILTER_VALUE_AVG;\\n\\n   for (i = 0, rp = png_ptr->row_buf + 1, dp = png_ptr->try_row + 1,\\n       pp = png_ptr->prev_row + 1; i < bpp; i++)\\n   {\\n      v = *dp++ = (png_byte)(((int)*rp++ - ((int)*pp++ / 2)) & 0xff);\\n\\n#ifdef PNG_USE_ABS\\n      sum += 128 - abs((int)v - 128);\\n#else\\n      sum += (v < 128) ? v : 256 - v;\\n#endif\\n   }\\n\\n   for (lp = png_ptr->row_buf + 1; i < row_bytes; i++)\\n   {\\n      v = *dp++ = (png_byte)(((int)*rp++ - (((int)*pp++ + (int)*lp++) / 2))\\n          & 0xff);\\n\\n#ifdef PNG_USE_ABS\\n      sum += 128 - abs((int)v - 128);\\n#else\\n      sum += (v < 128) ? v : 256 - v;\\n#endif\\n\\n      if (sum > lmins)  /* We are already worse, don\''t continue. */\\n        break;\\n   }\\n\\n   return (sum);\\n}\\nstatic void /* PRIVATE */\\npng_setup_avg_row_only(png_structrp png_ptr, png_uint_32 bpp,\\n    size_t row_bytes)\\n{\\n   png_bytep rp, dp, pp, lp;\\n   png_uint_32 i;\\n\\n   png_ptr->try_row[0] = PNG_FILTER_VALUE_AVG;\\n\\n   for (i = 0, rp = png_ptr->row_buf + 1, dp = png_ptr->try_row + 1,\\n       pp = png_ptr->prev_row + 1; i < bpp; i++)\\n   {\\n      *dp++ = (png_byte)(((int)*rp++ - ((int)*pp++ / 2)) & 0xff);\\n   }\\n\\n   for (lp = png_ptr->row_buf + 1; i < row_bytes; i++)\\n   {\\n      *dp++ = (png_byte)(((int)*rp++ - (((int)*pp++ + (int)*lp++) / 2))\\n          & 0xff);\\n   }\\n}\\n\\nstatic size_t /* PRIVATE */\\npng_setup_paeth_row(png_structrp png_ptr, png_uint_32 bpp,\\n    size_t row_bytes, size_t lmins)\\n{\\n   png_bytep rp, dp, pp, cp, lp;\\n   size_t i;\\n   size_t sum = 0;\\n   unsigned int v;\\n\\n   png_ptr->try_row[0] = PNG_FILTER_VALUE_PAETH;\\n\\n   for (i = 0, rp = png_ptr->row_buf + 1, dp = png_ptr->try_row + 1,\\n       pp = png_ptr->prev_row + 1; i < bpp; i++)\\n   {\\n      v = *dp++ = (png_byte)(((int)*rp++ - (int)*pp++) & 0xff);\\n\\n#ifdef PNG_USE_ABS\\n      sum += 128 - abs((int)v - 128);\\n#else\\n      sum += (v < 128) ? v : 256 - v;\\n#endif\\n   }\\n\\n   for (lp = png_ptr->row_buf + 1, cp = png_ptr->prev_row + 1; i < row_bytes;\\n        i++)\\n   {\\n      int a, b, c, pa, pb, pc, p;\\n\\n      b = *pp++;\\n      c = *cp++;\\n      a = *lp++;\\n\\n      p = b - c;\\n      pc = a - c;\\n\\n#ifdef PNG_USE_ABS\\n      pa = abs(p);\\n      pb = abs(pc);\\n      pc = abs(p + pc);\\n#else\\n      pa = p < 0 ? -p : p;\\n      pb = pc < 0 ? -pc : pc;\\n      pc = (p + pc) < 0 ? -(p + pc) : p + pc;\\n#endif\\n\\n      p = (pa <= pb && pa <=pc) ? a : (pb <= pc) ? b : c;\\n\\n      v = *dp++ = (png_byte)(((int)*rp++ - p) & 0xff);\\n\\n#ifdef PNG_USE_ABS\\n      sum += 128 - abs((int)v - 128);\\n#else\\n      sum += (v < 128) ? v : 256 - v;\\n#endif\\n\\n      if (sum > lmins)  /* We are already worse, don\''t continue. */\\n        break;\\n   }\\n\\n   return (sum);\\n}\\nstatic void /* PRIVATE */\\npng_setup_paeth_row_only(png_structrp png_ptr, png_uint_32 bpp,\\n    size_t row_bytes)\\n{\\n   png_bytep rp, dp, pp, cp, lp;\\n   size_t i;\\n\\n   png_ptr->try_row[0] = PNG_FILTER_VALUE_PAETH;\\n\\n   for (i = 0, rp = png_ptr->row_buf + 1, dp = png_ptr->try_row + 1,\\n       pp = png_ptr->prev_row + 1; i < bpp; i++)\\n   {\\n      *dp++ = (png_byte)(((int)*rp++ - (int)*pp++) & 0xff);\\n   }\\n\\n   for (lp = png_ptr->row_buf + 1, cp = png_ptr->prev_row + 1; i < row_bytes;\\n        i++)\\n   {\\n      int a, b, c, pa, pb, pc, p;\\n\\n      b = *pp++;\\n      c = *cp++;\\n      a = *lp++;\\n\\n      p = b - c;\\n      pc = a - c;\\n\\n#ifdef PNG_USE_ABS\\n      pa = abs(p);\\n      pb = abs(pc);\\n      pc = abs(p + pc);\\n#else\\n      pa = p < 0 ? -p : p;\\n      pb = pc < 0 ? -pc : pc;\\n      pc = (p + pc) < 0 ? -(p + pc) : p + pc;\\n#endif\\n\\n      p = (pa <= pb && pa <=pc) ? a : (pb <= pc) ? b : c;\\n\\n      *dp++ = (png_byte)(((int)*rp++ - p) & 0xff);\\n   }\\n}\\npng_bytep\\nmobilelogic_macore_filter_selection_candidate(png_structrp png_ptr, png_row_infop row_info)\\n{\\n#ifndef PNG_WRITE_FILTER_SUPPORTED\\n   png_write_filtered_row(png_ptr, png_ptr->row_buf, row_info->rowbytes+1);\\n#else\\n   unsigned int filter_to_do = png_ptr->do_filter;\\n   png_bytep row_buf;\\n   png_bytep best_row;\\n   png_uint_32 bpp;\\n   size_t mins;\\n   size_t row_bytes = row_info->rowbytes;\\n\\n   png_debug(1, \\"in png_write_find_filter\\");\\n\\n   /* Find out how many bytes offset each pixel is */\\n   bpp = (row_info->pixel_depth + 7) >> 3;\\n\\n   row_buf = png_ptr->row_buf;\\n   mins = PNG_SIZE_MAX - 256/* so we can detect potential overflow of the\\n                               running sum */;\\n\\n   /* The prediction method we use is to find which method provides the\\n    * smallest value when summing the absolute values of the distances\\n    * from zero, using anything >= 128 as negative numbers.  This is known\\n    * as the \\"minimum sum of absolute differences\\" heuristic.  Other\\n    * heuristics are the \\"weighted minimum sum of absolute differences\\"\\n    * (experimental and can in theory improve compression), and the \\"zlib\\n    * predictive\\" method (not implemented yet), which does test compressions\\n    * of lines using different filter methods, and then chooses the\\n    * (series of) filter(s) that give minimum compressed data size (VERY\\n    * computationally expensive).\\n    *\\n    * GRR 980525:  consider also\\n    *\\n    *   (1) minimum sum of absolute differences from running average (i.e.,\\n    *       keep running sum of non-absolute differences & count of bytes)\\n    *       [track dispersion, too?  restart average if dispersion too large?]\\n    *\\n    *  (1b) minimum sum of absolute differences from sliding average, probably\\n    *       with window size <= deflate window (usually 32K)\\n    *\\n    *   (2) minimum sum of squared differences from zero or running average\\n    *       (i.e., ~ root-mean-square approach)\\n    */\\n\\n\\n   /* We don\''t need to test the \''no filter\'' case if this is the only filter\\n    * that has been chosen, as it doesn\''t actually do anything to the data.\\n    */\\n   best_row = png_ptr->row_buf;\\n\\n   if (PNG_SIZE_MAX/128 <= row_bytes)\\n   {\\n      /* Overflow can occur in the calculation, just select the lowest set\\n       * filter.\\n       */\\n      filter_to_do &= 0U-filter_to_do;\\n   }\\n   else if ((filter_to_do & PNG_FILTER_NONE) != 0 &&\\n         filter_to_do != PNG_FILTER_NONE)\\n   {\\n      /* Overflow not possible and multiple filters in the list, including the\\n       * \''none\'' filter.\\n       */\\n      png_bytep rp;\\n      size_t sum = 0;\\n      size_t i;\\n      unsigned int v;\\n\\n      {\\n         for (i = 0, rp = row_buf + 1; i < row_bytes; i++, rp++)\\n         {\\n            v = *rp;\\n#ifdef PNG_USE_ABS\\n            sum += 128 - abs((int)v - 128);\\n#else\\n            sum += (v < 128) ? v : 256 - v;\\n#endif\\n         }\\n      }\\n\\n      mins = sum;\\n   }\\n\\n   /* Sub filter */\\n   if (filter_to_do == PNG_FILTER_SUB)\\n   /* It\''s the only filter so no testing is needed */\\n   {\\n      png_setup_sub_row_only(png_ptr, bpp, row_bytes);\\n      best_row = png_ptr->try_row;\\n   }\\n\\n   else if ((filter_to_do & PNG_FILTER_SUB) != 0)\\n   {\\n      size_t sum;\\n      size_t lmins = mins;\\n\\n      sum = png_setup_sub_row(png_ptr, bpp, row_bytes, lmins);\\n\\n      if (sum < mins)\\n      {\\n         mins = sum;\\n         best_row = png_ptr->try_row;\\n         if (png_ptr->tst_row != NULL)\\n         {\\n            png_ptr->try_row = png_ptr->tst_row;\\n            png_ptr->tst_row = best_row;\\n         }\\n      }\\n   }\\n\\n   /* Up filter */\\n   if (filter_to_do == PNG_FILTER_UP)\\n   {\\n      png_setup_up_row_only(png_ptr, row_bytes);\\n      best_row = png_ptr->try_row;\\n   }\\n\\n   else if ((filter_to_do & PNG_FILTER_UP) != 0)\\n   {\\n      size_t sum;\\n      size_t lmins = mins;\\n\\n      sum = png_setup_up_row(png_ptr, row_bytes, lmins);\\n\\n      if (sum < mins)\\n      {\\n         mins = sum;\\n         best_row = png_ptr->try_row;\\n         if (png_ptr->tst_row != NULL)\\n         {\\n            png_ptr->try_row = png_ptr->tst_row;\\n            png_ptr->tst_row = best_row;\\n         }\\n      }\\n   }\\n\\n   /* Avg filter */\\n   if (filter_to_do == PNG_FILTER_AVG)\\n   {\\n      png_setup_avg_row_only(png_ptr, bpp, row_bytes);\\n      best_row = png_ptr->try_row;\\n   }\\n\\n   else if ((filter_to_do & PNG_FILTER_AVG) != 0)\\n   {\\n      size_t sum;\\n      size_t lmins = mins;\\n\\n      sum= png_setup_avg_row(png_ptr, bpp, row_bytes, lmins);\\n\\n      if (sum < mins)\\n      {\\n         mins = sum;\\n         best_row = png_ptr->try_row;\\n         if (png_ptr->tst_row != NULL)\\n         {\\n            png_ptr->try_row = png_ptr->tst_row;\\n            png_ptr->tst_row = best_row;\\n         }\\n      }\\n   }\\n\\n   /* Paeth filter */\\n   if (filter_to_do == PNG_FILTER_PAETH)\\n   {\\n      png_setup_paeth_row_only(png_ptr, bpp, row_bytes);\\n      best_row = png_ptr->try_row;\\n   }\\n\\n   else if ((filter_to_do & PNG_FILTER_PAETH) != 0)\\n   {\\n      size_t sum;\\n      size_t lmins = mins;\\n\\n      sum = png_setup_paeth_row(png_ptr, bpp, row_bytes, lmins);\\n\\n     
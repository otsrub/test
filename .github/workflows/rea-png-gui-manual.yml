    - name: Compile complete PNG candidate without replacement dependencies
      run: 'mkdir -p png-arm-objects

        for opt in 0 2 3; do clang-18 -target arm64-apple-ios17.0 -O${opt} -ffreestanding -Wall -Wextra -Werror -c png_full_candidate.c -o png-arm-objects/png-O${opt}.o; llvm-nm-18 --undefined-only png-arm-objects/png-O${opt}.o; done > png-arm-objects/diagnostics.txt 2>&1'
    - name: Collect immutable checkpoint and new evidence
      if: always()
      shell: python
      run: "import pathlib,shutil,json,hashlib\np=pathlib.Path('evidence');p.mkdir(exist_ok=True)\nfor name in ['png_full_candidate.c', 'png_filter_selection_candidate.c', 'verify_png_filter_selection.py', 'verify_png_continuations.py', 'gui_25210_candidate.c', 'verify_gui_25210.py', 'payload_inventory.py', 'LIBPNG-LICENSE.txt', 'CANDIDATE_SCOPE.md', 'prior-fourteen-checkpoint', 'macore-input', 'maplugingui-input', 'png-filter-review', 'png-continuation-review', 'gui-25210-review', 'png-arm-objects']:\n q=pathlib.Path(name)\n if q.is_dir():shutil.copytree(q,p/name)\n elif q.is_file():shutil.copy2(q,p/name)\nrows=[{'path':str(q.relative_to(p)),'sha256':hashlib.sha256(q.read_bytes()).hexdigest()} for q in sorted(p.rglob('*')) if q.is_file()]\n(p/'SHA256.json').write_text(json.dumps(rows,indent=2)+'\\n')"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rea-png-gui-manual-source-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 90

name: REA exact import-tail boundary evidence
'on':
  push:
    paths:
    - .github/workflows/rea-import-tail-boundaries.yml
permissions:
  contents: read
  actions: read
jobs:
  boundary-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ github.run_attempt == 1 }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: rea-linked-ios-execution-and-macore-dispatch
        run-id: '38712297455'
        github-token: ${{ github.token }}
        path: prior
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned original instruction decoder
      run: python -m pip install capstone==5.0.6
    - name: Stage read-only review scripts
      shell: python
      run: 'import pathlib,base64

        p=pathlib.Path("evidence");p.mkdir(exist_ok=True)

        assets={''review_stub_boundaries.py'': '''',
        ''payload_inventory.py'': ''''}

        for name,data in assets.items():(p/name).write_bytes(base64.b64decode(data))

        '
    - name: Download unchanged original archive and verify its SHA256
      run: 'curl --fail --location --retry 3 https://github.com/otsrub/test/releases/download/mobilelogic-3.4-archive/MobileLogic.zip
        -o MobileLogic.zip

        echo "f2a650fd7a51a7bb2bc5e8e5cc35a95236c02723ab3faeb162cca64ee62a744e  MobileLogic.zip" | sha256sum
        -c -'
    - name: Review only 100 unknown extents; retain all prior evidence
      run: 'set -eu

        BOUNDARIES=$(find prior -path "*/inventory/compiler-boundaries.json" -print -quit)

        test -n "$BOUNDARIES"

        cp "$BOUNDARIES" evidence/prior-compiler-boundaries.json

        python evidence/review_stub_boundaries.py MobileLogic.zip "$BOUNDARIES" evidence/second-pass

        cp -R prior evidence/prior-linked-ios-evidence'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rea-original-import-tail-boundary-review
        path: evidence/
        if-no-files-found: error
        retention-days: 90

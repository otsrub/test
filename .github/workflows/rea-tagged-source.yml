name: REA tagged-state source expansion and linked verification
'on':
  push:
    paths:
    - .github/workflows/rea-tagged-source.yml
permissions:
  contents: read
  actions: read
jobs:
  tagged-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ github.run_attempt == 1 }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: rea-original-import-tail-boundary-review
        run-id: '38722411615'
        github-token: ${{ github.token }}
        path: prior
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install official compiler tools and pinned emulator
      run: 'sudo apt-get update

        sudo apt-get install -y clang-18 lld-18 llvm-18

        python -m pip install unicorn==2.1.4 capstone==5.0.6'
    - name: Stage instruction-derived source and actual linked-code verifier
      shell: python
      run: 'import pathlib,base64

        p=pathlib.Path("evidence");p.mkdir(exist_ok=True)

        assets={''tagged_subset.c'': '''',
        ''verify_tagged_subset.py'': '''',
        ''payload_inventory.py'': ''''}

        for name,data in assets.items():(p/name).write_bytes(base64.b64decode(data))

        '
    - name: Compile O0 O2 O3 host and linked iOS modules; differential-test original instructions
      run: 'mkdir -p evidence/inventory

        cp prior/prior-compiler-boundaries.json evidence/inventory/compiler-boundaries.json

        python evidence/verify_tagged_subset.py evidence/inventory evidence/new-tests'
    - name: Link twelve real recovered functions with prior original-width getter
      run: 'set -eu

        mkdir -p evidence/combined

        PREVIOUS=prior/prior-linked-ios-evidence

        EIGHT=$PREVIOUS/prior-eight-function-evidence/module

        llvm-ar-18 --format=darwin rcs evidence/combined/libmobilelogic_twelve_subset.a "$EIGHT/click.o"
        "$EIGHT/small.o" "$EIGHT/cross-image-ios-arm64.o" "$PREVIOUS/read-faithful-module/madsp_fdc4_arm64.o"
        evidence/new-tests/tagged-ios-O2.o

        ld64.lld-18 -arch arm64 -platform_version ios 17.0 17.0 -dylib -install_name @rpath/libmobilelogic_twelve_subset.dylib
        -undefined error -all_load evidence/combined/libmobilelogic_twelve_subset.a -o evidence/combined/libmobilelogic_twelve_subset.dylib

        llvm-nm-18 --undefined-only evidence/combined/libmobilelogic_twelve_subset.dylib > evidence/combined/undefined-symbols.txt

        test ! -s evidence/combined/undefined-symbols.txt

        llvm-nm-18 --defined-only evidence/combined/libmobilelogic_twelve_subset.dylib > evidence/combined/defined-symbols.txt

        llvm-objdump-18 --disassemble evidence/new-tests/tagged-ios-O2.o > evidence/combined/new-source-assembly.txt

        sha256sum evidence/combined/*.a evidence/combined/*.dylib > evidence/combined/SHA256SUMS'
    - name: Execute actual combined Mach-O module against all twelve original functions
      run: 'set -eu

        python evidence/verify_tagged_subset.py evidence/inventory evidence/combined-new-tests --combined
        evidence/combined/libmobilelogic_twelve_subset.dylib

        PREVIOUS=prior/prior-linked-ios-evidence

        cp -R "$PREVIOUS/prior-eight-function-evidence" combined-eight

        cp evidence/combined/libmobilelogic_twelve_subset.dylib combined-eight/module/libmobilelogic_eight_function_subset.dylib

        python "$PREVIOUS/verify_linked_ios.py" combined-eight evidence/combined-eight-tests --require-read-footprint'
    - name: Preserve every prior checkpoint and explicit scope
      if: always()
      run: 'cp -R prior evidence/prior-import-tail-checkpoint

        printf "%s\n" "Only twelve function-local source implementations; no original application link
        or iOS/device runtime. Both decompiler retry profiles exhausted. 12 original gap records and 80
        compiler boundaries remain unresolved. Types and tag meanings are not recovered. No placeholder/runtime
        stubs used." > evidence/SCOPE.txt'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rea-twelve-function-tagged-source-evidence
        path: evidence/
        if-no-files-found: error
        retention-days: 90

name: REA image - AppAnalytics
'on':
  push:
    paths:
    - .github/workflows/rea-image-appanalytics.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/AppAnalytics.framework/AppAnalytics
      artifact: rea-image-appanalytics

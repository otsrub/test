name: REA image - MAMobileRockingGoose
'on':
  push:
    paths:
    - .github/workflows/rea-image-mamobilerockinggoose.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MAMobileRockingGoose.framework/MAMobileRockingGoose
      artifact: rea-image-mamobilerockinggoose

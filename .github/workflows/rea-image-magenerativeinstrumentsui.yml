name: REA image - MAGenerativeInstrumentsUI
'on':
  push:
    paths:
    - .github/workflows/rea-image-magenerativeinstrumentsui.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MAGenerativeInstrumentsUI.framework/MAGenerativeInstrumentsUI
      artifact: rea-image-magenerativeinstrumentsui

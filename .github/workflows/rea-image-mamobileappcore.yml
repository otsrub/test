name: REA image - MAMobileAppCore
'on':
  push:
    paths:
    - .github/workflows/rea-image-mamobileappcore.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MAMobileAppCore.framework/MAMobileAppCore
      artifact: rea-image-mamobileappcore

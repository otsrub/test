name: REA image - MAContentBrowserUI
'on':
  push:
    paths:
    - .github/workflows/rea-image-macontentbrowserui.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/MAContentBrowserUI.framework/MAContentBrowserUI
      artifact: rea-image-macontentbrowserui

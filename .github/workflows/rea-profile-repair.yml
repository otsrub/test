        with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:\n print('## Compiler-start triage',file=f);print(json.dumps(dict(counts)),file=f);print('These\
        \ are byte and mapping observations, not verified recovered functions.',file=f)\nprint(json.dumps({'input_images':len(selected),'compiler_starts_triaged':len(triage),'status_counts':dict(counts)}))\n\
        \nSOURCE\npython prepare.py\n"

    timeout-minutes: 60
    env: &id001
      REA_GHIDRA_DISABLED_ANALYZERS: Objective-C Message Analyzer,Objective-C Type Metadata Analyzer,Demangler GNU,Demangler
        Swift,Call Convention ID
      REA_GHIDRA_STARTUP_TIMEOUT_MS: '2400000'
      GHIDRA_HEADLESS_MAXMEM: 3G
    outputs:
      profile_ready: ${{ steps.status.outputs.profile_ready }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: rea-original-input-macore
        path: input/
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'
    - name: Install verified analysis engines
      run: 'mkdir -p tools evidence runtime-tmp

        curl -fL --retry 3 -o ghidra.zip https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/ghidra_12.1.4_PUBLIC_20260921.zip

        printf ''%s  %s\n'' ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db ghidra.zip | sha256sum -c -

        unzip -q ghidra.zip -d tools

        npm install --prefix rea-tool --no-audit --no-fund rea-agents@6.5.0

        echo "GHIDRA_INSTALL_DIR=$PWD/tools/ghidra_12.1.4_PUBLIC" >> "$GITHUB_ENV"

        echo "TMPDIR=$PWD/runtime-tmp" >> "$GITHUB_ENV"


        test -f rea-tool/node_modules/rea-agents/bridge/ghidra/ReaGhidraAnalysisOptions.java

        node -e "const p=require(''./rea-tool/node_modules/rea-agents/package.json'');if(p.version!==''6.5.0'')process.exit(1)"

        '
    - name: Write and validate single-target recovery client
      run: "mkdir -p recovery evidence\ncat > recovery/one.mjs <<'SOURCE'\nimport {Client} from '../rea-tool/node_modules/@modelcontextprotocol/client/dist/index.mjs';\n\
        import {StdioClientTransport} from '../rea-tool/node_modules/@modelcontextprotocol/client/dist/stdio.mjs';\nimport\
        \ fs from 'node:fs/promises';\nimport {createWriteStream} from 'node:fs';\nimport {createHash} from 'node:crypto';\n\
        import {createGzip} from 'node:zlib';\nimport {pipeline} from 'node:stream/promises';\nimport {once} from 'node:events';\n\
        import path from 'node:path';\n\nexport function normalizeNative(a){if(typeof a!=='string'||!/^0x[0-9a-f]+$/i.test(a))return\
        \ null;return '0x'+BigInt(a).toString(16);}\nexport function admitExact(info,target){return info && normalizeNative(info.entrypoint)===normalizeNative(target)&&info.classification?.external!==true;}\n\
        export function usablePseudo(pseudo,assembly,exact){return Boolean(exact&&typeof pseudo==='string'&&pseudo.trim()&&!pseudo.includes('halt_baddata')&&typeof\
        \ assembly==='string'&&/^\\s*0x[0-9a-f]+:/im.test(assembly));}\nif(process.env.REA_TEST_IMPORT==='1'){}else{await\
        \ main();}\nasync function main(){\n const target=JSON.parse(process.env.TARGET_ROW);if(!normalizeNative(target.address))throw\
        \ new Error('Non-native target rejected');\n const meta=JSON.parse(await fs.readFile('input/image.json','utf8'));if(meta.sha256!==target.sha256||meta.image!==target.image)throw\
        \ new Error('Input identity mismatch');\n const binary=await fs.readFile('input/target.bin');if(createHash('sha256').update(binary).digest('hex')!==target.sha256)throw\
        \ new Error('Input SHA256 mismatch');\n await fs.mkdir('evidence',{recursive:true});\n const result={image:target.image,image_sha256:target.sha256,address:normalizeNative(target.address),status:'running',rea_version:'6.5.0',analysis_profile_override:{disabled_analyzers:process.env.REA_GHIDRA_DISABLED_ANALYZERS.split(',')},max_new_attempts:1,info:'not_attempted',assembly:'not_attempted',pseudocode:'not_attempted',usable_candidate:false,errors:[],semantic_equivalence_verified:false,original_bytes_modified:false};\n\
        \ const save=()=>fs.writeFile('evidence/result.json',JSON.stringify(result,null,2));await save();\n const zip=createGzip({level:6});const\
        \ completed=pipeline(zip,createWriteStream('evidence/rea-evidence.jsonl.gz'));completed.catch(()=>{});\n const serverLog=createWriteStream('evidence/server.log');await\
        \ once(serverLog,'open');\n const transport=new StdioClientTransport({command:process.execPath,args:[path.resolve('rea-tool/node_modules/rea-agents/scripts/rea.mjs'),'--mcp'],env:{...process.env,REA_MCP_MAX_RESPONSE_BYTES:'67108864',NODE_OPTIONS:'--max-old-space-size=6144'},stderr:serverLog,maxBufferSize:67108864});\n\
        \ const client=new Client({name:'mobilelogic-targeted-analysis-profile-repair',version:'1.0.0'});let connected=false;let\
        \ timedOut=false;\n async function record(v){if(!zip.write(JSON.stringify(v)+'\\n'))await once(zip,'drain');}\n async\
        \ function call(name,args,timeout){\n  await fs.writeFile('evidence/active-call.json',JSON.stringify({name,args,timeout,started_utc:new\
        \ Date().toISOString()}));console.log(JSON.stringify({event:'call',name,address:args.procedure??null}));\n  const\
        \ controller=new AbortController();let timer;\n  try{\n   const response=await Promise.race([client.callTool({name,arguments:args},{timeout,resetTimeoutOnProgress:false,maxTotalTimeout:timeout,signal:controller.signal}),new\
        \ Promise((_,reject)=>{timer=setTimeout(()=>{timedOut=true;controller.abort();reject(new Error('Hard request deadline\
        \ exceeded: '+name));},timeout);})]);\n   let value=response.structuredContent;if(value===undefined){const text=response.content?.filter(c=>c.type==='text').map(c=>c.text).join('');value=JSON.parse(text);}\n\
        \   await record({tool:name,arguments:args,result:value,isError:Boolean(response.isError)});\n   if(response.isError||value.error){let\
        \ err=new Error(value.error?.message??'Provider error');err.details=value.error??value;throw err;}\n   const digest=value.subject?.digest?.sha256;if((name!=='open_binary'||digest!==undefined)&&digest!==target.sha256)throw\
        \ new Error('Evidence subject SHA256 mismatch or missing identity');\n   return value.normalized_result;\n  }finally{clearTimeout(timer);}\n\
        \ }\n try{\n  await client.connect(transport);connected=true;\n  const available=new Set((await client.listTools()).tools.map(t=>t.name));for(const\
        \ name of ['open_binary','procedure_info','procedure_assembly','procedure_pseudo_code'])if(!available.has(name))throw\
        \ new Error('Required REA tool absent: '+name);\n  await call('open_binary',{path:path.resolve('input/target.bin'),provider_id:'ghidra'},2400000);\n\
        \  let info,assembly,pseudo;\n  try{info=await call('procedure_info',{procedure:target.address},2400000);await fs.writeFile('evidence/procedure-info.json',JSON.stringify(info,null,2));result.info='recovered';result.exact_entry=admitExact(info,target.address);await\
        \ save();}\n  catch(e){result.info='failed';result.errors.push({tool:'procedure_info',message:e.message,details:e.details});await\
        \ save();throw e;}\n  if(!result.exact_entry){result.status='not_an_exact_native_procedure';result.resolved_entry=info?.entrypoint??null;await\
        \ save();return;}\n  // Preserve assembly before entering the decompiler, so a timeout cannot discard it.\n  try{assembly=await\
        \ call('procedure_assembly',{procedure:target.address},120000);await fs.writeFile('evidence/assembly.txt',typeof assembly==='string'?assembly:JSON.stringify(assembly));result.assembly=typeof\
        \ assembly==='string'&&assembly.trim()?'recovered':'empty';await save();}\n  catch(e){result.assembly='failed';result.errors.push({tool:'procedure_assembly',message:e.message,details:e.details});await\
        \ save();if(timedOut)throw e;}\n  try{pseudo=await call('procedure_pseudo_code',{procedure:target.address},360000);result.pseudocode=typeof\
        \ pseudo==='string'&&pseudo.trim()?'recovered':'empty';await fs.writeFile('evidence/pseudocode.c',typeof pseudo==='string'?pseudo:JSON.stringify(pseudo));result.usable_candidate=usablePseudo(pseudo,assembly,result.exact_entry);await\
        \ save();}\n  catch(e){result.pseudocode='failed';result.errors.push({tool:'procedure_pseudo_code',message:e.message,details:e.details});await\
        \ save();}\n  result.status=result.usable_candidate?'pseudocode_candidate_recovered':'unresolved';\n }catch(e){result.status='unresolved';if(!result.errors.some(x=>x.message===e.message))result.errors.push({tool:'session',message:e.message});}\n\
        \ finally{\n  result.finished_utc=new Date().toISOString();await save();\n  if(connected&&!timedOut){try{await client.callTool({name:'close_binary',arguments:{}},{timeout:5000});}catch{}}\n\
        \  await Promise.race([client.close().catch(()=>{}),new Promise(r=>setTimeout(r,10000))]);serverLog.end();zip.end();await\
        \ completed;\n  const unchanged=createHash('sha256').update(await fs.readFile('input/target.bin')).digest('hex')===target.sha256;result.input_sha256_unchanged=unchanged;if(!unchanged)result.status='input_identity_failure';await\
        \ save();\n  await fs.appendFile(process.env.GITHUB_STEP_SUMMARY,'Target '+target.image+' '+target.address+': '+result.status+'\\\
        n\\nPseudocode candidates require semantic verification.\\n');\n  console.log(JSON.stringify({image:target.image,address:target.address,status:result.status}));if(!result.usable_candidate||!unchanged)process.exitCode=1;\n\
        \ }\n}\n\nSOURCE\nnode --check recovery/one.mjs\n"

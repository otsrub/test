name: REA repeated event-step source core
'on':
  push:
    paths:
    - .github/workflows/rea-continuation-steps.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: rea-continuation-steps-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bounded-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ github.run_attempt == 1 }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: rea-continuation-lanes-evidence
        run-id: '38835100535'
        github-token: ${{ github.token }}
        path: prior-readonly
    - uses: actions/download-artifact@v4
      with:
        name: rea-continuation-steps-evidence
        run-id: '38835374018'
        github-token: ${{ github.token }}
        path: rejected-step-source
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned analysis dependencies
      run: 'sudo apt-get update

        sudo apt-get install -y clang-18 lld-18 llvm-18

        python -m pip install unicorn==2.1.4 capstone==5.0.6'
    - name: Stage bounded source task and immutable checkpoint reference
      shell: python
      run: 'import pathlib,json,shutil

        a=json.loads(''{"payload_inventory.py": "\\"\\"\\"Read-only original archive inventory and conservative compiler extent review.\\nNo binary patching, stubs, type invention, or source-equivalence claims.\\n\\"\\"\\"\\nimport pathlib,struct,hashlib,json,zipfile,sys,collections,plistlib\\nfrom capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM\\nfrom capstone.arm64 import ARM64_OP_IMM\\nEXPECTED=\''f2a650fd7a51a7bb2bc5e8e5cc35a95236c02723ab3faeb162cca64ee62a744e\''\\ndef sha(b):return hashlib.sha256(b).hexdigest()\\ndef cstr(b,o=0):return b[o:].split(b\''\\\\0\'',1)[0].decode(\''utf-8\'',\''replace\'')\\ndef macho(b):\\n assert b[:4]==bytes.fromhex(\''cffaedfe\'')\\n pos=32;segments=[];sections=[];deps=[];rpaths=[];symtab=None;startdata=None;uuid=None;crypt=[];base=None\\n for _ in range(struct.unpack_from(\''<I\'',b,16)[0]):\\n  cmd,size=struct.unpack_from(\''<II\'',b,pos);assert size>=8 and pos+size<=len(b)\\n  if cmd==25:\\n   name=cstr(b[pos+8:pos+24]);vm,vmsz,off,fs=struct.unpack_from(\''<QQQQ\'',b,pos+24);segments.append((vm,off,fs))\\n   if name==\''__TEXT\'':base=vm\\n   for j in range(struct.unpack_from(\''<I\'',b,pos+64)[0]):\\n    p=pos+72+80*j;va,n,fo=struct.unpack_from(\''<QQI\'',b,p+32);sections.append({\''name\'':cstr(b[p:p+16]),\''segment\'':name,\''address\'':va,\''bytes\'':n,\''fileoff\'':fo,\''flags\'':struct.unpack_from(\''<I\'',b,p+64)[0]})\\n  elif cmd in [12,0x80000018,0x8000001f,0x80000023,0x20,13]:\\n   no,ts,cur,compat=struct.unpack_from(\''<IIII\'',b,pos+8);deps.append({\''kind\'':hex(cmd),\''name\'':cstr(b[pos:pos+size],no),\''current_version\'':cur,\''compatibility_version\'':compat})\\n  elif cmd==0x8000001c:rpaths.append(cstr(b[pos:pos+size],struct.unpack_from(\''<I\'',b,pos+8)[0]))\\n  elif cmd==2:symtab=struct.unpack_from(\''<IIII\'',b,pos+8)\\n  elif cmd==0x26:\\n   off,n=struct.unpack_from(\''<II\'',b,pos+8);startdata=b[off:off+n]\\n  elif cmd==0x1b:uuid=b[pos+8:pos+24].hex()\\n  elif cmd in [0x21,0x2c]:crypt.append({\''offset\'':struct.unpack_from(\''<I\'',b,pos+8)[0],\''size\'':struct.unpack_from(\''<I\'',b,pos+12)[0],\''cryptid\'':struct.unpack_from(\''<I\'',b,pos+16)[0]})\\n  pos+=size\\n starts=[]\\n if startdata is not None:\\n  assert base is not None\\n  a=base;v=shift=0\\n  for byte in startdata:\\n   v|=(byte&127)<<shift\\n   if byte&128:shift+=7;continue\\n   if v==0:break\\n   a+=v;starts.append(a);v=shift=0\\n symbols=[]\\n if symtab:\\n  off,n,so,sz=symtab;strings=b[so:so+sz]\\n  for i in range(n):\\n   si,kind,sec,desc,value=struct.unpack_from(\''<IBBHQ\'',b,off+16*i)\\n   if kind&0xe0 or not si:continue\\n   symbols.append({\''name\'':cstr(strings,si),\''address\'':hex(value),\''n_type\'':kind,\''section_index\'':sec,\''description_bits\'':desc,\''external\'':bool(kind&1),\''undefined\'':kind&14==0})\\n return {\''segments\'':segments,\''sections\'':sections,\''dependencies\'':deps,\''rpaths\'':rpaths,\''uuid\'':uuid,\''encryption\'':crypt,\''starts\'':starts,\''symbols\'':symbols}\\ndef review(b,m,row):\\n a=int(row[\''compiler_start\''],16);starts=m[\''starts\''];r={\''image\'':row[\''image\''],\''image_sha256\'':sha(b),\''address\'':hex(a),\''exact_contiguous_extent_verified\'':False,\''semantic_equivalence_verified\'':False}\\n if a not in starts:r[\''status\'']=\''compiler_start_not_in_original_metadata\'';return r\\n index=starts.index(a)\\n if index+1==len(starts):r[\''status\'']=\''last_start_has_no_metadata_upper_bound\'';return r\\n end=starts[index+1];r[\''next_compiler_start\'']=hex(end);code=None\\n for vm,off,n in m[\''segments\'']:\\n  if vm<=a and end<=vm+n:code=b[off+a-vm:off+end-vm]\\n if code is None:r[\''status\'']=\''extent_not_file_backed\'';return r\\n r.update({\''extent_bytes\'':len(code),\''extent_sha256\'':sha(code)})\\n if len(code)>1024*1024:r[\''status\'']=\''extent_exceeds_bounded_review\'';return r\\n cs=Cs(CS_ARCH_ARM64,CS_MODE_ARM);cs.detail=True;ins=list(cs.disasm(code,a));byaddr={i.address:i for i in ins}\\n reasons=[];tails=[];calls=[]\\n if len(ins)*4!=len(code):reasons.append(\''not_all_extent_bytes_decode\'')\\n reachable=set();todo=[a]\\n while todo:\\n  pc=todo.pop()\\n  if pc in reachable:continue\\n  if pc not in byaddr:reasons.append(\''control_flow_outside_decoded_extent\'');continue\\n  reachable.add(pc);i=byaddr[pc];mn=i.mnemonic\\n  if mn in [\''ret\'',\''retaa\'',\''retab\'']:continue\\n  if mn in [\''br\'',\''braa\'',\''brab\'',\''braaz\'',\''brabz\'',\''eret\'',\''brk\'',\''hlt\'',\''udf\'']:reasons.append(\''indirect_or_exception_exit_requires_review\'');continue\\n  if mn==\''b\'':\\n   target=i.operands[-1].imm\\n   if a<=target<end:todo.append(target)\\n   elif target in starts:tails.append(hex(target))\\n   else:reasons.append(\''external_branch_not_known_compiler_start\'')\\n   continue\\n  if mn.startswith(\''b.\'') or mn in [\''cbz\'',\''cbnz\'',\''tbz\'',\''tbnz\'']:\\n   target=i.operands[-1]\\n   if target.type==ARM64_OP_IMM and a<=target.imm<end:todo.append(target.imm)\\n   else:reasons.append(\''conditional_branch_outside_extent\'')\\n  if mn in [\''bl\'',\''blr\'',\''blraa\'',\''blrab\'']:calls.append({\''address\'':hex(pc),\''instruction\'':mn+\'' \''+i.op_str,\''behavior_verified\'':False})\\n  todo.append(pc+4)\\n if reachable!=set(byaddr):reasons.append(\''unreachable_bytes_or_extra_function_fragments\'')\\n if ins and ins[-1].mnemonic not in [\''ret\'',\''retaa\'',\''retab\'',\''b\'']:reasons.append(\''no_terminal_return_or_tail_at_metadata_end\'')\\n reasons=sorted(set(reasons));r.update({\''status\'':\''requires_exact_boundary_review\'' if reasons else \''contiguous_extent_resolved\'',\''exact_contiguous_extent_verified\'':not reasons,\''limitations\'':reasons,\''tail_targets\'':sorted(set(tails)),\''calls\'':calls,\''instruction_count\'':len(ins),\''reachable_instruction_count\'':len(reachable)})\\n # Only resolved extents get original instruction evidence; unknowns retain hashes.\\n if not reasons:r.update({\''original_hex\'':code.hex(),\''assembly\'':[f\''{i.address:#x}: {i.mnemonic} {i.op_str}\'' for i in ins],\''basis\'':\''Original LC_FUNCTION_STARTS adjacent entries; complete decoding; reachable local CFG; explicit return/tail; no inferred Ghidra ranges\''})\\n return r\\ndef main():\\n archive=pathlib.Path(sys.argv[1]);out=pathlib.Path(sys.argv[3]);out.mkdir(parents=True,exist_ok=True)\\n with archive.open(\''rb\'') as f:assert hashlib.file_digest(f,\''sha256\'').hexdigest()==EXPECTED\\n triage=json.loads(pathlib.Path(sys.argv[2]).read_text());wanted=collections.defaultdict(list)\\n for r in triage:wanted[r[\''image\'']].append(r)\\n images=[];resources=[];boundaries=[];seen=set();plists=[]\\n with zipfile.ZipFile(archive) as z,(out/\''symbols.jsonl\'').open(\''w\'') as symbolout:\\n  for member in z.infolist():\\n   if member.is_dir():continue\\n   name=member.filename\\n   with z.open(member) as f:\\n    prefix=f.read(4)\\n    if prefix==bytes.fromhex(\''cffaedfe\''):\\n     b=prefix+f.read();digest=sha(b);m=macho(b)\\n     row={\''path\'':name,\''sha256\'':digest,\''bytes\'':len(b),\''uuid\'':m[\''uuid\''],\''dependencies\'':m[\''dependencies\''],\''rpaths\'':m[\''rpaths\''],\''encryption\'':m[\''encryption\''],\''sections\'':m[\''sections\''],\''native_symbol_records\'':len(m[\''symbols\'']),\''compiler_start_count\'':len(m[\''starts\'']),\''source_types_recovered\'':False}\\n     images.append(row)\\n     for s in m[\''symbols\'']:print(json.dumps({\''image_sha256\'':digest,**s},separators=(\'',\'',\'':\'')),file=symbolout)\\n     if name in wanted:\\n      seen.add(name)\\n      for r in wanted[name]:\\n       assert digest==r[\''image_sha256\''];boundaries.append(review(b,m,r))\\n    else:\\n     h=hashlib.sha256();h.update(prefix);data=bytearray(prefix) if name.endswith(\''Info.plist\'') else None\\n     while chunk:=f.read(1024*1024):\\n      h.update(chunk)\\n      if data is not None:data.extend(chunk)\\n     resources.append({\''path\'':name,\''bytes\'':member.file_size,\''sha256\'':h.hexdigest(),\''kind\'':\''resource-or-metadata-not-reconstructed-source\''})\\n     if data is not None:\\n      try:\\n       p=plistlib.loads(data);plists.append({\''path\'':name,\''bundle_id\'':p.get(\''CFBundleIdentifier\''),\''executable\'':p.get(\''CFBundleExecutable\''),\''minimum_os\'':p.get(\''MinimumOSVersion\''),\''bundle_version\'':p.get(\''CFBundleVersion\''),\''package_type\'':p.get(\''CFBundlePackageType\'')})\\n      except Exception as e:plists.append({\''path\'':name,\''parse_error\'':str(e)})\\n assert seen==set(wanted) and len(boundaries)==353\\n resolved=sum(r[\''exact_contiguous_extent_verified\''] for r in boundaries)\\n for filename,content in [(\''native-images.json\'',images),(\''resources.json\'',resources),(\''bundles.json\'',plists),(\''compiler-boundaries.json\'',boundaries)]:\\n  (out/filename).write_text(json.dumps(content,indent=2)+\''\\\\n\'')\\n summary={\''archive_sha256\'':EXPECTED,\''archive_bytes\'':archive.stat().st_size,\''native_images\'':len(images),\''native_symbol_records\'':sum(x[\''native_symbol_records\''] for x in images),\''resource_records\'':len(resources),\''compiler_starts_examined\'':353,\''resolved_contiguous_extents\'':resolved,\''remaining_boundary_unknowns\'':353-resolved,\''source_types_recovered\'':False,\''whole_payload_decompiled\'':False,\''whole_application_build_verified\'':False,\''behavior_equivalence_verified\'':False}\\n (out/\''summary.json\'').write_text(json.dumps(summary,indent=2)+\''\\\\n\'');print(json.dumps(summary,indent=2))\\nif __name__==\''__main__\'':main()\\n", "continuation_steps.c": "/* MADSP 0xa96c8..0xa9c1c repeated step/lane core only. */\\n#include \\"continuation_step_lanes.c\\"\\ntypedef struct {lanes_input lane;uint32_t steps,swing_offset;} steps_input;\\n_Static_assert(offsetof(steps_input,steps)==112,\\"steps\\");\\nlanes_result mobilelogic_steps_phase(const steps_input *in){\\n lanes_input n;__builtin_memcpy_inline(&n,&in->lane,sizeof(n));\\n lanes_result result={(void *)(uintptr_t)n.note.out,n.previous_bits,n.pad};\\n const unsigned char *object=(void *)(uintptr_t)n.note.object;\\n uint32_t coefficient_bits=0x41295555;float coefficient;__builtin_memcpy_inline(&coefficient,&coefficient_bits,4);\\n for(uint64_t step=0;step<in->steps;step++){\\n  uint32_t bits=0;\\n  if(object[0x1e194+(uint64_t)n.note.selection*32+step]==1)bits=property_ld(object+0x1d90c+(uint64_t)n.note.selection*4);\\n  float value,scaled,ticks,product;uint32_t control,time;\\n  __builtin_memcpy_inline(&value,&bits,4);\\n  __asm__ volatile(\\"fmul %s0, %s2, %s3\\\\n\\\\tfcvtzs %w1, %s0\\":\\"=&w\\"(scaled),\\"=r\\"(control):\\"w\\"(value),\\"w\\"(coefficient));\\n  __asm__ volatile(\\"ucvtf %s0, %2\\\\n\\\\tfmul %s1, %s3, %s0\\":\\"=&w\\"(ticks),\\"=&w\\"(product):\\"r\\"(step),\\"w\\"(n.note.tempo));\\n  /* Separate conversion keeps all register operands explicit and exact. */\\n  __asm__ volatile(\\"fcvtzs %w0, %s1\\":\\"=r\\"(time):\\"w\\"(product));\\n  n.note.step=(uint32_t)step;n.note.time=time;n.note.shifted=time+in->swing_offset;\\n  n.note.out=(uintptr_t)result.out;n.header=1u+((control&127u)<<8);n.value_bits=bits;n.previous_bits=result.previous_bits;n.pad=result.first_property;\\n  result=mobilelogic_lanes_phase(&n);\\n }\\n return result;\\n}\\n", "continuation_step_lanes.c": "/* Generalization: pad carries original w14 between steps. Previous lane source preserved. */\\n/* Original MADSP 0xa9768..0xa96b0: one step across all lanes.\\n * Synthetic mid-function entry; preserves active tests, control packets,\\n * initial property packet, property filtering and note emission. */\\n#include \\"continuation_combined.c\\"\\n#include \\"continuation_step_properties.c\\"\\ntypedef struct {note_input note; uint64_t records; uint32_t lanes,properties,header,value_bits,previous_bits,pad; uint64_t initial_packet;} lanes_input;\\n_Static_assert(offsetof(lanes_input,records)==72,\\"records\\");\\n_Static_assert(offsetof(lanes_input,initial_packet)==104,\\"packet\\");\\ntypedef struct {unsigned char *out;uint32_t previous_bits,first_property;} lanes_result;\\nlanes_result mobilelogic_lanes_phase(const lanes_input *in){\\n note_input n;__builtin_memcpy_inline(&n,&in->note,sizeof(n));\\n unsigned char *out=(void *)(uintptr_t)n.out;float value,previous;\\n __builtin_memcpy_inline(&value,&in->value_bits,4);__builtin_memcpy_inline(&previous,&in->previous_bits,4);\\n uint32_t first=in->pad;\\n const unsigned char *object=(void *)(uintptr_t)n.object;\\n for(uint32_t lane=0;lane<in->lanes;lane++){\\n  const unsigned char *cell=object+8+(uint64_t)n.selection*0x960+(uint64_t)lane*0x60+(uint64_t)n.step*3;\\n  if(!cell[0])continue;\\n  unsigned changed;\\n  __asm__ volatile(\\"fcmp %s1, %s2\\\\n\\\\tcset %w0, ne\\":\\"=r\\"(changed):\\"w\\"(value),\\"w\\"(previous):\\"cc\\");\\n  if(changed){property_st(out,in->header);property_st(out+4,(property_ld(object+0x1d8b0)+lane)&127u);property_st(out+8,n.time);out+=12;previous=value;}\\n  if(in->properties){\\n   if(first){__builtin_memcpy_inline(out,&in->initial_packet,8);property_st(out+8,n.time);out+=12;}\\n   const unsigned char *records=(void *)(uintptr_t)(in->records+(uint64_t)n.selection*0xdc50+(uint64_t)lane*0x8d0);\\n   out=mobilelogic_step_properties(records,(int32_t)property_ld(records+8),lane,n.time,n.step,out);first=0;\\n  }\\n  n.lane=lane;n.out=(uintptr_t)out;out=mobilelogic_note_phase(&n);\\n }\\n uint32_t previous_bits;__builtin_memcpy_inline(&previous_bits,&previous,4);\\n return (lanes_result){out,previous_bits,first};\\n}\\n", "continuation_step_properties.c": "/* Original x2 advances one byte per step at 0xa96b4; no inferred record-field semantics. */\\n#include <stdint.h>\\nstatic uint32_t step_ld(const void *p){uint32_t v;__builtin_memcpy(&v,p,4);return v;}\\nstatic void step_st(void *p,uint32_t v){__builtin_memcpy(p,&v,4);}\\n/* MADSP 0xa97ac..0xa9b68 phase only; ordinary distinct records/output. */\\nunsigned char *mobilelogic_step_properties(const unsigned char *records,int32_t count,uint32_t lane
name: REA decompiler output review 1
'on':
  push:
    paths:
      - .github/workflows/rea-stage-output-1.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: rea-stage-output-1
  cancel-in-progress: false
jobs:
  batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: rea-all-image-coverage-ledger
          run-id: '39765831519'
          github-token: ${{ github.token }}
          path: ledger
      - name: Restore every previous batch key before selection
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json,pathlib,subprocess
          name = 'rea-stage-output-1-evidence'
          data = json.loads(subprocess.check_output([
              'gh','api','repos/otsrub/test/actions/artifacts?name='+name+'&per_page=100']))
          assert data['total_count'] < 100, 'History exceeds page budget; reconcile before another batch'
          for artifact in data['artifacts']:
              assert not artifact['expired'], 'Missing expired attempt history; reconcile before retry'
              run = str(artifact['workflow_run']['id'])
              dest = pathlib.Path('history') / str(artifact['id'])
              subprocess.run(['gh','run','download',run,'--repo','otsrub/test',
                              '--name',name,'--dir',str(dest)],check=True,timeout=180)
      - name: Install pinned original-byte analysis tools
        run: |
          python -m pip install capstone==5.0.6 unicorn==2.1.4
      - name: Retrieve immutable original archive
        run: |
          curl --fail --location --retry 3 --max-time 900 -o MobileLogic.zip https://github.com/otsrub/test/releases/download/mobilelogic-3.4-archive/MobileLogic.zip
      - name: Run disjoint bounded output batch
        run: python reconstruction/stage_batch_worker.py --stage output --shard 1 --limit 64 --cases 1024
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rea-stage-output-1-evidence
          path: |
            stage-output-1/
            reconstruction/stage_batch_worker.py
          retention-days: 90
          if-no-files-found: error

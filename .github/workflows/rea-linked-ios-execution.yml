name: REA linked iOS execution and MACore dispatch evidence
'on':
  push:
    paths:
    - .github/workflows/rea-linked-ios-execution.yml
permissions:
  contents: read
  actions: read
jobs:
  linked-ios-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ github.run_attempt == 1 }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: rea-cross-image-eight-function-source-module
        run-id: '38702061345'
        github-token: ${{ github.token }}
        path: prior-eight
    - uses: actions/download-artifact@v4
      with:
        name: rea-original-input-macore
        run-id: '38670888947'
        github-token: ${{ github.token }}
        path: original-macore
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned emulator and instruction decoder
      run: python -m pip install unicorn==2.1.4 capstone==5.0.6
    - name: Stage exact linked-module verifier and read-only dispatch inspection
      shell: python
      run: 'import pathlib,base64

        p=pathlib.Path("evidence");p.mkdir(exist_ok=True)

        assets={''verify_linked_ios.py'': '''',
        ''inspect_macore_dispatch.py'': '''',
        ''payload_inventory.py'': '''',
        ''LINKED_IOS_SCOPE.md'': '''',
        ''madsp_fdc4_arm64.c'': ''''}

        for name,data in assets.items():(p/name).write_bytes(base64.b64decode(data))

        '
    - name: Install official compiler and Darwin object tools for fidelity correction
      run: 'sudo apt-get update

        sudo apt-get install -y clang-18 lld-18 llvm-18'
    - name: Execute actual linked iOS Mach-O subset against original instructions
      run: python evidence/verify_linked_ios.py prior-eight evidence/linked-ios-tests
    - name: Retain original-width getter read, relink and require read-footprint agreement
      run: 'set -eu

        cp -R prior-eight revised-eight

        mkdir -p evidence/read-faithful-module

        cp evidence/madsp_fdc4_arm64.c evidence/read-faithful-module/

        clang-18 -target arm64-apple-ios17.0 -ffreestanding -O2 -Wall -Wextra -Werror -c evidence/madsp_fdc4_arm64.c -o evidence/read-faithful-module/madsp_fdc4_arm64.o

        llvm-ar-18 --format=darwin rcs evidence/read-faithful-module/libmobilelogic_eight_read_faithful.a prior-eight/module/click.o
        prior-eight/module/small.o evidence/read-faithful-module/madsp_fdc4_arm64.o prior-eight/module/cross-image-ios-arm64.o

        ld64.lld-18 -arch arm64 -platform_version ios 17.0 17.0 -dylib -install_name @rpath/libmobilelogic_eight_read_faithful.dylib
        -undefined error -all_load evidence/read-faithful-module/libmobilelogic_eight_read_faithful.a -o evidence/read-faithful-module/libmobilelogic_eight_read_faithful.dylib

        llvm-nm-18 --undefined-only evidence/read-faithful-module/libmobilelogic_eight_read_faithful.dylib > evidence/read-faithful-module/undefined-symbols.txt

        test ! -s evidence/read-faithful-module/undefined-symbols.txt

        llvm-objdump-18 --disassemble evidence/read-faithful-module/madsp_fdc4_arm64.o > evidence/read-faithful-module/getter-assembly.txt

        cp evidence/read-faithful-module/libmobilelogic_eight_read_faithful.dylib revised-eight/module/libmobilelogic_eight_function_subset.dylib

        python evidence/verify_linked_ios.py revised-eight evidence/read-faithful-tests --require-read-footprint

        sha256sum evidence/read-faithful-module/*.a evidence/read-faithful-module/*.dylib evidence/read-faithful-module/*.o
        > evidence/read-faithful-module/SHA256SUMS'
    - name: Inspect quarantined original MACore dispatch without decompilation retries
      run: python evidence/inspect_macore_dispatch.py original-macore/target.bin evidence/macore-dispatch
    - name: Preserve original input, previous evidence and scope limits
      if: always()
      run: 'mkdir -p evidence

        cp -R prior-eight evidence/prior-eight-function-evidence

        cp -R original-macore evidence/original-macore

        sha256sum original-macore/target.bin prior-eight/module/libmobilelogic_eight_function_subset.dylib > evidence/input-and-linked-module-SHA256SUMS'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rea-linked-ios-execution-and-macore-dispatch
        path: evidence/
        if-no-files-found: error
        retention-days: 90

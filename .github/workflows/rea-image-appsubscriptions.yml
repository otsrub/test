name: REA image - AppSubscriptions
'on':
  push:
    paths:
    - .github/workflows/rea-image-appsubscriptions.yml
    - .github/workflows/rea-framework-worker.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  recover:
    uses: ./.github/workflows/rea-framework-worker.yml
    with:
      image: Frameworks/AppSubscriptions.framework/AppSubscriptions
      artifact: rea-image-appsubscriptions

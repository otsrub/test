name: Logic visible startup status v16
on:
  push:
    branches: [logic-startup-visible-v16]
    paths: [.github/workflows/logic-startup-visible-v16.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Build visible status and request fix dylib
        shell: bash
        run: |
          cat > Fix.m <<'OBJC'
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>
          #import <dispatch/dispatch.h>
          typedef void (^Completion)(NSData*,NSURLResponse*,NSError*);
          typedef id (*TaskIMP)(id,SEL,NSURLRequest*,Completion);
          typedef void (*ResumeIMP)(id,SEL);
          static TaskIMP originalTask;
          static ResumeIMP originalResume;
          static NSString *subscriptionID;
          static dispatch_queue_t logQueue;
          static NSMutableArray *statusLines;
          static NSString *logPath;
          static UIView *statusPanel;
          static UILabel *statusLabel;
          static BOOL IsUUID(id x) {
            if (![x isKindOfClass:NSString.class]) return NO;
            NSRegularExpression *r=[NSRegularExpression regularExpressionWithPattern:@"^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$" options:0 error:nil];
            return [r firstMatchInString:x options:0 range:NSMakeRange(0,[x length])]!=nil;
          }
          static void ShowStatus(NSString *text) {
            dispatch_async(dispatch_get_main_queue(), ^{
              UIWindow *window=nil;
              for (UIWindow *w in UIApplication.sharedApplication.windows) if (w.isKeyWindow) { window=w; break; }
              if (!window) window=UIApplication.sharedApplication.windows.firstObject;
              if (!window) return;
              if (!statusPanel || statusPanel.superview!=window) {
                statusPanel=[[UIView alloc] initWithFrame:CGRectZero];
                statusPanel.backgroundColor=[UIColor colorWithWhite:0 alpha:0.82];
                statusPanel.layer.cornerRadius=12;
                statusPanel.clipsToBounds=YES;
                statusPanel.userInteractionEnabled=NO;
                statusLabel=[[UILabel alloc] initWithFrame:CGRectZero];
                statusLabel.font=[UIFont systemFontOfSize:12 weight:UIFontWeightMedium];
                statusLabel.textColor=UIColor.whiteColor;
                statusLabel.numberOfLines=6;
                statusLabel.lineBreakMode=NSLineBreakByTruncatingTail;
                statusLabel.userInteractionEnabled=NO;
                [statusPanel addSubview:statusLabel];
                [window addSubview:statusPanel];
              }
              CGFloat top=MAX(window.safeAreaInsets.top,24)+6;
              statusPanel.frame=CGRectMake(10,top,window.bounds.size.width-20,112);
              statusLabel.frame=CGRectInset(statusPanel.bounds,10,7);
              statusLabel.text=text;
              [window bringSubviewToFront:statusPanel];
            });
          }
          static void Record(NSString *message) {
            if (!logQueue) return;
            dispatch_async(logQueue, ^{
              NSDateFormatter *f=[NSDateFormatter new]; f.dateFormat=@"HH:mm:ss";
              NSString *line=[NSString stringWithFormat:@"%@ %@",[f stringFromDate:[NSDate date]],message];
              if (!logPath) { NSString *d=NSSearchPathForDirectoriesInDomains(NSDocumentDirectory,NSUserDomainMask,YES).firstObject?:NSTemporaryDirectory(); logPath=[d stringByAppendingPathComponent:@"LogicStartupFix-v16.txt"]; }
              NSFileHandle *h=[NSFileHandle fileHandleForWritingAtPath:logPath];
              NSData *bytes=[[line stringByAppendingString:@"
"] dataUsingEncoding:NSUTF8StringEncoding];
              if (h) { [h seekToEndOfFile]; [h writeData:bytes]; [h closeFile]; }
              else [bytes writeToFile:logPath atomically:YES];
              [statusLines addObject:line];
              while (statusLines.count>6) [statusLines removeObjectAtIndex:0];
              ShowStatus([statusLines componentsJoinedByString:@"
"]);
            });
          }
          @interface LogicFixLifecycle : NSObject @end
          @implementation LogicFixLifecycle
          - (void)becameActive:(NSNotification *)n { Record(@"APP ACTIVE"); }
          @end
          static LogicFixLifecycle *lifecycle;
          static id FixedTask(id self,SEL cmd,NSURLRequest *request,Completion completion) {
            NSURLRequest *out=request;
            NSString *kind=@"network";
            NSData *body=request.HTTPBody;
            id json=body?[NSJSONSerialization JSONObjectWithData:body options:NSJSONReadingFragmentsAllowed error:nil]:nil;
            if ([json isKindOfClass:NSDictionary.class]) {
              id fid=json[@"feldsparId"];
              if (json[@"appSubscriptionsConfigRequest"]) {
                kind=@"SUBSCRIPTION CONFIG";
                if (IsUUID(fid)) { @synchronized([NSURLSession class]) { subscriptionID=[fid copy]; } Record(@"SUBSCRIPTION UUID CAPTURED"); }
                else Record(@"SUBSCRIPTION REQUEST ID INVALID");
              } else if (json[@"logicProConfigRequest"]) {
                kind=@"LOGIC CONFIG";
                if (!IsUUID(fid)) {
                  NSString *replacement=nil;
                  @synchronized([NSURLSession class]) { replacement=[subscriptionID copy]; }
                  if (IsUUID(replacement)) {
                    NSMutableDictionary *fixed=[json mutableCopy]; fixed[@"feldsparId"]=replacement;
                    NSData *newBody=[NSJSONSerialization dataWithJSONObject:fixed options:0 error:nil];
                    if (newBody) { NSMutableURLRequest *mutable=[request mutableCopy]; mutable.HTTPBody=newBody; out=mutable; Record(@"LOGIC REQUEST REWRITTEN WITH VALID UUID"); }
                    else Record(@"LOGIC REQUEST REWRITE FAILED");
                  } else Record(@"LOGIC REQUEST NOT REWRITTEN: NO VALID UUID CAPTURED");
                } else Record(@"LOGIC REQUEST ALREADY HAS VALID UUID");
              }
            }
            NSString *path=request.URL.path?:@"/";
            if ([path containsString:@"contentDB_"]) Record([NSString stringWithFormat:@"CONTENT REQUEST START %@",path.lastPathComponent]);
            Completion wrapped=completion?^(NSData *data,NSURLResponse *response,NSError *error){
              NSInteger code=[response isKindOfClass:NSHTTPURLResponse.class]?((NSHTTPURLResponse*)response).statusCode:0;
              if ([path isEqual:@"/v1/configs"]) Record([NSString stringWithFormat:@"%@ RESPONSE HTTP %ld",kind,(long)code]);
              else if ([path containsString:@"contentDB_"]) Record([NSString stringWithFormat:@"%@ RESPONSE HTTP %ld (%lu bytes)",path.lastPathComponent,(long)code,(unsigned long)data.length]);
              else if ([path containsString:@"contentversion"]) Record([NSString stringWithFormat:@"CONTENT VERSION RESPONSE HTTP %ld",(long)code]);
              if (error) Record([NSString stringWithFormat:@"REQUEST ERROR %@/%ld",error.domain,(long)error.code]);
              completion(data,response,error);
            }:nil;
            return originalTask(self,cmd,out,wrapped);
          }
          static void ResumeHook(id self,SEL cmd) {
            NSURLSessionTask *task=(id)self;
            NSURLRequest *r=task.originalRequest?:task.currentRequest;
            NSString *p=r.URL.path?:@"/";
            if ([p containsString:@"contentDB_"]) Record([NSString stringWithFormat:@"CONTENT TASK RESUMED %@",p.lastPathComponent]);
            if (originalResume) originalResume(self,cmd);
          }
          __attribute__((constructor)) static void Start(void) {
            if (![NSBundle.mainBundle.bundleIdentifier isEqualToString:@"com.apple.mobilelogic"]) return;
            logQueue=dispatch_queue_create("logic.visible.status.v16",DISPATCH_QUEUE_SERIAL);
            statusLines=[NSMutableArray new];
            Record(@"PATCH LOADED; WAITING FOR CONFIG REQUESTS");
            lifecycle=[LogicFixLifecycle new];
            [[NSNotificationCenter defaultCenter] addObserver:lifecycle selector:@selector(becameActive:) name:UIApplicationDidBecomeActiveNotification object:nil];
            dispatch_after(dispatch_time(DISPATCH_TIME_NOW,(int64_t)(2*NSEC_PER_SEC)),dispatch_get_main_queue(),^{ Record(@"APP WINDOW CHECK"); });
            Method m=class_getInstanceMethod(objc_getClass("NSURLSession"),@selector(dataTaskWithRequest:completionHandler:));
            if (m) { originalTask=(TaskIMP)method_getImplementation(m); method_setImplementation(m,(IMP)FixedTask); }
            Method rm=class_getInstanceMethod(objc_getClass("NSURLSessionTask"),@selector(resume));
            if (rm) { originalResume=(ResumeIMP)method_getImplementation(rm); method_setImplementation(rm,(IMP)ResumeHook); }
          }
          OBJC
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc -isysroot "$SDK" -miphoneos-version-min=15.0 -install_name @rpath/LogicStartupVisible.dylib -framework Foundation -framework UIKit -o LogicStartupVisible.dylib Fix.m
          file LogicStartupVisible.dylib
      - name: Upload visible startup status tweak
        uses: actions/upload-artifact@v4
        with:
          name: logic-startup-visible-v16-dylib
          path: LogicStartupVisible.dylib
          retention-days: 30
